version: v2
plugins:
  # TypeScript generation (Node.js services)
  - plugin: buf.build/grpc/typescript:v0.1.0
    out: src/generated
    opt:
      - import_style=commonjs
  - plugin: buf.build/bufbuild/es:v1.9.0
    out: src/generated
  # Python generation (AI services: ai-gateway, ai-embedding-worker, ai-ocr-pipeline)
  - plugin: buf.build/grpc/python:v1.59.3
    out: ../../../services/ai-gateway/src/generated
  - plugin: buf.build/protocolbuffers/python:v25.3
    out: ../../../services/ai-gateway/src/generated
  - plugin: buf.build/grpc/python:v1.59.3
    out: ../../../services/ai-embedding-worker/src/generated
  - plugin: buf.build/protocolbuffers/python:v25.3
    out: ../../../services/ai-embedding-worker/src/generated
  - plugin: buf.build/grpc/python:v1.59.3
    out: ../../../services/ai-ocr-pipeline/src/generated
  - plugin: buf.build/protocolbuffers/python:v25.3
    out: ../../../services/ai-ocr-pipeline/src/generated

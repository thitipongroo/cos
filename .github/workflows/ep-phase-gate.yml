name: EP Phase Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check-stubs:
    name: Check Extension Point Stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stub registry is up to date
        run: |
          echo "Checking extension-points.md is present..."
          test -f extension-points.md || (echo "FAIL: extension-points.md missing" && exit 1)
          echo "Checking stub files log stub calls..."
          # All StubBase subclasses must call logStubCall / log_stub_call
          # Phase 8 adds automated validation of this rule
          echo "EP Phase Gate: PASS (Phase 1 — stub enforcement added in Phase 8)"

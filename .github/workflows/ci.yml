name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.1.0
  NODE_VERSION: '20'

jobs:
  # ─── Step 1: Lint ───────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # pnpm-lock.yaml is committed — use --frozen-lockfile to enforce reproducible installs (Rule 29)
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check

  # ─── Step 2: Type Check ─────────────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # pnpm-lock.yaml is committed — use --frozen-lockfile to enforce reproducible installs (Rule 29)
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check

  # ─── Step 3: Unit Tests + Coverage Enforcement ─────────────────────────────
  # Decision 2/7 (2026-05-31): jest.config created in Phase 1; coverage enforced
  # from Phase 1 onwards per QM-1 (spec §30.3): 100% lines / 100% branches.
  unit-tests:
    name: Unit Tests (coverage 100% lines / 100% branches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # pnpm-lock.yaml is committed — use --frozen-lockfile to enforce reproducible installs (Rule 29)
      - run: pnpm install --frozen-lockfile
      # jest.config.js in each package enforces coverage thresholds (QM-1, Rule 36)
      - name: Unit tests + coverage — backend
        working-directory: backend
        run: pnpm run test:cov
      - name: Unit tests + coverage — @cos/shared
        working-directory: packages/@cos/shared
        run: pnpm run test:cov
      - name: Unit tests + coverage — @cos/database
        working-directory: packages/@cos/database
        run: pnpm run test:cov
      # Rule 36 (2026-05-31): @cos packages with executable logic must have CI coverage
      - name: Unit tests + coverage — @cos/financial (QM-1 financial logic)
        working-directory: packages/@cos/financial
        run: pnpm run test:cov
      - name: Unit tests + coverage — @cos/rbac
        working-directory: packages/@cos/rbac
        run: pnpm run test:cov
      - name: Unit tests + coverage — @cos/validation
        working-directory: packages/@cos/validation
        run: pnpm run test:cov
      - name: Unit tests + coverage — @cos/logger
        working-directory: packages/@cos/logger
        run: pnpm run test:cov
      - name: Unit tests + coverage — @cos/tracing
        working-directory: packages/@cos/tracing
        run: pnpm run test:cov
      - name: Unit tests + coverage — @cos/config
        working-directory: packages/@cos/config
        run: pnpm run test:cov
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/coverage/
            packages/@cos/shared/coverage/
            packages/@cos/database/coverage/
            packages/@cos/financial/coverage/
            packages/@cos/rbac/coverage/
            packages/@cos/validation/coverage/
            packages/@cos/logger/coverage/
            packages/@cos/tracing/coverage/
            packages/@cos/config/coverage/

  # ─── Step 4: Build Docker Images ────────────────────────────────────────────
  build-docker:
    name: Build Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    strategy:
      matrix:
        service:
          - backend
          - services/file-service
          - services/ai-gateway
          - services/analytics-worker
          - services/kg-ingestion-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: cos/${{ matrix.service }}:${{ github.sha }}

  # ─── Step 5a: Dependency Audit (OWASP / pnpm audit) ────────────────────────
  # Source: spec §Phase 16 — "OWASP dependency check in CI pipeline"
  dependency-audit:
    name: Dependency Audit (pnpm audit + govulncheck)
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Node.js dependency audit — fail on HIGH or CRITICAL
      - name: pnpm audit (Node.js dependencies)
        run: pnpm audit --audit-level=high
      # Go vulnerability check for kg-ingestion-worker
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: govulncheck — kg-ingestion-worker
        working-directory: services/kg-ingestion-worker
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: govulncheck — analytics-worker
        working-directory: services/analytics-worker
        run: govulncheck ./...
      # Python safety check for ai-gateway
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit — ai-gateway
        working-directory: services/ai-gateway
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --severity high

  # ─── Step 5b: Security Scan (Trivy) ─────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
      - name: Run Trivy — container image scan (backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: cos/backend:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  # ─── Step 6: Push to ECR (main/staging only) ────────────────────────────────
  push-ecr:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag cos/backend:$IMAGE_TAG $ECR_REGISTRY/cos-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/cos-backend:$IMAGE_TAG
          # Update image tag in GitOps repo to trigger ArgoCD sync
          echo "$IMAGE_TAG" > .argocd-image-tag
      - name: Update ArgoCD image tag (GitOps trigger)
        run: |
          echo "Image tag ${{ github.sha }} pushed — ArgoCD will sync automatically on staging"
          echo "Production requires manual sync gate in ArgoCD UI"

  # ─── Step 7: E2E Tests (staging only) ───────────────────────────────────────
  # Source: spec §Phase 18 — "Playwright E2E test for: login, project create, report submit, dashboard view"
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [push-ecr]
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/

  # ─── Step 8: Load Tests (staging only) ───────────────────────────────────────
  # Source: spec §Phase 18 — "load tests on staging deploy"
  load-tests:
    name: Load Tests (k6)
    runs-on: ubuntu-latest
    needs: [push-ecr]
    if: github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz -L | tar xvz --strip-components 1
          sudo mv k6 /usr/local/bin/
      - name: Run API baseline load test
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
          TENANT_ID: ${{ secrets.STAGING_TENANT_ID }}
        run: k6 run tests/load/api-baseline.js --out json=k6-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: k6-results.json

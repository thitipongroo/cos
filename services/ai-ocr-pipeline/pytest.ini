[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -q
    # QM-1 line-coverage gate. Enabled for THIS service because it is at 100% (see .coveragerc for
    # why `tests/` is omitted from measurement). The remaining Python services are still below the
    # bar and stay ungated until raised — do not copy this block to them beforehand.
    --cov
    --cov-report=term-missing
    --cov-fail-under=99
markers =
    unit: Fast unit tests (no external dependencies)
    integration: Integration tests (requires running services or testcontainers)
    slow: Tests that take more than 2 seconds
filterwarnings =
    error
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:google
    # starlette (pinned 1.3.1 in requirements.txt) warns at fastapi.testclient import that its httpx
    # TestClient is deprecated in favour of httpx2. That is fastapi-internal (not fixable in this
    # service's code) and would break collection under `error`. Mirrors services/ai-gateway/pytest.ini.
    ignore::starlette.exceptions.StarletteDeprecationWarning

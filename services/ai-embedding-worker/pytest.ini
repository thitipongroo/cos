[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -q
    # QM-1 line-coverage gate. Enabled for THIS service because it is at 100% (see .coveragerc for
    # why `tests/` is omitted from measurement). ai-gateway is still below the bar and stays ungated
    # until raised — do not copy this block there beforehand.
    --cov
    --cov-report=term-missing
    --cov-fail-under=99
markers =
    unit: Fast unit tests (no external dependencies)
    integration: Integration tests (requires running services or testcontainers)
    slow: Tests that take more than 2 seconds
filterwarnings =
    error
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:google
    # starlette (pinned 1.3.1 in requirements.txt) warns at fastapi.testclient import that its httpx
    # TestClient is deprecated in favour of httpx2. That is fastapi-internal (not fixable in this
    # service's code) and would break collection under `error`. Mirrors services/ai-gateway/pytest.ini.
    ignore::starlette.exceptions.StarletteDeprecationWarning
    # anyio 4.15.0 (2026-09-02) deprecated the `anyio.abc.BlockingPortal` alias in favour of
    # `anyio.from_thread.BlockingPortal`, and `starlette/testclient.py` reads it at IMPORT time
    # (line 53, `_PortalFactoryType`). Under `error` that turns every module importing TestClient
    # into a collection error — it took out four of the five Python services at once, with nothing
    # in this repository having changed.
    #
    # Not fixable here and not fixable by upgrading: starlette 1.6.0, the newest release, still
    # reads the same alias. Pinning `anyio<4.15` was the alternative and was rejected — it would
    # hold a security-relevant async library back to silence a warning about a name.
    #
    # Matched by MESSAGE, not by `ignore::DeprecationWarning:anyio`: the warning is raised from
    # `anyio/_lazyimport.py` on behalf of the importer, so a module-scoped filter would either miss
    # it or swallow every anyio deprecation. This one names the alias and nothing else.
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning

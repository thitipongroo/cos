[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -q
markers =
    unit: Fast unit tests (no external dependencies)
    integration: Integration tests (requires running services or testcontainers)
    slow: Tests that take more than 2 seconds
filterwarnings =
    error
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:google
    # starlette warns at fastapi.testclient import that httpx TestClient is deprecated in favour of
    # httpx2. It is starlette-internal (not fixable here) and would break collection under `error`.
    # Same ignore ai-gateway already carries — see its pytest.ini.
    ignore::starlette.exceptions.StarletteDeprecationWarning

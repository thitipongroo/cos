[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -q
    # QM-1 line-coverage gate. Enabled for THIS service because it is at 100% (see .coveragerc for
    # why `tests/` is omitted from measurement). ai-gateway is still below the bar and stays ungated
    # until raised — do not copy this block there beforehand.
    --cov
    --cov-report=term-missing
    --cov-fail-under=99
markers =
    unit: Fast unit tests (no external dependencies)
    integration: Integration tests (requires running services or testcontainers)
    slow: Tests that take more than 2 seconds
filterwarnings =
    error
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:google

openapi: 3.1.0
info:
  title: Construction OS — Geo API
  version: v1
  license:
    name: Proprietary — all rights reserved
    identifier: LicenseRef-Proprietary
  description: |
    Reverse geocoding for the coordinates the platform already records — a site report's location,
    a check-in, a photo.

    **The geocoder is self-hosted** (Nominatim over the Geofabrik Thailand extract, in-cluster). A
    coordinate is where a named worker stood at a named time, so sending it to a third-party
    geocoder would export exactly the data PDPA treats most carefully, one lookup at a time, for a
    label. Nothing here leaves the tenant.

    Written 2026-08-24; the route had run with no OpenAPI document and no §14 row.

    **Reviewed 2026-09-03** against `backend/src/modules/geo/` at 7291fc97. The only change to the
    controller or its DTOs since this document was last written is `JwtAuthGuard` moving from
    `../identity/guards/` to `../../shared/guards/` — an import path, not a route, a payload or a
    status code. This line records the comparison the freshness gate asks for, which compares commit
    timestamps and so counted the refactor as a source change.

servers:
  - url: /api/v1
    description: Current version

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ReverseGeocodeResult:
      type: object
      required: [latitude, longitude, address]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: [string, 'null']
          description: |
            The resolved display name, or **null when the geocoder could not answer** — it was
            unreachable, returned a non-200, or knows nothing at those coordinates. Null is a
            successful response, not an error: a screen that has coordinates can still show them,
            and failing the request would have made an unavailable geocoder look like an
            unavailable site report.

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: COS-GEO-001
            message:
              type: string

paths:
  /geo/reverse:
    get:
      summary: Reverse-geocode coordinates to an address
      operationId: reverseGeocode
      tags: [geo]
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 13.7563
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 100.5018
      responses:
        '200':
          description: The coordinates, with an address when one could be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocodeResult'
        '400':
          description: |
            `COS-GEO-001` — `lat` and `lon` are required numeric query params ·
            `COS-GEO-002` — out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated

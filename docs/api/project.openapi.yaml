openapi: '3.1.0'
info:
  title: Construction OS — Project Service API
  description: |
    Project lifecycle management: create, update, status transitions, member management.
    All endpoints require a valid JWT (Keycloak RS256 or COS OTP token).
    Error codes follow the COS-PROJ-NNN registry (docs/api/error-codes.md).
  version: '1.0.0'
  license:
    name: Proprietary — all rights reserved
    identifier: LicenseRef-Proprietary
  contact:
    name: Construction OS Engineering

servers:
  - url: /api/v1
    description: Current API version

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProjectType:
      type: string
      enum: [RESIDENTIAL, COMMERCIAL, INFRASTRUCTURE, INDUSTRIAL]

    ProjectStatus:
      type: string
      enum: [DRAFT, ACTIVE, ON_HOLD, COMPLETED, CANCELLED]

    CosRole:
      type: string
      enum:
        - SYSTEM_ADMIN
        - TENANT_ADMIN
        - EXECUTIVE
        - PROJECT_MANAGER
        - PROCUREMENT_OFFICER
        - FINANCE
        - SAFETY_OFFICER
        - SITE_ENGINEER
        - CRM_SALES_MANAGER
        - PROC_MANAGER
        - SITE_WORKER
        - VIEWER

    Project:
      type: object
      required:
        - project_id
        - tenant_id
        - project_code
        - project_name
        - project_type
        - status
        - created_by
        - created_at
        - updated_at
      properties:
        project_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_code:
          type: string
          maxLength: 50
          example: 'PROJ-2026-001'
        project_name:
          type: string
          maxLength: 255
          example: 'Riverside Tower A'
        project_type:
          $ref: '#/components/schemas/ProjectType'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        budget_amount:
          type: [string, 'null']
          description: 'DECIMAL(19,4) as string — use decimal.js on client'
          example: '5000000.0000'
        budget_currency:
          type: [string, 'null']
          description: 'ISO 4217 code'
          example: 'THB'
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
        estimated_completion_date:
          type: [string, 'null']
          format: date
          description: 'PM-entered projected completion; feeds AI delay-risk, falls back to end_date when null'
        on_hold_reason:
          type: [string, 'null']
          maxLength: 500
        on_hold_at:
          type: [string, 'null']
          format: date-time
        cancellation_reason:
          type: [string, 'null']
          maxLength: 500
        cancelled_at:
          type: [string, 'null']
          format: date-time
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required:
        - project_code
        - project_name
        - project_type
      properties:
        project_code:
          type: string
          maxLength: 50
        project_name:
          type: string
          maxLength: 255
        project_type:
          $ref: '#/components/schemas/ProjectType'
        budget_amount:
          type: string
          description: 'DECIMAL(19,4) as string'
        budget_currency:
          type: string
          minLength: 3
          maxLength: 3
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    UpdateProjectRequest:
      type: object
      properties:
        project_name:
          type: string
          maxLength: 255
        budget_amount:
          type: string
        budget_currency:
          type: string
          minLength: 3
          maxLength: 3
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        estimated_completion_date:
          type: string
          format: date
          description: 'PM-entered projected completion; feeds AI delay-risk, falls back to end_date when null'

    TransitionProjectRequest:
      type: object
      required:
        - to
      properties:
        to:
          type: string
          enum: [ACTIVE, ON_HOLD, COMPLETED, CANCELLED]
          description: 'Target status. reason is required for ON_HOLD and CANCELLED.'
        reason:
          type: string
          maxLength: 500

    ProjectMember:
      type: object
      required:
        - membership_id
        - project_id
        - tenant_id
        - user_id
        - role
        - assigned_at
        - assigned_by
      properties:
        membership_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/CosRole'
        assigned_at:
          type: string
          format: date-time
        assigned_by:
          type: string
          format: uuid

    AddMemberRequest:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/CosRole'

    ProjectDocument:
      type: object
      required:
        - document_id
        - project_id
        - tenant_id
        - uploaded_by
        - uploaded_at
      properties:
        document_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        file_id:
          type: [string, 'null']
          format: uuid
        document_type:
          type: [string, 'null']
        uploaded_by:
          type: string
          format: uuid
        uploaded_at:
          type: string
          format: date-time

    ProjectListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        nextCursor:
          type: [string, 'null']
          description: 'Base64 cursor for the next page; null when no more pages'

    CosError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - timestamp
          properties:
            code:
              type: string
              example: 'COS-PROJ-001'
            message:
              type: string
            messageKey:
              type: string
            details:
              type: object
            traceId:
              type: string
            timestamp:
              type: string
              format: date-time

    # ── Spatial hierarchy + asset/unit entities (Phase 3, 2026-07-05; §10.2 / §11.2) ──
    Cursor:
      type: object
      properties:
        nextCursor:
          type: [string, 'null']

    Building:
      type: object
      properties:
        building_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        building_name: { type: string, maxLength: 255 }
        building_type: { type: [string, 'null'], maxLength: 100 }
        total_floors: { type: [integer, 'null'] }
        location: { type: [string, 'null'], maxLength: 255 }
        status: { type: [string, 'null'], maxLength: 50 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateBuildingRequest:
      type: object
      required: [building_name]
      properties:
        building_name: { type: string, maxLength: 255 }
        building_type: { type: string, maxLength: 100 }
        total_floors: { type: integer, minimum: 0 }
        location: { type: string, maxLength: 255 }
        status: { type: string, maxLength: 50 }
    UpdateBuildingRequest:
      type: object
      properties:
        building_name: { type: string, maxLength: 255 }
        building_type: { type: string, maxLength: 100 }
        total_floors: { type: integer, minimum: 0 }
        location: { type: string, maxLength: 255 }
        status: { type: string, maxLength: 50 }

    Floor:
      type: object
      properties:
        floor_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        floor_number: { type: integer }
        gross_area_sqm: { type: [string, 'null'] }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateFloorRequest:
      type: object
      required: [floor_number]
      properties:
        floor_number: { type: integer }
        gross_area_sqm: { type: string, description: 'DECIMAL(12,2) as string' }
    UpdateFloorRequest:
      type: object
      properties:
        floor_number: { type: integer }
        gross_area_sqm: { type: string }

    Room:
      type: object
      properties:
        room_id: { type: string, format: uuid }
        floor_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        room_number: { type: string, maxLength: 50 }
        room_type: { type: [string, 'null'], maxLength: 100 }
        area_sqm: { type: [string, 'null'] }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateRoomRequest:
      type: object
      required: [room_number]
      properties:
        room_number: { type: string, maxLength: 50 }
        room_type: { type: string, maxLength: 100 }
        area_sqm: { type: string }
    UpdateRoomRequest:
      type: object
      properties:
        room_number: { type: string, maxLength: 50 }
        room_type: { type: string, maxLength: 100 }
        area_sqm: { type: string }

    StructureType:
      type: string
      enum: [column, beam, slab, wall]
    Structure:
      type: object
      properties:
        structure_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        structure_type: { $ref: '#/components/schemas/StructureType' }
        material_type: { type: [string, 'null'], maxLength: 100 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateStructureRequest:
      type: object
      required: [structure_type]
      properties:
        structure_type: { $ref: '#/components/schemas/StructureType' }
        material_type: { type: string, maxLength: 100 }
    UpdateStructureRequest:
      type: object
      properties:
        structure_type: { $ref: '#/components/schemas/StructureType' }
        material_type: { type: string, maxLength: 100 }

    Unit:
      type: object
      properties:
        unit_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        unit_number: { type: string, maxLength: 50 }
        unit_type: { type: [string, 'null'], maxLength: 100 }
        status: { type: [string, 'null'], maxLength: 50 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateUnitRequest:
      type: object
      required: [unit_number]
      properties:
        unit_number: { type: string, maxLength: 50 }
        unit_type: { type: string, maxLength: 100 }
        status: { type: string, maxLength: 50 }
    UpdateUnitRequest:
      type: object
      properties:
        unit_number: { type: string, maxLength: 50 }
        unit_type: { type: string, maxLength: 100 }
        status: { type: string, maxLength: 50 }

    Asset:
      type: object
      properties:
        asset_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        asset_type: { type: [string, 'null'], maxLength: 100 }
        handover_date: { type: [string, 'null'], format: date }
        warranty_expiry: { type: [string, 'null'], format: date }
        maintenance_status: { type: [string, 'null'], maxLength: 50 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateAssetRequest:
      type: object
      properties:
        asset_type: { type: string, maxLength: 100 }
        handover_date: { type: string, format: date }
        warranty_expiry: { type: string, format: date }
        maintenance_status: { type: string, maxLength: 50 }
    UpdateAssetRequest:
      type: object
      properties:
        asset_type: { type: string, maxLength: 100 }
        handover_date: { type: string, format: date }
        warranty_expiry: { type: string, format: date }
        maintenance_status: { type: string, maxLength: 50 }

    # ── Project membership, phases and the risk register (added 2026-08-24) ──
    ProjectPhaseStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, COMPLETED]

    ProjectPhase:
      type: object
      properties:
        phase_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        seq:
          type: integer
          minimum: 1
          description: |
            Ordering key, unique per project. The CURRENT phase is derived from `seq` and `status`
            by the reader, not stored — ADR-070 keeps one fact in one place.
        name: { type: string, maxLength: 255 }
        status: { $ref: '#/components/schemas/ProjectPhaseStatus' }
        planned_start: { type: [string, 'null'], format: date }
        planned_end: { type: [string, 'null'], format: date }
        actual_start: { type: [string, 'null'], format: date }
        actual_end: { type: [string, 'null'], format: date }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RiskCategory:
      type: string
      enum: [SAFETY, FINANCIAL, SCHEDULE, TECHNICAL, EXTERNAL, OTHER]

    RiskStatus:
      type: string
      enum: [OPEN, MITIGATING, CLOSED, ACCEPTED]

    RiskSource:
      type: string
      description: |
        `AI_SUGGESTED` marks a risk raised by the Layer B delay-risk model for human triage. It is
        never auto-closed and never auto-actioned — §22.3 bars a model from executing a transition
        that requires a human.
      enum: [MANUAL, AI_SUGGESTED]

    ProjectRisk:
      type: object
      properties:
        risk_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        title: { type: string, maxLength: 255 }
        description: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/RiskCategory' }
        likelihood: { type: integer, minimum: 1, maximum: 5 }
        impact: { type: integer, minimum: 1, maximum: 5 }
        risk_score:
          type: integer
          minimum: 1
          maximum: 25
          readOnly: true
          description: |
            `likelihood × impact`, a GENERATED STORED column. Read-only by construction: it cannot
            drift from its inputs, and sending it is not an error — it is ignored.
        mitigation: { type: [string, 'null'] }
        owner: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/RiskStatus' }
        source: { $ref: '#/components/schemas/RiskSource' }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

paths:
  # ── Project membership (§14 Project APIs; OQ-21) ──────────────────────────
  # Documented here 2026-08-24. §14 recorded these as "documented in OpenAPI" on 2026-08-22; they
  # were not, in this or any other file.
  /projects/mine:
    get:
      summary: The signed-in user's own projects
      description: |
        Scoped by the JWT, so it needs no role. Asking about ANOTHER person is a different
        endpoint with a different guard — see `/projects/user/{userId}`. That separation is
        deliberate: a query parameter that silently changes who you are asking about is the shape
        that ships without a guard.
      operationId: listMyProjects
      tags: [projects]
      responses:
        '200':
          description: The projects the caller is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated

  /projects/user/{userId}:
    get:
      summary: A named user's projects
      description: |
        TENANT_ADMIN only, and tenant-scoped like every other read — an admin cannot ask about a
        user in another tenant. It exists for offboarding: before deactivating someone you have to
        know what they are still on.
      operationId: listProjectsForUser
      tags: [projects]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The projects that user is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient role

  # ── Project phases (ADR-070) ──────────────────────────────────────────────
  /projects/{projectId}/phases:
    get:
      summary: List a project's phases, ordered by seq
      description: |
        The CURRENT phase is not a field. It is derived by the reader — the lowest-`seq` phase that
        is `IN_PROGRESS`, else the lowest-`seq` phase not `COMPLETED`, else none — so there is no
        second place for it to be wrong.
      operationId: listProjectPhases
      tags: [phases]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ordered phase list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectPhase'
        '401':
          description: Unauthenticated

    post:
      summary: Create a phase under a project
      description: PROJECT_MANAGER or TENANT_ADMIN. `seq` is unique per project.
      operationId: createProjectPhase
      tags: [phases]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq, name]
              properties:
                seq: { type: integer, minimum: 1 }
                name: { type: string, maxLength: 255 }
                status: { $ref: '#/components/schemas/ProjectPhaseStatus' }
                planned_start: { type: string, format: date }
                planned_end: { type: string, format: date }
                actual_start: { type: string, format: date }
                actual_end: { type: string, format: date }
      responses:
        '201':
          description: Phase created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPhase'
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient role
        '404':
          description: COS-PHASE-002 — parent project not found

  /phases/{id}:
    patch:
      summary: Update a phase
      description: |
        PROJECT_MANAGER or TENANT_ADMIN. Partial. Advancing a project is a `status` (and sometimes
        `seq`) change here — there is no separate transition endpoint, because the phase list IS
        the schedule.
      operationId: updateProjectPhase
      tags: [phases]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seq: { type: integer, minimum: 1 }
                name: { type: string, maxLength: 255 }
                status: { $ref: '#/components/schemas/ProjectPhaseStatus' }
                planned_start: { type: string, format: date }
                planned_end: { type: string, format: date }
                actual_start: { type: string, format: date }
                actual_end: { type: string, format: date }
      responses:
        '200':
          description: Updated phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPhase'
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient role
        '404':
          description: COS-PHASE-001 — not found

  # ── Risk register (ADR-065) ───────────────────────────────────────────────
  /projects/{projectId}/risks:
    get:
      summary: List a project's risks, highest-risk first
      description: Ordered by `risk_score` descending. Any authenticated tenant user may read.
      operationId: listProjectRisks
      tags: [risks]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RiskStatus' }
        - name: category
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RiskCategory' }
      responses:
        '200':
          description: The risk register
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectRisk'
        '401':
          description: Unauthenticated

    post:
      summary: Raise a risk under a project
      description: |
        PROJECT_MANAGER, SITE_ENGINEER or TENANT_ADMIN — a risk is usually noticed on site, which
        is why the engineer is in the list where editing it is narrower.
      operationId: createProjectRisk
      tags: [risks]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category, likelihood, impact]
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: string }
                category: { $ref: '#/components/schemas/RiskCategory' }
                likelihood: { type: integer, minimum: 1, maximum: 5 }
                impact: { type: integer, minimum: 1, maximum: 5 }
                mitigation: { type: string }
                owner: { type: string, format: uuid }
      responses:
        '201':
          description: Risk raised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRisk'
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient role
        '404':
          description: COS-RISK-002 — parent project not found

  /risks/{riskId}:
    patch:
      summary: Edit a risk
      description: |
        PROJECT_MANAGER or TENANT_ADMIN — narrower than raising one. `risk_score` is not editable:
        it is generated from `likelihood × impact`.
      operationId: updateProjectRisk
      tags: [risks]
      parameters:
        - name: riskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: string }
                category: { $ref: '#/components/schemas/RiskCategory' }
                likelihood: { type: integer, minimum: 1, maximum: 5 }
                impact: { type: integer, minimum: 1, maximum: 5 }
                mitigation: { type: string }
                owner: { type: string, format: uuid }
      responses:
        '200':
          description: Updated risk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRisk'
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient role
        '404':
          description: COS-RISK-001 — not found

  /risks/{riskId}/status:
    patch:
      summary: Transition a risk's status
      description: |
        PROJECT_MANAGER or TENANT_ADMIN. Separate from the edit route so that closing a risk is its
        own act in the audit trail rather than one field of a bulk update.
      operationId: updateProjectRiskStatus
      tags: [risks]
      parameters:
        - name: riskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/RiskStatus' }
      responses:
        '200':
          description: The risk after the status change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRisk'
        '401':
          description: Unauthenticated
        '403':

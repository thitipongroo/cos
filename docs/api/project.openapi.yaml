        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/ProjectType'
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
          description: 'Full-text search on project_name and project_code (OpenSearch)'
        - in: query
          name: cursor
          schema:
            type: string
          description: 'Pagination cursor from previous response'
        - in: query
          name: limit

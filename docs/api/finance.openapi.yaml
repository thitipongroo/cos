openapi: 3.1.0
info:
  title: Finance Service API
  version: 1.0.0
  description: 'Phase 7 — Project cost tracking service.

    Tracks budget vs actual vs committed. Does NOT implement accounting or ERP posting.

    '
servers:
  - url: /api/v1
tags:
  - name: finance
    description: Budget, cost tracking, payments, variance reporting
paths:
  /finance/budget/{projectId}:
    get:
      tags:
        - finance
      summary: Budget detail with lines
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Budget detail
    post:
      tags:
        - finance
      summary: Create or update project budget
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - total_budget_amount
                - total_budget_currency
              properties:
                total_budget_amount:
                  type: string
                  description: DECIMAL string
                total_budget_currency:
                  type: string
                  example: THB
                variance_alert_threshold:
                  type: number
                  minimum: 1
                  maximum: 100
      responses:
        '201':
          description: Budget created or updated
  /finance/budget/{projectId}/lines:
    post:
      tags:
        - finance
      summary: Add a budget line
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - line_name
                - allocated_amount
                - currency_code
              properties:
                line_name:
                  type: string
                allocated_amount:
                  type: string
                  description: DECIMAL string
                currency_code:
                  type: string
                  example: THB
                boq_category_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Budget line added
  /finance/cost-transactions:
    get:
      tags:
        - finance
      summary: List cost transactions (paginated)
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated cost transactions
  /finance/payments:
    get:
      tags:
        - finance
      summary: List payments across the tenant (filterable by project and status)
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: >-
            Filter by payment status. Added 2026-08-11 as an optional param (additive, so no version
            bump per QM-2) so a caller can COUNT one status via the response `total` instead of
            filtering the first page of 20.
          schema:
            type: string
            enum: [PENDING, PROCESSED, FAILED]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Payments list
    post:
      tags:
        - finance
      summary: Record a payment against an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
                - invoice_id
                - amount
                - currency_code
                - payment_date
              properties:
                project_id:
                  type: string
                  format: uuid
                  description: Project this payment belongs to
                invoice_id:
                  type: string
                  format: uuid
                amount:
                  type: string
                  description: DECIMAL string
                currency_code:
                  type: string
                  example: THB
                payment_date:
                  type: string
                  format: date
                payment_reference:
                  type: string
      responses:
        '201':
          description: Payment recorded
  /finance/reports/variance:
    get:
      tags:
        - finance
      summary: Budget variance report across all projects
      responses:
        '200':
          description: Variance report
  /finance/customers:
    post:
      tags:
        - finance
      summary: Register a client/customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - company_name
              properties:
                company_name:
                  type: string
                customer_type:
                  type: string
                opportunity_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Customer created
    get:
      tags:
        - finance
      summary: List customers
      responses:
        '200':
          description: Customer list
  /finance/contracts:
    post:
      tags:
        - finance
      summary: Create a contract (client-side or vendor-side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
                - contract_type
              properties:
                project_id:
                  type: string
                  format: uuid
                contract_type:
                  type: string
                  enum:
                    - MAIN_CONTRACT
                    - SUBCONTRACT
                    - SUPPLY_AGREEMENT
                contract_value:
                  type: string
                  description: DECIMAL string
                customer_id:
                  type: string
                  format: uuid
                vendor_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Contract created
    get:
      tags:
        - finance
      summary: List contracts (filterable by project)
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contract list
  /finance/billing:
    post:
      tags:
        - finance
      summary: Create a client billing (AR) invoice in DRAFT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
                - contract_id
                - billing_number
                - amount
                - due_date
              properties:
                project_id:
                  type: string
                  format: uuid
                contract_id:
                  type: string
                  format: uuid
                billing_number:
                  type: string
                amount:
                  type: string
                  description: DECIMAL string
                due_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Billing created (DRAFT)
    get:
      tags:
        - finance
      summary: List client billings (filterable by project and status)
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - DRAFT
              - ISSUED
              - PAID
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Billing list
  /finance/billing/{billingId}:
    get:
      tags:
        - finance
      summary: Get a single client billing
      parameters:
        - name: billingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Billing
  /finance/billing/{billingId}/approve:
    patch:
      tags:
        - finance
      summary: Approve a client billing (PM up to limit; Executive above)
      parameters:
        - name: billingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tier
              properties:
                tier:
                  type: string
                  enum:
                    - PM
                    - EXECUTIVE
                    - TENANT_ADMIN
      responses:
        '200':
          description: Billing approved (DRAFT → ISSUED)
  /finance/ar-receipts:
    post:
      tags:
        - finance
      summary: Record a client payment (AR receipt) against an ISSUED billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
                - billing_id
                - customer_id
                - amount_received
                - received_date
              properties:
                project_id:
                  type: string
                  format: uuid
                billing_id:
                  type: string
                  format: uuid
                customer_id:
                  type: string
                  format: uuid
                amount_received:
                  type: string
                  description: DECIMAL string
                received_date:
                  type: string
                  format: date
                payment_method:
                  type: string
                payment_reference:
                  type: string
      responses:
        '201':
          description: AR receipt recorded (billing → PAID)
  /finance/cashflow-forecast/{projectId}:
    get:
      tags:
        - finance
      summary: 13-week direct-method cash flow forecast for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Weekly forecast periods (inflow, outflow, net, cumulative)
  /finance/payments/{paymentId}/approve:
    patch:
      tags:
        - finance
      summary: Approve a pending payment (PENDING → PROCESSED)
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment approved
        '422':
          description: Payment is not PENDING
  /finance/contracts/{id}/document:
    post:
      tags:
        - finance
      summary: Attach a contract document — uploaded or generated in-app (ADR-058)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - upload
                    - generate
                  description: >-
                    upload attaches a file already in the File Service; generate builds the PDF
                    in-app from the contract and the latest BOQ snapshot.
                file_id:
                  type: string
                  format: uuid
                  description: Required when mode is upload.
      responses:
        '201':
          description: Document attached; contract.signed_document_id set
        '400':
          description: file_id missing or unknown
  /finance/contracts/{id}/sign:
    post:
      tags:
        - finance
      summary: Contractor-side signature, PKI/VC via CredentialService (ADR-058)
      description: >-
        Records an INTERNAL signature bound to the document's sha256. The contract becomes SIGNED
        only once both an INTERNAL and a CLIENT signature have verified.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Signature recorded
        '400':
          description: Contract has no document to sign
  /finance/contracts/{id}/sign-links:
    post:
      tags:
        - finance
      summary: Issue a single-use magic link for the client to sign (ADR-030, ADR-058)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                client_email:
                  type: string
                  format: email
      responses:
        '201':
          description: >-
            Signing URL and its expiry. The raw token appears only in this response — only its
            sha256 is persisted — so the link cannot be retrieved again afterwards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
  /finance/contracts/sign/{token}:
    post:
      tags:
        - finance
      summary: External client signs via magic link (ADR-058)
      description: >-
        Authenticated by the magic-link token alone, not a Keycloak JWT — the signer is a client
        with no tenant login, so the tenant middleware is excluded from this route.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                client_email:
                  type: string
                  format: email
      responses:
        '201':
          description: CLIENT signature recorded
        '401':
          description: Token invalid, expired or already used
  /finance/contracts/{id}/signatures:
    get:
      tags:
        - finance
      summary: Signature audit trail for a contract (ADR-058)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature rows, each bound to the signed document's hash
  /finance/contracts/{id}/activate:
    post:
      tags:
        - finance
      summary: Put a fully-signed contract into force (SIGNED → ACTIVE) — ADR-058
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Contract active
        '422':
          description: Contract is not SIGNED
  /finance/contracts/{id}/terminate:
    post:
      tags:
        - finance
      summary: Terminate a contract (SIGNED | ACTIVE → TERMINATED) — ADR-058
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Contract terminated
        '422':
          description: Contract is neither SIGNED nor ACTIVE

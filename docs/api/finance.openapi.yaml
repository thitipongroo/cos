openapi: 3.1.0
info:
  title: Finance Service API
  version: 1.0.0
  description: 'Phase 7 — Project cost tracking service.

    Tracks budget vs actual vs committed. Does NOT implement accounting or ERP posting.

    '
servers:
  - url: /api/v1
tags:
  - name: finance
    description: Budget, cost tracking, payments, variance reporting
paths:
  /finance/budget/{projectId}:
    get:
      tags:
        - finance
      summary: Budget detail with lines
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Budget detail
    post:
      tags:
        - finance
      summary: Create or update project budget
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - total_budget_amount
                - total_budget_currency
              properties:
                total_budget_amount:
                  type: string
                  description: DECIMAL string
                total_budget_currency:
                  type: string
                  example: THB
                variance_alert_threshold:
                  type: number
                  minimum: 1
                  maximum: 100
      responses:
        '201':
          description: Budget created or updated
  /finance/budget/{projectId}/lines:
    post:
      tags:
        - finance
      summary: Add a budget line
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - line_name
                - allocated_amount
                - currency_code
              properties:
                line_name:
                  type: string
                allocated_amount:
                  type: string
                  description: DECIMAL string
                currency_code:
                  type: string
                  example: THB
                boq_category_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Budget line added
  /finance/cost-transactions:
    get:
      tags:
        - finance
      summary: List cost transactions (paginated)
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated cost transactions
  /finance/payments:
    get:
      tags:
        - finance
      summary: List payments for a project
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Payments list
    post:
      tags:
        - finance
      summary: Record a payment against an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
                - invoice_id
                - amount
                - currency_code
                - payment_date
              properties:
                project_id:
                  type: string
                  format: uuid
                  description: Project this payment belongs to
                invoice_id:
                  type: string
                  format: uuid
                amount:
                  type: string
                  description: DECIMAL string
                currency_code:
                  type: string
                  example: THB
                payment_date:
                  type: string
                  format: date
                payment_reference:
                  type: string
      responses:
        '201':
          description: Payment recorded
  /finance/reports/variance:
    get:
      tags:
        - finance
      summary: Budget variance report across all projects
      responses:
        '200':
          description: Variance report

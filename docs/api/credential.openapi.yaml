openapi: 3.1.0
info:
  title: Construction OS — Credential Service API
  version: '1.0.0'
  license:
    name: Proprietary — all rights reserved
    identifier: LicenseRef-Proprietary
  description: |
    CredentialService — W3C Verifiable Credentials under per-tenant `did:web` issuer identities
    (ADR-019, ADR-058; spec `05-security-compliance` §5.4, §5.9.8). It is the cryptographic half of
    client contract e-signature: the Finance module calls it to sign a contract as the contractor
    and to verify the client's counter-signature.

    It runs as its own deployable because the `@digitalbazaar` VC/JSON-LD stack is ESM-only and
    would not load inside the CommonJS NestJS monolith.

    ## There is no `/api/v1` prefix, and that is deliberate

    Routes are served at the **root path** (`services/credential-service/src/main.ts`; Kong owns
    external routing). This is the one standing exception to QM-2's version-prefix rule in this
    repository, and it is recorded here rather than left for a reader to discover from a 404.
    `servers.url` below is `/` for the same reason — writing `/api/v1` would make every example in
    this document wrong.

    ## Two audiences, one service

    | Surface | Routes | Reachable from |
    | ------- | ------ | -------------- |
    | **Public, unauthenticated** | `GET /health`, `GET /tenants/{tenantId}/did.json`, `GET /tenants/{tenantId}/status-lists/{statusListId}` | The dedicated host `credentials.construction-os.io` (cert-manager `cos-credentials-tls`, Cloudflare `ssl=strict`, TLS 1.3 minimum). A third-party verifier resolving a credential holds no platform identity, so these carry no `jwt` plugin. Kong strips any client-supplied `x-tenant-id`/`x-user-id`/`x-user-role` on this route, so a public request can never present itself as authenticated (§14.5, DP-3). |
    | **Internal, mesh-only** | `POST /credentials/issue`, `POST /credentials/verify`, `POST /credentials/{vcId}/revoke` | The backend, over the mesh. **These have no Kong route at all** (§5.9.8, §14.5). They are documented here as the contract the backend codes against, not as an edge-reachable API. |

    ## Why this document exists

    Added 2026-09-03. QM-2 requires one OpenAPI document per service with no exemption clause,
    and this service had none — its routes were documented only as a markdown table in
    `services/credential-service/README.md`. Product-owner decision the same day: document all six
    routes here rather than record an exemption.

    Data classification is RESTRICTED (issuer keys and credentials). The issuer private key is
    AES-256-GCM encrypted at rest (ADR-035) and is never returned by any route.
servers:
  - url: /
    description: |
      Root — this service mounts no version prefix. See the note above before "fixing" this.

security:
  - bearerAuth: []

tags:
  - name: DID Resolution
    description: Public `did:web` and Status List 2021 resolution for third-party verifiers
  - name: Credentials
    description: Issue, verify and revoke Verifiable Credentials (mesh-only)
  - name: Health
    description: Liveness

paths:
  /health:
    get:
      operationId: credentialServiceHealth
      summary: Liveness
      tags: [Health]
      security: []
      responses:
        '200':
          description: The process is answering
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string, enum: [credential-service] }

  /tenants/{tenantId}/did.json:
    get:
      operationId: resolveTenantDidDocument
      summary: Resolve a tenant's `did:web` DID document
      description: |
        The DID document a third-party verifier fetches to obtain the tenant's issuer public key.
        Unauthenticated by design (BG-001): a verifier holding only a credential has no platform
        identity. `did:web` is mandated over HTTPS — `did-method-web` rejects `http:`.

        Returns the stored document verbatim; it is a DID document, not a platform envelope.
      tags: [DID Resolution]
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: The tenant's DID document
          content:
            application/json:
              schema:
                type: object
                description: A W3C DID document. Shape is fixed by the DID Core spec, not by this service.
                additionalProperties: true
        '404':
          description: |
            No issuer DID document exists for this tenant (`ISSUER_NOT_FOUND`). An issuer is
            provisioned lazily on first issuance, so this is the normal answer for a tenant that has
            never issued a credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /tenants/{tenantId}/status-lists/{statusListId}:
    get:
      operationId: resolveStatusList
      summary: Fetch a Status List 2021 revocation bitstring
      description: |
        The URL embedded in every revocable credential's `credentialStatus`. An offline verifier
        fetches it and reads the revocation bit itself, so revocation needs no call to this platform.

        Public by design, like `did.json`: the payload is a signed credential holding an opaque
        compressed bitstring and carries no subject identifiers (§5.9.8, Information Disclosure).
      tags: [DID Resolution]
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: path
          name: statusListId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The signed Status List 2021 credential
          content:
            application/json:
              schema:
                type: object
                description: A W3C Verifiable Credential of type `StatusList2021Credential`.
                additionalProperties: true
        '404':
          description: No status list exists at this URL (`STATUS_LIST_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /credentials/issue:
    post:
      operationId: issueCredential
      summary: Issue a Verifiable Credential (mesh-only)
      description: |
        **Not routed at the edge.** Reachable only from the backend over the mesh (§5.9.8).

        Two signing paths, chosen by `credentialType`:

        - `CONTRACT_SIGNATURE` — signed by an **ephemeral `did:key`** generated per issuance, so the
          signature carries no reusable identity. Point-in-time and **not revocable**: no Status List
          bit is claimed and the credential carries no `credentialStatus`.
        - Every other type — signed by the tenant's persistent **`did:web`** issuer, provisioned on
          first use. Revocable: a Status List bit is claimed and embedded as `credentialStatus`.
          **`TENANT_ADMIN` only.**

        The bit allocation, the signing and the credential row all happen in one transaction, so a
        claimed index can never be orphaned and no two credentials can share one. An immutable audit
        row is written in the same transaction — there is no un-audited issuance (QM-4).
      tags: [Credentials]
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
      responses:
        '201':
          description: Credential issued
          content:
            application/json:
              schema:
                type: object
                required: [vcId, credential]
                properties:
                  vcId:
                    type: string
                    format: uuid
                    description: The platform's row id, not the credential's own `id`.
                  credential:
                    type: object
                    description: The signed W3C Verifiable Credential.
                    additionalProperties: true
        '400':
          description: |
            Body missing, `subjectId` missing, or `credentialType` absent or not one of the four
            recognised types (`INVALID_REQUEST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            A revocable type was requested by a caller whose role is not `TENANT_ADMIN`
            (`FORBIDDEN`). `CONTRACT_SIGNATURE` is exempt — its finer-grained authorisation is
            enforced by the calling backend, not here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /credentials/verify:
    post:
      operationId: verifyCredential
      summary: Verify a Verifiable Credential (mesh-only)
      description: |
        **Not routed at the edge.** Reachable only from the backend over the mesh (§5.9.8).

        Checks the Data Integrity proof **and** the Status List bit, so `verified` already accounts
        for revocation. `revoked` is returned separately so a caller can tell a forgery from a
        credential that was valid and has since been revoked — the two demand different handling.

        `did:web` resolution is bounded to this platform's configured issuer domain with a 5 s fetch
        timeout. A credential naming an out-of-allowlist issuer is rejected before any request leaves
        the process; that is the SSRF guard, and it is why this endpoint cannot be used to make the
        service fetch an arbitrary host.
      tags: [Credentials]
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: object
                  description: The Verifiable Credential to verify, as presented.
                  additionalProperties: true
      responses:
        '200':
          description: |
            The verification verdict. A `200` means the check ran, **not** that the credential is
            valid — read `verified`.
          content:
            application/json:
              schema:
                type: object
                required: [verified, revoked]
                properties:
                  verified:
                    type: boolean
                    description: Proof intact AND not revoked.
                  revoked:
                    type: boolean
                    description: |
                      The Status List bit is set. A revoked credential reports
                      `verified: false, revoked: true`; a forgery reports
                      `verified: false, revoked: false`.
        '400':
          description: Body missing or `credential` absent (`INVALID_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /credentials/{vcId}/revoke:
    post:
      operationId: revokeCredential
      summary: Revoke a Verifiable Credential (mesh-only, TENANT_ADMIN)
      description: |
        **Not routed at the edge.** Reachable only from the backend over the mesh (§5.9.8).

        Flips the database row and the published Status List bit in the same transaction, so the
        stored status and the published list can never disagree (ADR-019, Revocation). An immutable
        audit row is written in the same transaction.

        A `CONTRACT_SIGNATURE` credential claimed no Status List bit, so revoking one updates the row
        and publishes nothing — the response is the same `{ "revoked": true }`.
      tags: [Credentials]
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - in: path
          name: vcId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean, enum: [true] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller's role is not `TENANT_ADMIN` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            No such credential **in the caller's tenant, still unrevoked** (`VC_NOT_FOUND`). Revoking
            an already-revoked credential answers 404, not 200 — the operation is not idempotent, and
            a caller retrying after a timeout must treat 404 as "possibly already done".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A verified bearer token is **required** on every non-public route. It was once optional, on
        the premise that Kong verified at ingress and stripped client-supplied identity headers;
        Kong is deployed nowhere, and this service is `ClusterIP` with no NetworkPolicy and no mesh
        while holding every tenant's issuer key material.

        - **User token** — identity comes from the claims. An `x-tenant-id` header may accompany it
          but may only agree with it; a header naming a different tenant is a 401, never an override.
        - **Service token** — authenticated as the backend; the identity headers then say on whose
          behalf the call is made.

  parameters:
    TenantId:
      in: path
      name: tenantId
      required: true
      schema: { type: string }
    XTenantId:
      in: header
      name: x-tenant-id
      required: false
      schema: { type: string }
      description: With a user token, may only agree with the token's tenant claim.
    XUserId:
      in: header
      name: x-user-id
      required: false
      schema: { type: string }
    XUserRole:
      in: header
      name: x-user-role
      required: false
      schema: { type: string }
      description: Read for the `TENANT_ADMIN` gate when the caller presents a service token.

  responses:
    Unauthorized:
      description: |
        No token, an invalid or expired token, a header contradicting the token (`INVALID_TOKEN`),
        or a request that resolved to no tenant identity at all (`MISSING_TENANT_HEADER`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    IssueRequest:
      type: object
      required: [credentialType, subjectId]
      properties:
        credentialType:
          type: string
          enum: [CONTRACT_SIGNATURE, LICENCE, EQUIPMENT_CERT, TRAINING_RECORD]
          description: |
            Maps to the credential's W3C type — `ContractSignatureVC`, `LicenceVC`,
            `EquipmentCertVC`, `TrainingRecordVC`. Anything else is a 400.
        subjectId:
          type: string
          description: The credential subject's DID.
        claims:
          type: [object, 'null']
          description: Claims to embed in `credentialSubject`.
          additionalProperties: true
        documentHash:
          type: [string, 'null']
          description: |
            Contract-signing only (ADR-058) — the hash of the document being signed. Merged into the
            claims for `CONTRACT_SIGNATURE`; ignored for the other types.

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId, timestamp]
          properties:
            code:
              type: string
              enum:
                - MISSING_TENANT_HEADER
                - FORBIDDEN
                - ISSUER_NOT_FOUND
                - VC_NOT_FOUND
                - INVALID_REQUEST
                - STATUS_LIST_NOT_FOUND
                - INVALID_TOKEN
              description: |
                This service's error codes are bare keys, not the `COS-{DOMAIN}-{NNN}` form used
                across the monolith. Recorded as observed, not normalised here.
            message: { type: string }
            traceId: { type: string }
            timestamp: { type: string, format: date-time }

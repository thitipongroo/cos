openapi: '3.1.0'
info:
  title: Construction OS — Auth API
  version: '1.0.0'
  description: |
    Authentication endpoints for Construction OS.

    **Two authentication paths:**
    - Path A: SMS OTP (SITE_WORKER, SITE_ENGINEER) — phone number + 6-digit OTP
    - Path B: Keycloak OIDC (office roles) — email + password via Keycloak

    All tokens are RS256-signed JWTs. Access token TTL: 15 minutes.

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Downloadable legal documents: Privacy Policy (ADR-091), Terms of Use (ADR-092) ──────────
    #
    # ONE schema for both. The two documents are built the same way and verified the same way — a
    # digest published before the transfer, recomputed by the client over the bytes that land — so a
    # second, identical schema under a second name would only be a place for them to drift apart.
    LegalDocumentMetadata:
      type: object
      required: [version, effective_date, file_name, sha256, size_bytes, language]
      properties:
        version:
          type: string
          example: 1.0.0
          description: Must equal the version the app screen shows — held by scripts/ci/check-legal-parity.mjs.
        effective_date:
          type: string
          format: date
        file_name:
          type: string
          example: COS_Privacy_Policy_v1.0.0.pdf
        sha256:
          type: string
          description: Digest of the PDF, published before the transfer so the client can verify it.
        size_bytes:
          type: integer
        language:
          type: string
          example: en
          description: |
            The document is English only. Stated rather than implied, so a Thai reader is not left
            to discover it by opening the file.

    # ─── Pre-auth privacy inquiries (ADR-091) ───────────────────────────────────
    CreatePrivacyInquiry:
      type: object
      required: [full_name, email, subject, message]
      description: |
        Every field arrives from an unauthenticated stranger, so the caps below are not cosmetic —
        together with the rate limit they are the only bound on a publicly writable table. They mirror
        the column widths in migration 20260817000001, so a value that validates always fits.

        Nothing here is verified. `full_name` and `email` are what the sender typed; no confirmation
        step is imposed before the inquiry is accepted, because demanding one before accepting a
        rights request is over-verification (GDPR Art 12(2)/12(6)).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: The only route back to the sender, so syntax is validated.
        phone:
          type: string
          maxLength: 50
          description: Optional, as the form marks it.
        category:
          type: string
          enum: [GENERAL, DATA_ACCESS, DATA_CORRECTION, DATA_DELETION, SECURITY_CONCERN]
          default: GENERAL
        subject:
          type: string
          minLength: 1
          maxLength: 255
        message:
          type: string
          minLength: 1
          maxLength: 5000

    PrivacyInquiryReceipt:
      type: object
      required: [reference, received_at]
      description: |
        Deliberately minimal. The sender already has everything they typed, and echoing it back would
        make the endpoint useful for probing what the platform stores.
      properties:
        reference:
          type: string
          example: REQ-A1B2-C3D4
          description: |
            The handle to quote. Random, not sequential — a monotonic public reference would disclose
            how many inquiries the platform receives and the rate between any two of them.
        received_at:
          type: string
          format: date-time

    PrivacyInquiry:
      type: object
      description: The stored row, as SYSTEM_ADMIN sees it. Not returned by the public POST.
      properties:
        inquiryId:
          type: string
          format: uuid
        reference:
          type: string
        senderName:
          type: string
        senderEmail:
          type: string
        senderPhone:
          type: string
          nullable: true
        category:
          type: string
          enum: [GENERAL, DATA_ACCESS, DATA_CORRECTION, DATA_DELETION, SECURITY_CONCERN]
        subject:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [OPEN, ROUTED, CLOSED]
        receivedAt:
          type: string
          format: date-time
        linkedRequestId:
          type: string
          format: uuid
          nullable: true
          description: The `subject_requests` row this was routed into, once matched to a tenant.
        closedAt:
          type: string
          format: date-time
          nullable: true
        outcomeNote:
          type: string
          nullable: true

    # ─── Subject requests (ADR-090; PDPA-48) ────────────────────────────────────
    CreateSubjectRequest:
      type: object
      required: [request_type, received_at]
      description: |
        At least one of `subject_email` / `subject_phone` is required — enforced by the DTO, by the
        service (which also rejects whitespace-only values) and by the DB CHECK
        `subject_requests_identifier_present`. A request with no identifier would authorise a search
        it cannot scope.
      properties:
        request_type:
          type: string
          enum: [ACCESS, ERASURE]
          description: ACCESS covers PDPA §30/§31; ERASURE covers §33.
        subject_email:
          type: string
          maxLength: 255
        subject_phone:
          type: string
          maxLength: 50
        received_at:
          type: string
          format: date-time
          description: When the TENANT received it. Starts the §30 clock; may not be in the future.
        note:
          type: string
          maxLength: 2000

    CloseSubjectRequest:
      type: object
      required: [status, outcome_note]
      properties:
        status:
          type: string
          enum: [FULFILLED, REJECTED]
        outcome_note:
          type: string
          minLength: 10
          maxLength: 2000
          description: What was done, or why it was refused, naming the basis.
          example: 'Anonymised 2 CRM contact rows. Vendor row retained — Revenue Code §87, 7 years.'

    SubjectRequest:
      type: object
      properties:
        request_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        request_type: { type: string, enum: [ACCESS, ERASURE] }
        subject_email: { type: [string, 'null'] }
        subject_phone: { type: [string, 'null'] }
        status: { type: string, enum: [OPEN, FULFILLED, REJECTED] }
        received_at: { type: string, format: date-time }
        opened_by: { type: string, format: uuid }
        opened_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        outcome_note: { type: [string, 'null'] }

    SubjectMatch:
      type: object
      description: |
        Only the columns tagged `@pdpa` on that table, plus the row id — never the whole row. The
        rest is the tenant's business data and is not the subject's to receive.
      properties:
        source:
          type: string
          enum: [crm.contacts, crm.leads, procurement.vendors]
        id: { type: string, format: uuid }
        fields:
          type: object
          additionalProperties:
            type: [string, 'null']

    SubjectMatchResult:
      type: object
      properties:
        request_id: { type: string, format: uuid }
        matches:
          type: array
          items:
            $ref: '#/components/schemas/SubjectMatch'
        note:
          type: [string, 'null']
          description: |
            Set when nothing matched. An empty list is not the same as "nothing is held": a lead
            carries a contact name but no email or phone of its own, so a lead with no contact row
            cannot be reached by identifier.

    ErasureResult:
      type: object
      properties:
        request_id: { type: string, format: uuid }
        anonymised:
          type: object
          properties:
            contacts: { type: integer }
            leads: { type: integer }
            vendors: { type: integer }
        total: { type: integer }

    RequestOtpRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
          example: '+66812345678'
          description: E.164 format
        deviceId:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          maxLength: 128
          description: |
            Optional stable per-install device id (device trust, §20.6.1). When present, the
            response includes a single-use `challenge` for the device to sign with its hardware key.

    RequestOtpResponse:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          example: 300
        resendCooldownSeconds:
          type: integer
          example: 60
          description: |
            Minimum seconds the client must wait before requesting another OTP (§5.5 send-rate cap).
            The client disables "resend" and counts down for this long; the server also enforces it
            via a per-phone cooldown and answers 429 with `retryAfterSeconds` if hit early.
        challenge:
          type: string
          description: |
            Base64url single-use nonce, present only when `deviceId` was supplied. The device signs
            it (ECDSA P-256 / SHA-256, IEEE-P1363) and returns the signature to `/auth/otp/verify`.

    VerifyOtpRequest:
      type: object
      required: [phoneNumber, otp]
      properties:
        phoneNumber:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
          example: '+66812345678'
        otp:
          type: string
          pattern: '^\d{6}$'
          example: '123456'

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 900

    AttestDeviceRequest:
      type: object
      required: [phoneNumber, deviceId, signature]
      properties:
        phoneNumber:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
          example: '+66812345678'
        deviceId:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          maxLength: 128
        signature:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          maxLength: 200
          description: Base64url IEEE-P1363 signature over the challenge from `/auth/otp/request`.

    AttestDeviceResponse:
      type: object
      properties:
        deviceTrusted:
          type: boolean
          description: |
            Device trust (§20.6.1). True only when a registered, non-revoked, unexpired device proved
            possession of its key by a valid signature over the issued challenge. Reporting-only — it
            never blocks login; login proceeds through `/auth/otp/verify` regardless.

    RegisterDeviceRequest:
      type: object
      required: [deviceId, publicKey, platform]
      properties:
        deviceId:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          maxLength: 128
        publicKey:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          maxLength: 1000
          description: Base64url SPKI DER P-256 public key.
        platform:
          type: string
          enum: [ios, android]
        model:
          type: string
          maxLength: 128

    TrustedDeviceSummary:
      type: object
      properties:
        deviceId:
          type: string
        platform:
          type: string
        model:
          type: string
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    RefreshResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, refreshExpiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Rotated refresh token (Keycloak issues a new one on every refresh)
        expiresIn:
          type: integer
          example: 900
        refreshExpiresIn:
          type: integer
          example: 604800
          description: Refresh token TTL in seconds (7-day default)

    MfaEnrollResponse:
      type: object
      properties:
        otpAuthUrl:
          type: string
          description: otpauth:// URI for QR code rendering in authenticator app
          example: 'otpauth://totp/Construction%20OS:user%40example.com?secret=BASE32SECRET&issuer=Construction%20OS'
        secret:
          type: string
          description: Base32 TOTP secret (for manual entry if QR scan fails)

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: COS-AUTH-001
            message:
              type: string
            messageKey:
              type: string
            details:
              type: object
            traceId:
              type: string
            timestamp:
              type: string
              format: date-time

paths:
  /auth/otp/request:
    post:
      summary: Request SMS OTP (Path A — field workers)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpRequest'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOtpResponse'
        '422':
          description: Invalid phone number format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Rate limit exceeded — either the resend cooldown (§5.5: another OTP was requested within
            `resendCooldownSeconds`; body carries `retryAfterSeconds`) or the 10 OTP/phone/day cap.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/otp/verify:
    post:
      summary: Verify OTP and receive JWT tokens (Path A)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: OTP verified — returns access_token and refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Maximum OTP attempts exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/otp/attest:
    post:
      summary: Attest device trust before OTP (§20.6.1)
      description: |
        Verifies the device signed the challenge from `/auth/otp/request` with its registered key, and
        returns `deviceTrusted` for the OTP screen's trusted/untrusted indicator. Reporting-only: it
        never blocks login (which proceeds via `/auth/otp/verify`). Public but throttled; a caller
        without the private key can only ever receive `deviceTrusted: false`, so it is no enrolment
        oracle. Consumes the single-use challenge and slides the trust window on success.
      tags: [auth, device-trust]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestDeviceRequest'
      responses:
        '200':
          description: Device-trust verdict for the OTP banner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestDeviceResponse'

  /auth/devices:
    post:
      summary: Enrol this device for trust (§20.6.1)
      description: |
        Registers the device's SPKI public key for the authenticated user. Idempotent on
        (user, deviceId): a fresh key replaces the old one and clears any prior revocation. Trust is
        earned — a device enrols after its first successful OTP login, so the next login is trusted.
      tags: [auth, device-trust]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '204':
          description: Device enrolled
        '401':
          description: Unauthenticated
    get:
      summary: List the authenticated user's trusted devices (§20.6.1)
      tags: [auth, device-trust]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active (non-revoked) trusted devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrustedDeviceSummary'
        '401':
          description: Unauthenticated

  /auth/devices/{deviceId}:
    delete:
      summary: Revoke a trusted device (§20.6.1)
      tags: [auth, device-trust]
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Device revoked (idempotent)
        '401':
          description: Unauthenticated

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Invalid or revoked refresh token

  /auth/logout:
    post:
      summary: Logout — revoke refresh token
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: Logged out successfully

  /auth/mfa/enroll:
    post:
      summary: Initiate TOTP MFA enrollment (Path B office users)
      description: |
        Returns an `otpauth://` URI and raw secret. Client renders the URI as a QR
        code for the user to scan with their authenticator app.
        Required for `TENANT_ADMIN` and `FINANCE` roles before first login completes.
        Secret is held in Redis for 10 minutes pending `/auth/mfa/verify`.
      tags: [auth, mfa]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enrollment URI and secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollResponse'
        '401':
          description: Unauthenticated

  /auth/mfa/verify:
    post:
      summary: Confirm TOTP token to complete MFA enrollment
      description: |
        Verifies the TOTP token against the pending secret. On success, writes the
        secret to the database and sets `mfa_enabled = true`.
      tags: [auth, mfa]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  pattern: '^\d{6}$'
                  description: 6-digit TOTP code from authenticator app
                  example: '123456'
      responses:
        '204':
          description: Enrollment confirmed — mfa_enabled set to true
        '400':
          description: No pending enrollment or enrollment expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid TOTP token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/mfa/authenticate:
    post:
      summary: Verify TOTP token during login (Path B only)
      description: |
        Called after Keycloak password authentication succeeds for roles that
        require MFA (`TENANT_ADMIN`, `FINANCE`). A 204 response means the login
        step may proceed; any non-2xx should block access.
      tags: [auth, mfa]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  pattern: '^\d{6}$'
                  example: '654321'
      responses:
        '204':
          description: TOTP verified — login may proceed
        '400':
          description: MFA not enrolled for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid TOTP token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ─── The Privacy Policy document (ADR-091) ───────────────────────────────────────────────────
  #
  # Public, and NOT behind `s1.identity.privacy-inquiry`: that flag is the abuse switch for the write
  # route below, and turning it off must not take the policy document down with it. A notice you must
  # authenticate to read is not a notice.
  /privacy/policy/metadata:
    get:
      summary: Version, effective date, file name and SHA-256 of the policy PDF
      description: |
        Fetched BEFORE the download so the client can verify the bytes it receives rather than trust
        them. The digest is stable: the document has no per-request input and its PDF timestamps are
        pinned to the effective date, so the same version always produces the same bytes.
      tags: [privacy-policy]
      security: []
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentMetadata'

  /privacy/policy/pdf:
    get:
      summary: The Privacy Policy as a PDF
      description: |
        `ETag` is the content digest, so a conditional request costs nothing and a proxy cannot serve
        a stale edition under a new version number.

        English only — pdf-lib's standard fonts carry no Thai glyphs, and embedding a Thai face is an
        unmade font-licensing decision. `/privacy/policy/metadata` states this in `language`.
      tags: [privacy-policy]
      security: []
      responses:
        '200':
          description: The document
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="COS_Privacy_Policy_v1.0.0.pdf"
            ETag:
              schema:
                type: string
                description: The SHA-256 of the body, quoted.
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ─── The Terms of Use document (ADR-092) ─────────────────────────────────────────────────────
  #
  # The login footer's other legal document, public on the same terms as the policy above: the terms
  # are what a person reads BEFORE deciding to sign up. Same two-route shape — metadata first so the
  # client can verify the transfer rather than trust it.
  /terms/metadata:
    get:
      summary: Version, effective date, file name and SHA-256 of the Terms of Use PDF
      description: |
        Fetched BEFORE the download so the client can verify the bytes it receives. The digest is
        stable: the document has no per-request input and its PDF timestamps are pinned to the
        effective date, so the same version always produces the same bytes.
      tags: [terms-of-use]
      security: []
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentMetadata'

  /terms/pdf:
    get:
      summary: The Terms of Use as a PDF
      description: |
        `ETag` is the content digest, so a conditional request costs nothing and a proxy cannot serve
        a stale edition under a new version number.

        English only — pdf-lib's standard fonts carry no Thai glyphs, and embedding a Thai face is an
        unmade font-licensing decision. `/terms/metadata` states this in `language`.
      tags: [terms-of-use]
      security: []
      responses:
        '200':
          description: The document
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="COS_Terms_of_Use_v1.0.0.pdf"
            ETag:
              schema:
                type: string
                description: The SHA-256 of the body, quoted.
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ─── Pre-auth privacy inquiries (ADR-091) ────────────────────────────────────────────────────
  #
  # The one write in this file reachable with NO credential of any kind — not a JWT, not even a
  # magic-link token. It exists because the sender has no account AND no known tenant: a reader on the
  # pre-auth Privacy Policy screen may not know which organisation here holds their data, so there is
  # nothing to scope them to. `platform.privacy_inquiries` is correspondingly the one platform table
  # with no `tenant_id` and no RLS; access to the READ side is confined by role instead.
  #
  # NOT a PDPA §30 request in its own right. The controller is the tenant, and the statutory clock
  # starts when the tenant receives it — which is what `subject_requests.received_at` below records.
  # An inquiry that is matched to a tenant is routed into one of those rows; the two chain.
  /privacy/inquiries:
    post:
      summary: Lodge a privacy inquiry without an account (ADR-091)
      description: |
        Public. Rate-limited at the QM-7 AUTH tier (10 req/min per IP) rather than the general tier,
        because it is unauthenticated and writes a row.

        Returns ONLY a reference and a timestamp. Nothing the sender supplied is echoed back: an
        endpoint that reflects its input is a free oracle for probing what the platform stores.

        Gated by `s1.identity.privacy-inquiry`, which ships OFF (QM-15). OFF removes an ADDITIONAL
        channel — the Privacy Policy screen still publishes the Data Protection Office address, and
        that address is the PDPA §37(3) contact.
      tags: [privacy-inquiries]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrivacyInquiry'
      responses:
        '201':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyInquiryReceipt'
        '400':
          description: A field is missing, malformed, or over its length cap
        '429':
          description: Rate limited (10/min per IP) — `Retry-After` gives the seconds until reset
        '503':
          description: COS-FLAG-001 — `s1.identity.privacy-inquiry` is off
    get:
      summary: The triage queue, oldest received first (SYSTEM_ADMIN)
      description: |
        SYSTEM_ADMIN, not TENANT_ADMIN. The queue is cross-tenant by construction — the sender has
        not been matched to a tenant — so a tenant admin reading it would be reading strangers'
        inquiries about other organisations.
      tags: [privacy-inquiries]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, ROUTED, CLOSED]
      responses:
        '200':
          description: Inquiries, ordered by received_at ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrivacyInquiry'
        '403':
          description: Not a SYSTEM_ADMIN

  /privacy/inquiries/{reference}:
    get:
      summary: One inquiry, by the reference the sender was given (SYSTEM_ADMIN)
      tags: [privacy-inquiries]
      security:
        - bearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
            example: REQ-A1B2-C3D4
      responses:
        '200':
          description: The inquiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyInquiry'
        '403':
          description: Not a SYSTEM_ADMIN
        '404':
          description: COS-PDPA-008 — no inquiry with that reference

  # ─── Subject requests from people with NO platform account (ADR-090; PDPA-48) ────────────────
  #
  # Under the identity module because that is where the platform's other rights surfaces live, but a
  # different relationship: for CRM contacts, CRM leads and the named contact at a vendor the TENANT
  # is the controller and Construction OS the processor, so these routes serve the tenant's own
  # compliance desk rather than a data subject. All are TENANT_ADMIN-only.
  /subject-requests:
    post:
      summary: Open a subject request (ADR-090)
      description: |
        The row is also the AUTHORISATION to search: no search runs without one, which is what stops
        a free lookup by email answering "is this address one of your customers".

        `received_at` is when the TENANT received the request and starts the PDPA §30 30-day clock —
        it is supplied, never defaulted to now(), and may not be in the future.
      tags: [subject-requests]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubjectRequest'
      responses:
        '201':
          description: Request opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectRequest'
        '400':
          description: No identifier supplied, or received_at is in the future
        '403':
          description: Not a TENANT_ADMIN
    get:
      summary: The tenant's request queue, oldest received first
      tags: [subject-requests]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, FULFILLED, REJECTED]
      responses:
        '200':
          description: Requests, ordered by received_at ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubjectRequest'

  /subject-requests/{requestId}/matches:
    get:
      summary: What the tenant holds about the subject of this request
      description: |
        Identifiers come from the REQUEST ROW, never from the query string. Writes an audit row
        carrying the actor, the request id and the match count (never the matches themselves).

        `tax_id` and `address` on a vendor row are returned only where `vendor_type = 'INDIVIDUAL'`;
        on a company row they are not the person's data.

        Rate-limited to 10/min — below the QM-7 default of 100/min, as the residual enumeration
        control after the request-binding.
      tags: [subject-requests]
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matches, with a note when nothing matched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectMatchResult'
        '400':
          description: The request is already closed
        '404':
          description: No such request in this tenant

  /subject-requests/{requestId}/erase:
    post:
      summary: Anonymise in place (QM-5) — clears personal columns, keeps the rows
      description: |
        ERASURE requests only. Irreversible by design: a hard delete would break
        `crm.contacts.lead_id` into a chain Thai accounting law retains for 7 years (ADR-090 §5).
      tags: [subject-requests]
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Per-table counts of the rows anonymised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureResult'
        '400':
          description: Request is not an ERASURE, or is already closed
        '404':
          description: No such request in this tenant

  /subject-requests/{requestId}/close:
    patch:
      summary: Close the request as FULFILLED or REJECTED
      description: |
        The outcome note is required on BOTH outcomes: a refusal that does not name its basis is
        itself a breach (ADR-090 §5).
      tags: [subject-requests]
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseSubjectRequest'
      responses:
        '200':
          description: The closed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectRequest'
        '404':
          description: No OPEN request with that id in this tenant

  /subject-requests/{requestId}/verify:
    post:
      summary: Email a verification link to the address ON THE MATCHED RECORD
      description: |
        Proves the answerer CONTROLS THE IDENTIFIER THE TENANT ALREADY HOLDS — not that they are who
        they say they are, and deliberately not: regulators ask for verification proportionate to the
        risk, built on information already held, and treat demanding ID documents without reasonable
        doubt as an infringement in its own right (GDPR Art 12(2)/12(6)).

        The address is taken from the matched record, never from the request: challenging a typed-in
        address would prove control of a claimed address and say nothing about the person the tenant
        holds data about. Requires at least one match with an email on file. The response masks the
        address; the full value is stored on the request row for an auditor.
      tags: [subject-requests]
      security:
        - bearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Challenge sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent_to:
                    type: string
                    example: 's***@example.co.th'
        '400':
          description: No match, no email on the held records, or the request is closed
        '404':
          description: No such request in this tenant

  /subject-requests/verify/{token}:
    post:
      summary: A data subject confirms a verification link (single use, no account)
      description: |
        PUBLIC — no bearer token. The person has no account at all and authenticates solely with the
        emailed link; the guard takes the tenant from the token's own signed claim, so the write still
        runs under RLS. Single use: a replayed link reports 400 rather than re-stamping the proof.
      tags: [subject-requests]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
        '400':
          description: Link already used or no longer current
        '401':
          description: Bad signature or expired link

  # ── Step-up verification (ADR-078) ────────────────────────────────────────
  # Written 2026-08-24. These five auth routes and the six /users/me/* routes below had run with no
  # entry in this document and no row in §14 — see the "Offline Sync"/"Master Data" note in §14.3
  # for the same class of gap.
  /auth/step-up/request:
    post:
      summary: Send a step-up verification code for a high-value action
      description: |
        Re-proves possession before a high-value action. Delivers a 6-digit code to the account's
        registered channel — SMS when the account has a phone number, otherwise email (every
        account has an email; only Path A accounts have a phone). The response carries the channel
        and a MASKED destination; the full address is never echoed back.

        A step-up CONFIRMS an already-authenticated caller — it never authenticates one, which is
        why it sits behind the bearer guard. It inherits the controller's auth-tier throttle
        (10 requests per minute, QM-7).
      operationId: requestStepUp
      tags: [step-up]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [data-export]
                  description: The high-value action being confirmed.
      responses:
        '201':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    type: string
                    enum: [SMS, EMAIL]
                  destinationHint:
                    type: string
                    description: Masked, so the UI can say "ending 4321" without holding the address.
                  expiresInSeconds:
                    type: integer
        '401':
          description: Authentication required
        '429':
          description: Daily verification limit exceeded

  /auth/step-up/verify:
    post:
      summary: Exchange a step-up code for a single-use action token
      description: |
        The action token is NOT a session and can never be exchanged for one. It is bound to this
        user and this action, lives 5 minutes, and is consumed the first time it is presented.
      operationId: verifyStepUp
      tags: [step-up]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, code]
              properties:
                action:
                  type: string
                  enum: [data-export]
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
      responses:
        '201':
          description: Action token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  actionToken:
                    type: string
        '400':
          description: Invalid or expired code
        '401':
          description: Authentication required
        '429':
          description: Maximum verification attempts exceeded

  # ── Device attestation and trust (ADR-081/082/083) ────────────────────────
  /auth/devices/attestation-challenge:
    post:
      summary: Mint a single-use challenge for platform attestation
      description: |
        Both Play Integrity and App Attest are challenge-response (ADR-083): the client fetches a
        nonce, feeds it to the platform API, and returns it alongside the resulting token in
        `POST /auth/devices`. A token not bound to a nonce this server issued is replayable
        indefinitely, so the challenge is consumed on use — and a mismatch simply records no
        attestation. Enrolment still succeeds, because attestation never blocks (ADR-054).
      operationId: attestationChallenge
      tags: [devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId:
                  type: string
      responses:
        '200':
          description: A single-use, short-lived challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
        '401':
          description: Authentication required

  /auth/devices/{deviceId}/trust:
    get:
      summary: The trust score for one of the caller's own devices (ADR-081)
      description: |
        **ADVISORY ONLY.** It never revokes a device and never blocks a login: §22.3 bars a model
        from executing a transition that requires a human, and ADR-081 keeps that property while
        the scorer is rule-based, so a regression here cannot become a lockout.

        `scoredBy` says which scorer produced the number — `RULES` until a DeviceTrustModel is
        deployed. ADR-081 forbids calling the rule-based path AI-derived, which is why the field
        exists rather than being inferred from the value.

        Behind the `s1.identity.device-trust-score` feature flag.
      operationId: getDeviceTrust
      tags: [devices]
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The device's advisory trust report
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId:
                    type: string
                  score:
                    type: integer
                  maxScore:
                    type: integer
                  capped:
                    type: boolean
                    description: True when a cap held the total below the sum of its signals.
                  scoredBy:
                    type: string
                    enum: [RULES, MODEL]
                  rulesVersion:
                    type: string
                  signals:
                    type: array
                    items:
                      type: object
                      properties:
                        signal:
                          type: string
                          enum:
                            [attestation, recency, enrolmentAge, revocationHistory, asnStability]
                        band:
                          type: string
                        points:
                          type: integer
                        maxPoints:
                          type: integer
        '401':
          description: Authentication required
        '404':
          description: Not one of the caller's devices
        '503':
          description: COS-FLAG-001 — feature disabled

  /auth/roles/{role}/permissions:
    get:
      summary: List the resource:action permissions granted to a role (RBAC §6.4)
      description: |
        The authoritative RBAC matrix, read-only. Exposed so a client — the mobile invite flow's
        role-permissions screen — can show a real access breakdown instead of a hard-coded one.
        No tenant or user state is involved: this is the static grant set.
      operationId: getRolePermissions
      tags: [rbac]
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
          description: A `CosRole` value.
      responses:
        '200':
          description: Granted permissions for the role
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                  permissions:
                    type: array
                    items:
                      type: string
                      example: 'project:read'
        '400':
          description: Unknown role
        '401':
          description: Authentication required

  # ── The signed-in user's own record (PDPA) ────────────────────────────────
  # `users/me` is one of this codebase's two self-service conventions — `auth` for auth primitives,
  # `users/me` for the caller's own record. ADR-078 rejected a third `/identity/me/...` namespace.
  /users/me/consents:
    get:
      summary: The signed-in user's consent state for every PDPA category
      description: |
        Returns all five categories, not only the withdrawable ones. Categories on the CONTRACT
        basis (`identity`, `contact` — PDPA §24(3)) report `granted: true, withdrawable: false`:
        they are processed and the subject is entitled to be told so, but the route out is erasure,
        not withdrawal. A category with no recorded decision reports `granted: false` — PDPA §19
        requires an affirmative act, so silence is never consent.
      operationId: getConsentState
      tags: [consent]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Consent state per category, with lawful basis
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                      enum: [identity, contact, location, financial, operational]
                    basis:
                      type: string
                      enum: [CONSENT, CONTRACT]
                    granted:
                      type: boolean
                    withdrawable:
                      type: boolean
        '401':
          description: Authentication required

    post:
      summary: Record a consent decision (grant or withdraw)
      description: |
        **Append-only.** A grant and a withdrawal both insert a new row and the prior row is never
        mutated, so the history PDPA-22 requires survives. Withdrawal is forward-only: it stops
        future collection for that purpose and does not delete what was lawfully collected while
        consent was live — that is erasure (PDPA-13), a different request.

        Only consent-basis purposes are accepted; a contract-basis category is a 400.
      operationId: recordConsent
      tags: [consent]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, granted, notice_version]
              properties:
                purpose:
                  type: string
                  enum: [location, financial, operational]
                granted:
                  type: boolean
                  description: true = grant, false = withdraw. Both are recorded as new rows.
                notice_version:
                  type: string
                  pattern: '^\d+\.\d+\.\d+$'
                  example: 1.0.0
                  description: The privacy-notice version shown to the user.
      responses:
        '204':
          description: Decision recorded
        '400':
          description: Unknown purpose, or a contract-basis category
        '401':
          description: Authentication required

  /users/me/network-origin:
    get:
      summary: What the platform can tell about the caller's own network origin (ADR-080)
      description: |
        Derived at read time and **never stored**: city, region and ISP are resolved from the
        caller's own ingress IP against a self-hosted GeoLite2 database, then discarded. The
        address is taken from the request, never from a parameter — otherwise this would be a
        geo-IP lookup service for anyone holding a session.

        The behavioural label is profiling and requires `operational` consent. Without it the field
        is `null` — "Not enabled", which the screen must render differently from
        `INSUFFICIENT_DATA` ("too few check-ins"). Collapsing the two would tell a worker who
        declined profiling that the platform merely lacked data. The rule's thresholds are returned
        alongside so the label can be shown with its derivation rather than as an assertion.
      operationId: getNetworkOrigin
      tags: [privacy]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Network origin and behavioural context
          content:
            application/json:
              schema:
                type: object
                properties:
                  origin:
                    type: [object, 'null']
                    description: Null when no GeoLite2 database is configured or the IP is unknown.
                    properties:
                      city: { type: [string, 'null'] }
                      region: { type: [string, 'null'] }
                      countryIsoCode: { type: [string, 'null'] }
                      organisation: { type: [string, 'null'] }
                  behavioral:
                    type: [object, 'null']
                    description: Null means the subject has not consented to `operational` processing.
                    properties:
                      context:
                        type: string
                        enum: [STATIONARY, MOBILE, INSUFFICIENT_DATA]
                      pointCount: { type: integer }
                      maxDistanceMetres: { type: [number, 'null'] }
                  rule:
                    type: object
                    properties:
                      windowDays: { type: integer }
                      radiusMetres: { type: integer }
                      minPoints: { type: integer }
        '401':
          description: Authentication required

  /users/me/data-export:
    post:
      summary: Request an export of your own data (PDPA §30/§31)
      description: |
        Requires a single-use action token from `POST /auth/step-up/verify` — re-proving possession
        before an archive of every category of a person's data is assembled.

        **202, not 201**: the export reads across every domain schema and is produced by a Temporal
        workflow, so the response is the request's state, not the archive. Poll
        `GET /users/me/data-export`, or wait for the email. There is no separate rate limit — every
        request needs a fresh action token, and step-up already caps those at 10 per user per day.

        Behind the `s1.identity.data-export` kill switch (QM-15 / ADR-049).
      operationId: requestDataExport
      tags: [data-export]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categories, format, action_token]
              properties:
                categories:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum: [identity, contact, location, financial, operational]
                format:
                  type: string
                  enum: [JSON, CSV]
                  description: JSON keeps types; CSV is one file per table.
                from_date:
                  type: string
                  format: date
                  description: Inclusive start of the window. Absent means "no bound", not the epoch.
                to_date:
                  type: string
                  format: date
                  description: Inclusive end of the window.
                action_token:
                  type: string
      responses:
        '202':
          description: Export request accepted and queued
        '401':
          description: Authentication required
        '403':
          description: COS-PDPA-002 — step-up verification required
        '422':
          description: COS-PDPA-003 — the reporting window is inverted
        '503':
          description: COS-FLAG-001 — feature disabled

    get:
      summary: List your own export requests and their status
      description: |
        Newest first. `downloadable` says whether a download can be attempted right now, so the
        client does not have to re-derive "READY, has a file, and not past `expires_at`". A FAILED
        request carries `failureReason` — a sentence for the reader, never a stack trace.
      operationId: listDataExports
      tags: [data-export]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's export requests
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    exportId: { type: string, format: uuid }
                    status: { type: string }
                    downloadable: { type: boolean }
                    failureReason: { type: [string, 'null'] }
                    expiresAt: { type: [string, 'null'], format: date-time }
        '401':
          description: Authentication required
        '503':
          description: COS-FLAG-001 — feature disabled

  /users/me/data-export/{exportId}/download:
    get:
      summary: Mint a short-lived download link for a finished export
      description: |
        Returns a freshly signed URL on every call rather than a link that was emailed days ago.
        The archive holds every coordinate the subject was recorded at, so a week-long bearer URL
        sitting in a mailbox was rejected in ADR-078: `expires_at` is the REQUEST's 7-day validity,
        and the URL's own lifetime is File Service's `SIGNED_URL_TTL_SECONDS`, returned alongside.

        The kill switch gates the DOWNLOAD as well as the request — that is the point of having it.
        The incident it exists for is "the export is producing wrong data", and in that incident the
        archives already sitting in MinIO are exactly what must stop being handed out.
      operationId: downloadDataExport
      tags: [data-export]
      security:
        - bearerAuth: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A signed URL and the seconds it remains valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresInSeconds: { type: integer }
        '401':
          description: Authentication required
        '404':
          description: COS-PDPA-004 not yours · COS-PDPA-006 not retrievable
        '410':
          description: COS-PDPA-007 — expired; the archive is deleted
        '422':
          description: COS-PDPA-005 — still preparing, or it failed
        '503':
          description: COS-FLAG-001 — feature disabled

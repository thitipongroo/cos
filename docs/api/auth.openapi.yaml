openapi: '3.1.0'
info:
  title: Construction OS — Auth API
  version: '1.0.0'
  description: |
    Authentication endpoints for Construction OS.

    **Two authentication paths:**
    - Path A: SMS OTP (SITE_WORKER, SITE_ENGINEER) — phone number + 6-digit OTP
    - Path B: Keycloak OIDC (office roles) — email + password via Keycloak

    All tokens are RS256-signed JWTs. Access token TTL: 15 minutes.

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RequestOtpRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
          example: '+66812345678'
          description: E.164 format

    RequestOtpResponse:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          example: 300

    VerifyOtpRequest:
      type: object
      required: [phoneNumber, otp]
      properties:
        phoneNumber:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
          example: '+66812345678'
        otp:
          type: string
          pattern: '^\d{6}$'
          example: '123456'

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 900

    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          example: 900

    CreateTenantRequest:
      type: object
      required: [tenantCode, tenantName, planType]
      properties:
        tenantCode:
          type: string
          pattern: '^[a-z0-9_]{2,50}$'
          example: acme_corp
        tenantName:
          type: string
          minLength: 2
          maxLength: 255
          example: ACME Construction Co.
        planType:
          type: string
          enum: [STARTER, PROFESSIONAL, ENTERPRISE]

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: COS-AUTH-001
            message:
              type: string
            messageKey:
              type: string
            details:
              type: object
            traceId:
              type: string
            timestamp:
              type: string
              format: date-time

paths:
  /auth/otp/request:
    post:
      summary: Request SMS OTP (Path A — field workers)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpRequest'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOtpResponse'
        '422':
          description: Invalid phone number format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (10 OTP/phone/day)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/otp/verify:
    post:
      summary: Verify OTP and receive JWT tokens (Path A)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: OTP verified — returns access_token and refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Maximum OTP attempts exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Invalid or revoked refresh token

  /auth/logout:
    post:
      summary: Logout — revoke refresh token
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: Logged out successfully

  /admin/tenants:
    post:
      summary: Provision new tenant (SYSTEM_ADMIN only)
      tags: [tenants]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created and schema provisioned
        '409':
          description: Tenant code already exists

  /admin/tenants/{tenantId}/deactivate:
    patch:
      summary: Deactivate tenant (SYSTEM_ADMIN only)
      tags: [tenants]
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant deactivated
        '404':
          description: Tenant not found

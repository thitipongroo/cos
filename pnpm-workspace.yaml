packages:
  - 'apps/*'
  - 'backend'
  - 'services/*'
  - 'packages/@cos/*'

overrides:
  multer: '^2.1.1'
  lodash: '^4.18.1'
  'picomatch@>=4.0.0 <4.0.4': '4.0.4'
  'glob@>=10.2.0 <10.5.0': '10.5.0'
  '@xmldom/xmldom@<0.8.12': '^0.9.10'
  'protobufjs@<=7.5.5': '^7.5.6'
  'tmp@<0.2.6': '^0.2.7'
  '@remix-run/server-runtime@<2.17.5': '2.17.5'
  'turbo-stream@<3.0.0': '^3.2.0'

auditConfig:
  ignoreCves:
    # Locked by @nestjs/platform-fastify@10 (fastify@4) — needs NestJS 11 upgrade
    - CVE-2026-6270
    - CVE-2026-22031
    - CVE-2026-2880
    - CVE-2026-33804
    - CVE-2026-25223
    - CVE-2026-2293
    - CVE-2026-33011
    - CVE-2026-6321
    - CVE-2026-6322
    # Locked by next@14 — needs Next.js 15 upgrade
    - CVE-2026-44578
    - CVE-2026-44573
    # Locked by @opentelemetry/sdk-node@0.51 — needs full OTel stack upgrade
    - CVE-2026-44902
    # Dev-only: locked by expo@51 CLI (tar@6) — needs Expo 52 upgrade
    - CVE-2026-24842
    - CVE-2026-23745
    - CVE-2026-26960
    - CVE-2026-29786
    - CVE-2026-31802
    - CVE-2026-23950
    # Test-only: locked by testcontainers@10.28 (undici@5)
    - CVE-2026-1526
    - CVE-2026-2229

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  cpu-features: true
  detox: true
  dtrace-provider: true
  prisma: true
  protobufjs: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.9.17'
  - '@turbo/darwin-arm64@2.9.17'
  - '@turbo/linux-64@2.9.17'
  - '@turbo/linux-arm64@2.9.17'
  - '@turbo/windows-64@2.9.17'
  - '@turbo/windows-arm64@2.9.17'
  - turbo@2.9.17

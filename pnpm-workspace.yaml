packages:
  - 'apps/*'
  # apps/mobile is intentionally EXCLUDED from the pnpm workspace: React Native + Expo + Metro +
  # CocoaPods assume a flat (hoisted) node_modules, which pnpm's isolated linker breaks (Metro cannot
  # resolve transitive expo-*/@react-native/* packages). It installs standalone with
  # node-linker=hoisted (apps/mobile/.npmrc) via `pnpm install --ignore-workspace`, consuming
  # @cos/types as a file: dependency. Nothing in turbo/CI references @cos/mobile.
  - '!apps/mobile'
  - 'backend'
  - 'services/*'
  - 'packages/@cos/*'

overrides:
  # Single fastify version — file-service imports fastify directly while @nestjs/platform-fastify
  # pulls its own; a duplicate (4.28.1 + 4.29.1) breaks file-service's plugin type augmentation
  # (FastifyTypeProvider mismatch, missing multipartErrors/swagger). Pin both to one v4 release.
  fastify: '4.29.1'
  multer: '^2.1.1'
  lodash: '^4.18.1'
  'picomatch@>=4.0.0 <4.0.4': '4.0.4'
  'glob@>=10.2.0 <10.5.0': '10.5.0'
  '@xmldom/xmldom@<0.8.12': '^0.9.10'
  # @expo/plist@0.1.3 (Expo 51 prebuild, dev/build-only) was written for the @xmldom/xmldom 0.7 API;
  # the security bump above forces 0.9.10 on it, whose stricter DOMParser breaks `expo prebuild`
  # (mimeType undefined). Scope @expo/plist back to 0.7.7 — it is a build-time CLI tool, not in any
  # runtime/production bundle, so the <0.8.12 CVE does not apply to it.
  '@expo/plist>@xmldom/xmldom': '0.7.7'
  'protobufjs@<=7.5.5': '^7.5.6'
  'tmp@<0.2.6': '^0.2.7'
  '@remix-run/server-runtime@<2.17.5': '2.17.5'
  'turbo-stream@<3.0.0': '^3.2.0'

auditConfig:
  ignoreCves:
    # Locked by @nestjs/platform-fastify@10 (fastify@4) — needs NestJS 11 upgrade
    - CVE-2026-6270
    - CVE-2026-22031
    - CVE-2026-2880
    - CVE-2026-33804
    - CVE-2026-25223
    - CVE-2026-2293
    - CVE-2026-33011
    - CVE-2026-6321
    - CVE-2026-6322
    # Locked by next@14 — needs Next.js 15 upgrade
    - CVE-2026-44578
    - CVE-2026-44573
    # Locked by @opentelemetry/sdk-node@0.51 — needs full OTel stack upgrade
    - CVE-2026-44902
    # Dev-only: locked by expo@51 CLI (tar@6) — needs Expo 52 upgrade
    - CVE-2026-24842
    - CVE-2026-23745
    - CVE-2026-26960
    - CVE-2026-29786
    - CVE-2026-31802
    - CVE-2026-23950
    # Test-only: locked by testcontainers@10.28 (undici@5)
    - CVE-2026-1526
    - CVE-2026-2229

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  cpu-features: true
  detox: true
  dtrace-provider: true
  prisma: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.9.17 || 2.10.1'
  - '@turbo/darwin-arm64@2.9.17 || 2.10.1'
  - '@turbo/linux-64@2.9.17 || 2.10.1'
  - '@turbo/linux-arm64@2.9.17 || 2.10.1'
  - '@turbo/windows-64@2.9.17 || 2.10.1'
  - '@turbo/windows-arm64@2.9.17 || 2.10.1'
  - turbo@2.9.17 || 2.10.1
  - '@typescript-eslint/eslint-plugin@8.62.1'
  - '@typescript-eslint/parser@8.62.1'
  - '@typescript-eslint/project-service@8.62.1'
  - '@typescript-eslint/scope-manager@8.62.1'
  - '@typescript-eslint/tsconfig-utils@8.62.1'
  - '@typescript-eslint/type-utils@8.62.1'
  - '@typescript-eslint/types@8.62.1'
  - '@typescript-eslint/typescript-estree@8.62.1'
  - '@typescript-eslint/utils@8.62.1'
  - '@typescript-eslint/visitor-keys@8.62.1'
  - prettier@3.9.4

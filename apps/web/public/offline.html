<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Construction OS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1A202C;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 360px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      display: block;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    p  { font-size: 15px; color: #A0AEC0; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #3182CE;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2B6CB0; }
  </style>
</head>
<body>
  <div class="container">
    <span class="icon">📡</span>
    <h1>You are offline</h1>
    <p>
      No internet connection detected.<br />
      Previously cached data is still available.<br />
      Changes you make will sync automatically when you're back online.
    </p>
    <button onclick="window.location.reload()">Retry connection</button>
  </div>
</body>
</html>

# RAG chain configuration — LangChain chain inside ai-gateway
# Source: docs/specifications/22-ai-architecture.md §22.7 LangChain Configuration
# Interface: LangChainProviderConfig.build_chain(chain_type, tenant_id)

chain_type: rag

retrieval:
  top_k: 5
  max_context_tokens: 4000
  hybrid_search:
    keyword_backend: opensearch # BM25 keyword search
    vector_backend: pgvector # cosine similarity via HNSW index

reranking:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  activate_when_p95_relevance_below: 0.7

chunking:
  documents:
    strategy: recursive_character
    chunk_size: 500
    chunk_overlap: 100
  site_reports:
    strategy: single_chunk # each report treated as one chunk (<500 tokens)

<script>
    // Simple micro-interaction for checkboxes
    document.querySelectorAll('.custom-checkbox').forEach(checkbox => {
      checkbox.addEventListener('change', function() {
        const parent = this.closest('.bento-card');
        if (this.checked) {
          parent.style.borderLeftColor = '#2563eb';
        } else {
          parent.style.borderLeftColor = '#434655';
        }
      });
    });

    // Format selector toggle logic
    const formatButtons = document.querySelectorAll('.bg-surface-container button');
    formatButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        formatButtons.forEach(b => {
          b.classList.remove('bg-surface-variant', 'text-primary');
          b.classList.add('text-on-surface-variant');
        });
        btn.classList.add('bg-surface-variant', 'text-primary');
        btn.classList.remove('text-on-surface-variant');
      });
    });
  </script>

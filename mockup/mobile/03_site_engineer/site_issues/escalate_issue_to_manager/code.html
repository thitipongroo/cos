<script>
        // Simple touch feedback for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('opacity-80');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('opacity-80');
            });
        });

        // Urgency Switch Logic
        const urgencyButtons = document.querySelectorAll('.grid-cols-2 button');
        urgencyButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                urgencyButtons.forEach(b => {
                    b.classList.remove('border-2', 'border-mobile-danger', 'bg-mobile-danger/10', 'text-mobile-danger');
                    b.classList.add('border', 'border-outline-variant/50', 'bg-surface-container-low', 'text-on-surface-variant');
                });
                btn.classList.add('border-2', 'border-mobile-danger', 'bg-mobile-danger/10', 'text-mobile-danger');
                btn.classList.remove('border', 'border-outline-variant/50', 'bg-surface-container-low', 'text-on-surface-variant');
            });

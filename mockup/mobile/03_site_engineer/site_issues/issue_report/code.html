<!-- Micro-interactions Script -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('opacity-80');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('opacity-80');
            });
        });

        // Simple Toggle behavior for severity
        const severityBtns = document.querySelectorAll('.flex.gap-2.p-1 button');
        severityBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                severityBtns.forEach(b => {
                    b.className = 'flex-1 py-3 rounded-lg font-mobile-text-label text-[11px] uppercase tracking-tighter transition-all bg-surface-container-high text-on-surface-variant';
                    b.style.border = 'none';
                });
                
                if(btn.innerText === 'LOW') btn.className = 'flex-1 py-3 rounded-lg font-mobile-text-label text-[11px] uppercase tracking-tighter transition-all bg-mobile-success/20 text-mobile-success border border-mobile-success/30';
                if(btn.innerText === 'MED') btn.className = 'flex-1 py-3 rounded-lg font-mobile-text-label text-[11px] uppercase tracking-tighter transition-all bg-mobile-warning/20 text-mobile-warning border border-mobile-warning/30';
                if(btn.innerText === 'HIGH') btn.className = 'flex-1 py-3 rounded-lg font-mobile-text-label text-[11px] uppercase tracking-tighter transition-all bg-mobile-danger/10 text-mobile-danger border border-mobile-danger/30';
                if(btn.innerText === 'CRITICAL') btn.className = 'flex-1 py-3 rounded-lg font-mobile-text-label text-[11px] uppercase tracking-tighter transition-all bg-mobile-danger text-white border border-mobile-danger';
            });
        });
    </script>

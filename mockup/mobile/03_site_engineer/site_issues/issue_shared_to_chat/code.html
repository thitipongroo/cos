<style>
        body {
            background-color: #031427;
            font-family: 'Inter Tight', sans-serif;
            color: #d3e4fe;

        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .chat-container {
            height: calc(100vh - 52px - 88px);
            overflow-y: auto;
            scrollbar-width: none;
        }
        .chat-container::-webkit-scrollbar {
            display: none;
        }
        .message-bubble-in {
            background-color: #1b2b3f;
            border-bottom-left-radius: 4px;
        }
        .message-bubble-out {

            border-bottom-right-radius: 4px;
        }

<body class="flex flex-col h-screen overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-mobile-edge h-mobile-touch-target bg-surface dark:bg-dark-bg border-b border-outline-variant dark:border-outline-variant">
<div class="flex items-center gap-space-3">
<button class="active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">arrow_back</span>
</button>
<div class="flex flex-col">
<span class="font-web-text-h1 text-web-text-h1 text-cos-blue leading-none tracking-tight">CONSTRUCTION OS</span>
<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-widest">Structural Team</span>
</div>
</div>
<button class="hover:bg-surface-variant/50 transition-colors duration-200 active:opacity-70 p-2 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="mt-[52px] mb-[88px] flex-1 chat-container px-mobile-edge py-space-4 flex flex-col gap-space-4">
<!-- Date Divider -->
<div class="flex justify-center my-space-2">
<span class="bg-surface-container px-3 py-1 rounded-full font-label-mobile text-label-mobile text-on-surface-variant">วันนี้</span>
</div>
<!-- Incoming Message -->
<div class="flex gap-space-2 max-w-[85%] self-start">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 border border-outline-variant">
<span class="material-symbols-outlined text-sm text-secondary">engineering</span>
</div>
<div class="flex flex-col gap-1">
<span class="font-label-mobile text-[11px] text-on-surface-variant ml-1">สมชาย (Structural Lead)</span>
<div class="message-bubble-in p-space-3 rounded-xl">
<p class="font-body-mobile text-body-mobile text-on-surface">ทีมครับ ดูหน้างาน Level 04 หน่อยครับ เหมือน rebar จะมีปัญหา</p>
</div>
<span class="text-[10px] text-on-surface-variant ml-auto">09:41</span>
</div>
</div>
<!-- Shared Issue Card (Outgoing Context) -->
<div class="flex flex-col gap-1 max-w-[90%] self-end">
<div class="message-bubble-out p-1 rounded-xl issue-card-shadow overflow-hidden border border-primary/20">
<!-- Internal Card Component -->
<div class="bg-surface-container-lowest rounded-lg overflow-hidden flex flex-col">
<div class="flex h-32 relative">
<div class="w-full h-full bg-cover bg-center" data-alt="A professional close-up photograph of misaligned structural steel rebar protruding from a concrete slab at a large-scale industrial construction site. The lighting is harsh and direct, emphasizing the metallic textures and shadows. The color palette is dominated by industrial greys and deep blues of the night-time construction site, with a sharp red digital overlay highlighting the misalignment area to denote a critical error. The overall mood is serious and mission-critical." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBMfslFzMnhWNFX300iv3GXOCHXC2bImoCcLQBsrxQxg6lJSKTt2mvfuyDu-s5AKK_DW5xutuzEcwThZfJwwgmgUeUJUdaz4TTFt_yq7-EvffL9nGWL0cKvwFv6ZuaYtTeYOP4uK_4nzNaAa8K9DeQXF3kgreuL9uSbr3jAJ4YUXq6BlQnDWZxIR56fijlJp-u-oKx4MMQBs1CNSmZcOSbsB9VjXC59lnKvd2YvMYyQQRguPVPpbCr2PFWCpj68qJCGUq0cgFAEJ0s')"></div>

                            VIEW DETAILS

<span class="text-[10px] text-white/60">09:45</span>

</div>

<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-high pb-safe pt-space-2 px-mobile-edge border-t border-outline-variant/20">

<span class="material-symbols-outlined">add</span>

<input class="bg-transparent border-none focus:ring-0 text-on-surface text-sm w-full font-body-mobile placeholder:text-on-surface-variant/50" placeholder="พิมพ์ข้อความ..." type="text"/>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">sentiment_satisfied</span>
</button>
</div>
<button class="w-11 h-11 rounded-full bg-cos-blue flex items-center justify-center text-white shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</footer>
<!-- Micro-interaction Script -->
<script>
        // Simple input focus behavior
        const input = document.querySelector('input');
        const footer = document.querySelector('footer');
        
        input.addEventListener('focus', () => {
            footer.classList.add('bg-surface-container-highest');
        });
        
        input.addEventListener('blur', () => {
            footer.classList.remove('bg-surface-container-highest');
        });

        // Chat scroll to bottom on load
        window.onload = () => {
            const container = document.querySelector('.chat-container');
            container.scrollTop = container.scrollHeight;
        };
    </script>

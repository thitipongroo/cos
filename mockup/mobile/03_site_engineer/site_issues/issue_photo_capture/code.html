<script>
        // Micro-interaction for shutter press
        const shutterBtn = document.querySelector('.shutter-ring').parentElement;
        shutterBtn.addEventListener('click', () => {
            // Flash effect
            const flashOverlay = document.createElement('div');
            flashOverlay.className = 'fixed inset-0 bg-white z-[100] pointer-events-none opacity-0';
            document.body.appendChild(flashOverlay);
            
            const flashAnim = [
                { opacity: 0 },
                { opacity: 0.8 },
                { opacity: 0 }
            ];
            flashOverlay.animate(flashAnim, { duration: 150 });
            
            setTimeout(() => flashOverlay.remove(), 200);
        });

        // Mocking GPS & Timestamp Updates
        setInterval(() => {
            const timeEl = document.querySelector('.uppercase');
            const now = new Date();
            const timeStr = `Timestamp: ${now.toISOString().split('T')[0]} ${now.toTimeString().split(' ')[0]}`;
            if(timeEl) timeEl.innerText = timeStr;
        }, 1000);
    </script>

<script>
        // Simple micro-interaction for progress circle simulation
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.querySelector('circle.text-cos-blue');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            
            function setProgress(percent) {
                const offset = circumference - (percent / 100 * circumference);
                circle.style.strokeDashoffset = offset;
            }

            // Animate progress up slightly over time
            let currentProgress = 45;
            const interval = setInterval(() => {
                if (currentProgress < 85) {
                    currentProgress += Math.random() * 0.5;
                    setProgress(currentProgress);
                    document.querySelector('.text-4xl.font-bold').innerText = `${Math.floor(currentProgress)}%`;
                }
            }, 1000);
        });

<script>
        // Micro-interaction for sheet dismissal simulation
        document.querySelector('button:last-of-type').addEventListener('click', function() {
            const overlay = document.querySelector('.fixed.inset-0.z-50');
            overlay.style.transition = 'opacity 0.3s ease-out, transform 0.3s ease-out';
            overlay.style.opacity = '0';
            overlay.style.transform = 'translateY(100%)';
            setTimeout(() => {
                document.querySelector('main').classList.remove('opacity-40');
                document.querySelector('nav').classList.remove('opacity-20');
            }, 150);
        });
    </script>

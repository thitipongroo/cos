<script>
        // Simple micro-interaction for checkboxes
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const parent = this.closest('label');
                if(this.checked) {
                    parent.classList.add('border-primary/30');
                    parent.classList.add('bg-surface-container-highest');
                } else {
                    parent.classList.remove('border-primary/30');
                    parent.classList.remove('bg-surface-container-highest');
                }
            });
        });

        // Initialize state
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            if(checkbox.checked) {
                const parent = checkbox.closest('label');
                parent.classList.add('border-primary/30');
                parent.classList.add('bg-surface-container-highest');
            }
        });

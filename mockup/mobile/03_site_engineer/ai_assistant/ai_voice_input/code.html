<style>
        @keyframes pulse-ring {
            0% { transform: scale(.33); }
            80%, 100% { opacity: 0; }
        }
        @keyframes pulse-dot {
            0% { transform: scale(.8); }
            50% { transform: scale(1); }
            100% { transform: scale(.8); }
        }
        .pulse-circle {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translateX(-50%) translateY(-50%);
            width: 280px;
            height: 280px;
        }
        .pulse-circle:before {
            content: '';
            position: relative;
            display: block;
            width: 300%;
            height: 300%;
            box-sizing: border-box;
            margin-left: -100%;
            margin-top: -100%;
            border-radius: 45px;
            background-color: #2563EB;
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        .waveform-bar {
            background: #2563EB;
            width: 4px;
            border-radius: 2px;
            transition: height 0.1s ease-in-out;
        }
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #06B6D4;
            vertical-align: middle;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .glass-panel {
            background: rgba(16, 32, 52, 0.7);
            backdrop-filter: blur(12px);

<script>
        // Simple waveform animation simulation
        const bars = document.querySelectorAll('.waveform-bar');
        
        function animateWaveform() {
            bars.forEach(bar => {
                const randomHeight = Math.floor(Math.random() * 40) + 8;
                bar.style.height = `${randomHeight}px`;
            });
            requestAnimationFrame(() => {
                setTimeout(animateWaveform, 100);
            });
        }
        
        animateWaveform();

        // Interaction for buttons
        document.querySelector('button.bg-cos-blue').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Processing...';
            this.classList.replace('bg-cos-blue', 'bg-cos-cyan');
        });

<style>
        body {
            background-color: #031427; /* surface */
            color: #d3e4fe; /* on-surface */
            font-family: 'Inter Tight', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Industrial inputs */
        .industrial-input {
            background: #102034; /* surface-container */
            border: 1px solid #434655; /* outline-variant */
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .industrial-input:focus {
            outline: none;
            border-color: #2563EB; /* cos-blue */
            box-shadow: inset 0 0 0 1px #2563EB;
        }

        /* AI Glassmorphism Effect */
        .ai-panel {
            background: rgba(6, 182, 212, 0.05); /* cos-cyan 5% */
            border-left: 2px solid #06B6D4; /* cos-cyan */
        }

        /* Active states for segmented chips */
        .chip-active {
            background-color: #2563eb; /* primary-container */
            color: #eeefff; /* on-primary-container */
        }

<body class="flex flex-col min-h-screen">
<!-- Top AppBar (Mobile Style) -->
<header class="bg-surface sticky top-0 z-50 flex items-center px-mobile-edge h-mobile-touch-target w-full">
<button aria-label="Go back" class="mr-web-space-4 flex items-center justify-center w-8 h-8 rounded-lg hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-web-text-h1 text-web-text-h1 font-bold text-primary flex-grow">Add Site Activity</h1>
<button class="flex items-center justify-center w-10 h-10 rounded-full">
<span class="material-symbols-outlined text-primary">account_circle</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow px-mobile-edge pt-web-space-4 pb-32">
<form class="space-y-web-space-8">
<!-- Activity Type Section -->
<section>
<label class="block font-mobile-text-label text-mobile-text-label text-on-surface-variant mb-web-space-2 uppercase tracking-wider">Activity Type</label>
<div class="flex gap-web-space-2 overflow-x-auto no-scrollbar py-web-base">
<button class="flex-shrink-0 px-4 h-9 flex items-center border border-outline-variant rounded-lg font-mobile-text-label text-mobile-text-label chip-active" type="button">
                        Planned Task
                    </button>
<button class="flex-shrink-0 px-4 h-9 flex items-center border border-outline-variant rounded-lg font-mobile-text-label text-mobile-text-label bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors" type="button">
                        Urgent Fix
                    </button>
<button class="flex-shrink-0 px-4 h-9 flex items-center border border-outline-variant rounded-lg font-mobile-text-label text-mobile-text-label bg-surface-container-high text-on-surface-variant hover:bg-surface-variant transition-colors" type="button">
                        Unplanned Activity
                    </button>
</div>
</section>
<!-- Activity Title Section -->
<section>
<label class="block font-mobile-text-label text-mobile-text-label text-on-surface-variant mb-web-space-2 uppercase tracking-wider" for="activity-title">Activity Title</label>
<input class="industrial-input w-full h-12 px-web-space-4 rounded-lg font-mobile-text-body text-mobile-text-body text-on-surface placeholder:text-outline/50" id="activity-title" placeholder="e.g., HVAC Ductwork Inspection" type="text"/>
</section>
<!-- Grid: Project Phase & Location -->
<div class="grid grid-cols-1 gap-web-space-6">
<section>
<label class="block font-mobile-text-label text-mobile-text-label text-on-surface-variant mb-web-space-2 uppercase tracking-wider" for="project-phase">Project Phase</label>
<div class="relative">
<select class="industrial-input appearance-none w-full h-12 px-web-space-4 rounded-lg font-mobile-text-body text-mobile-text-body text-on-surface bg-surface-container" id="project-phase">
<option>Phase 2: Superstructure</option>
<option>Phase 1: Foundation</option>
<option>Phase 3: MEP Rough-in</option>
</select>
<span class="material-symbols-outlined absolute right-web-space-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</section>
<section>
<label class="block font-mobile-text-label text-mobile-text-label text-on-surface-variant mb-web-space-2 uppercase tracking-wider" for="location">Location / Sector</label>
<div class="relative">
<select class="industrial-input appearance-none w-full h-12 px-web-space-4 rounded-lg font-mobile-text-body text-mobile-text-body text-on-surface bg-surface-container" id="location">
<option>North Wing - Level 4</option>
<option>South Lobby</option>
<option>Basement Storage B2</option>
</select>
<span class="material-symbols-outlined absolute right-web-space-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</section>
</div>
<!-- Priority Section -->
<section>
<label class="block font-mobile-text-label text-mobile-text-label text-on-surface-variant mb-web-space-2 uppercase tracking-wider">Priority Level</label>
<div class="grid grid-cols-4 gap-web-space-2">
<button class="h-10 flex flex-col items-center justify-center border border-outline-variant rounded-lg bg-surface-container-high transition-all active:scale-95" type="button">
<span class="text-web-text-tiny font-bold text-outline-variant">LOW</span>
<div class="w-full h-1 mt-1 bg-outline-variant opacity-20"></div>
</button>
<button class="h-10 flex flex-col items-center justify-center border border-outline-variant rounded-lg bg-surface-container-high transition-all active:scale-95" type="button">
<span class="text-web-text-tiny font-bold text-mobile-success">MED</span>
<div class="w-full h-1 mt-1 bg-mobile-success opacity-50"></div>
</button>
<button class="h-10 flex flex-col items-center justify-center border border-outline-variant rounded-lg bg-surface-container-high transition-all active:scale-95" type="button">
<span class="text-web-text-tiny font-bold text-mobile-warning">HIGH</span>
<div class="w-full h-1 mt-1 bg-mobile-warning opacity-50"></div>
</button>
<button class="h-10 flex flex-col items-center justify-center border border-cos-blue/50 rounded-lg bg-surface-container-high transition-all active:scale-95 ring-1 ring-mobile-danger/50" type="button">
<span class="text-web-text-tiny font-bold text-mobile-danger">CRIT</span>
<div class="w-full h-1 mt-1 bg-mobile-danger"></div>
</button>
</div>
</section>
<!-- CORE_AI Assistant Panel -->
<section class="ai-panel p-web-space-4 rounded-lg flex gap-web-space-4 items-start">
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-cos-cyan" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<div>
<h4 class="font-mobile-text-label text-mobile-text-label text-cos-cyan mb-web-space-1">CORE_AI Insight</h4>
<p class="font-web-text-small text-web-text-small text-on-surface-variant leading-relaxed">
                        CORE_AI suggests adding 2 extra workers for this urgent fix to avoid delay on the critical path of <span class="text-cos-cyan font-semibold">Phase 2: Superstructure</span>.
                    </p>
</div>
</section>
<!-- Attachments Section -->
<section class="grid grid-cols-2 gap-web-space-4">
<button class="flex items-center justify-center gap-web-space-2 h-14 border-2 border-dashed border-outline-variant rounded-xl bg-surface-container-low hover:bg-surface-variant transition-colors group" type="button">
<span class="material-symbols-outlined text-on-surface-variant group-active:scale-90 transition-transform">photo_camera</span>
<span class="font-mobile-text-label text-mobile-text-label text-on-surface-variant">Attach Photo</span>
</button>
<button class="flex items-center justify-center gap-web-space-2 h-14 border-2 border-dashed border-outline-variant rounded-xl bg-surface-container-low hover:bg-surface-variant transition-colors group" type="button">
<span class="material-symbols-outlined text-mobile-primary group-active:scale-90 transition-transform">mic</span>
<span class="font-mobile-text-label text-mobile-text-label text-on-surface-variant">Voice Briefing</span>
</button>
</section>
</form>
</main>
<!-- Footer CTA -->
<footer class="fixed bottom-0 left-0 w-full p-mobile-edge bg-surface/95 backdrop-blur-md z-40 border-t border-outline-variant/30">
<button class="w-full h-mobile-touch-target bg-primary-container text-on-primary-container font-web-text-h2 text-web-text-h2 rounded-lg shadow-lg active:scale-[0.98] transition-transform flex items-center justify-center gap-web-space-3" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_task</span>
            CREATE ACTIVITY
        </button>
</footer>

</div>
<script>
        // Micro-interactions for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if (this.type !== 'submit') {
                    // Toggle active classes for type chips
                    const parent = this.parentElement;
                    if (parent.classList.contains('no-scrollbar')) {
                        parent.querySelectorAll('button').forEach(b => {
                            b.classList.remove('chip-active');
                            b.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                        });
                        this.classList.add('chip-active');
                        this.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                    }
                }
            });
        });

        // Form submission animation mock
        const submitBtn = document.querySelector('button[type="submit"]');
        submitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Syncing...';
            submitBtn.classList.add('opacity-80');
            
            setTimeout(() => {
                submitBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> ACTIVITY CREATED';
                submitBtn.classList.remove('bg-primary-container');
                submitBtn.classList.add('bg-mobile-success');
                
                setTimeout(() => {
                    location.reload();
                }, 1500);
            }, 1000);
        });
    </script>
</body></html>

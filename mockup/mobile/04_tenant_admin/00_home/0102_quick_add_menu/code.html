<!-- Micro-interaction Script -->
<script>
        const syncBtn = document.getElementById('syncBtn');
        const syncIcon = document.getElementById('syncIcon').querySelector('span');
        
        syncBtn.addEventListener('click', () => {
            syncIcon.classList.add('animate-spin');
            syncBtn.classList.add('opacity-50', 'pointer-events-none');
            
            setTimeout(() => {
                syncIcon.classList.remove('animate-spin');
                syncBtn.classList.remove('opacity-50', 'pointer-events-none');
                syncIcon.innerText = 'check_circle';
                syncIcon.classList.add('text-mobile-success');
                setTimeout(() => {
                    syncIcon.innerText = 'sync';
                    syncIcon.classList.remove('text-mobile-success');
                }, 2000);
            }, 3000);
        });

        // Simple scale transition on entry for action items
        document.querySelectorAll('.action-item').forEach((item, index) => {
            item.style.opacity = '0';
            item.style.transform = 'translateY(20px)';
            setTimeout(() => {
                item.style.transition = 'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
                item.style.opacity = '1';
                item.style.transform = 'translateY(0)';
            }, 100 + (index * 50));
        });
    </script>

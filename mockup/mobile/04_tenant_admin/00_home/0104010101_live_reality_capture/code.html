<script>
        // Simple micro-interaction for the drone telemetry
        document.addEventListener('DOMContentLoaded', () => {
            const telemetryValues = document.querySelectorAll('.font-label-mobile');
            
            // Randomly flicker the signal or altitude slightly to feel "live"
            setInterval(() => {
                if(Math.random() > 0.7) {
                    const alt = Math.floor(120 + Math.random() * 5);
                    telemetryValues[0].textContent = alt + 'm';
                }
            }, 3000);
        });

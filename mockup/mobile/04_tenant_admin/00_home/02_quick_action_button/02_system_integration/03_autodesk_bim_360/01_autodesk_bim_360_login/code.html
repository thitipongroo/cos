<script>
        // Simple micro-interaction for the sign-in button
        document.querySelector('button').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> <span>AUTHENTICATING...</span>';
            btn.classList.add('opacity-80');
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.remove('opacity-80');
                btn.disabled = false;
            }, 2000);
        });

        // Handle focus states for input groups
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>

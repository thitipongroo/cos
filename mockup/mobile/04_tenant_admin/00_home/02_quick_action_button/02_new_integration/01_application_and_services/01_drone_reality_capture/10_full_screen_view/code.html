<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Construction OS - 3D Mesh Viewer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#414658",
                        "tertiary": "#c1c5dc",
                        "inverse-surface": "#d3e4fe",
                        "on-secondary-container": "#00424e",
                        "secondary-fixed": "#acedff",
                        "dark-surface": "#0F172A",
                        "on-primary-fixed": "#00174b",
                        "surface-variant": "#26364a",
                        "surface-container-high": "#1b2b3f",
                        "surface-tint": "#b4c5ff",
                        "on-error-container": "#ffdad6",
                        "mobile-warning": "#FF9500",
                        "inverse-on-surface": "#213145",
                        "surface-container-lowest": "#000f21",
                        "surface": "#031427",
                        "on-primary": "#002a78",
                        "primary": "#b4c5ff",
                        "surface-dim": "#031427",
                        "on-surface": "#d3e4fe",
                        "on-tertiary-container": "#eeefff",
                        "sync-pending": "#94A3B8",
                        "surface-bright": "#2a3a4f",
                        "error-container": "#93000a",
                        "on-primary-fixed-variant": "#003ea8",
                        "mobile-primary": "#0066FF",
                        "on-secondary-fixed": "#001f26",
                        "on-tertiary-fixed": "#161b2b",
                        "secondary-container": "#03b5d3",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-container": "#eeefff",
                        "mobile-success": "#00C853",
                        "inverse-primary": "#0053db",
                        "secondary": "#4cd7f6",
                        "primary-container": "#2563eb",
                        "sync-active": "#FFD60A",
                        "on-surface-variant": "#c3c6d7",
                        "on-tertiary": "#2b3041",
                        "on-error": "#690005",
                        "on-background": "#d3e4fe",
                        "tertiary-fixed-dim": "#c1c5dc",
                        "error": "#ffb4ab",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface-container": "#102034",
                        "secondary-fixed-dim": "#4cd7f6",
                        "tertiary-container": "#686c80",
                        "outline": "#8d90a0",
                        "on-secondary-fixed-variant": "#004e5c",
                        "background": "#020617",
                        "on-secondary": "#003640",
                        "mobile-danger": "#FF3B30",
                        "tertiary-fixed": "#dee1f9",
                        "outline-variant": "#434655",
                        "surface-container-low": "#0b1c30",
                        "surface-container-highest": "#26364a",
                        "dark-bg": "#020617",
                        "ai-cyan": "#4cd7f6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "edge-mobile": "24px",
                        "space-2": "8px",
                        "touch-target": "52px",
                        "space-1": "4px",
                        "web-margin": "32px",
                        "space-4": "16px",
                        "space-3": "12px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-mobile": ["Inter Tight"],
                        "h1-web": ["Inter Tight"],
                        "hero-mobile": ["Inter Tight"],
                        "display-web": ["Inter Tight"],
                        "body-web": ["Inter Tight"],
                        "tiny-web": ["Inter Tight"],
                        "body-mobile": ["Inter Tight"],
                        "h2-web": ["Inter Tight"]
                    },
                    "fontSize": {
                        "label-mobile": ["13px", {"lineHeight": "18px", "fontWeight": "600"}],
                        "h1-web": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "hero-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                        "display-web": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-web": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "tiny-web": ["11px", {"lineHeight": "12px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "body-mobile": ["17px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "h2-web": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        @layer base {
            body {
                @apply bg-dark-bg text-on-surface overflow-hidden;
                font-family: 'Inter Tight', sans-serif;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hud-glass {
            background: rgba(11, 16, 32, 0.75);
            backdrop-filter: blur(16px);
            border-left: 2px solid #4cd7f6;
            border-top: 1px solid rgba(76, 215, 246, 0.1);
            border-right: 1px solid rgba(76, 215, 246, 0.1);
            border-bottom: 1px solid rgba(76, 215, 246, 0.1);
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(76, 215, 246, 0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer-anim 4s infinite linear;
        }
        @keyframes shimmer-anim {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="relative h-screen w-screen overflow-hidden select-none bg-dark-bg">
<!-- 3D Fullscreen Viewport Background -->
<div class="absolute inset-0 z-0">
<!-- Overlaying a static depth layer to ensure the "industrial" feel -->
<div class="absolute inset-0 pointer-events-none opacity-40" style="background-image: radial-gradient(circle at 50% 50%, transparent 0%, #000 100%);"></div>
<!-- Grid Floor Simulation -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]" style="background-image: linear-gradient(rgba(76, 215, 246, 0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(76, 215, 246, 0.5) 1px, transparent 1px); background-size: 50px 50px;"></div>
</div>
<!-- Top Navigation Layer -->
<nav class="fixed top-0 left-0 w-full p-edge-mobile flex justify-between items-start z-50 pointer-events-none">
<!-- Brand / Identity -->
<div class="flex items-center gap-space-3 pointer-events-auto group">
<div class="w-10 h-10 flex items-center justify-center rounded-lg overflow-hidden"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2bzqD65HFqEjBF_tzmI7F67PSHA9NhQ4EdNce6mNM2wRbjYuGwOzIQ_ZrckjwV3LHpistfSGKizHE57GRlEypuQvTtwLXf-9vLCXrO9xM2wq6TngUIPlsAKYPpjCvG7YU4nGT_jLJ85ZM81HEJAQlNsX6wymv_6Svd4pnrVDIAJ7xbcDO7j8CchhfNfcgQXl7XqOKGxs_K23iTWzlR0vZ2zomS8Kdp8SX4was51ExEf64g8bgk7Yg9WIVay-x2TkDsFN06DuAGc0" alt="COS Icon" class="w-full h-full object-cover"></div>
<div class="flex flex-col">
<span class="font-display-web text-body-mobile font-bold tracking-tight text-on-surface">CONSTRUCTION OS</span>
<span class="font-tiny-web text-ai-cyan uppercase tracking-widest">MISSION DETAIL / 3D VIEW</span>
</div>
</div>
<!-- Exit Button - Clear and Professional -->
<button class="pointer-events-auto h-touch-target px-space-4 bg-surface-container/90 hover:bg-surface-container-highest border border-outline-variant text-on-surface rounded-xl flex items-center gap-space-2 backdrop-blur-xl transition-all duration-200 active:scale-95 shadow-xl shadow-black/20" onclick="window.history.back()">
<span class="font-label-mobile text-label-mobile uppercase">Exit Fullscreen</span>
<span class="material-symbols-outlined text-[20px]">close_fullscreen</span>
</button>
</nav>
<!-- Right Side HUD: Telemetry -->
<aside class="fixed right-edge-mobile top-32 flex flex-col gap-space-3 z-40 w-64">
<!-- Spatial Metadata Card -->
<div class="hud-glass p-space-4 rounded-r-lg relative overflow-hidden">
<div class="shimmer absolute inset-0 opacity-20"></div>
<div class="relative z-10">
<div class="flex justify-between items-center mb-space-2">
<span class="font-tiny-web text-on-surface-variant uppercase">Spatial Metadata</span>
<span class="flex h-2 w-2 rounded-full bg-sync-active animate-pulse shadow-[0_0_8px_rgba(255,214,10,0.5)]"></span>
</div>
<div class="space-y-space-3">
<div class="flex flex-col">
<span class="font-tiny-web text-on-surface-variant uppercase">Current Sector</span>
<span class="font-h1-web text-ai-cyan">SECTOR 7B</span>
</div>
<div class="grid grid-cols-2 gap-space-2">
<div class="flex flex-col">
<span class="font-tiny-web text-on-surface-variant uppercase">Accuracy</span>
<span class="font-h2-web text-ai-cyan">98.2%</span>
</div>
<div class="flex flex-col">
<span class="font-tiny-web text-on-surface-variant uppercase">Deviations</span>
<span class="font-h2-web text-error">4</span>
</div>
</div>
</div>
</div>
</div>
<!-- Active Overlays List -->
<div class="hud-glass p-space-4 rounded-r-lg border-l-ai-cyan/50">
<span class="font-tiny-web text-on-surface-variant uppercase block mb-space-3">Visual Layers</span>
<div class="flex flex-col gap-space-2">
<button class="flex items-center justify-between p-space-2 rounded bg-ai-cyan/20 text-ai-cyan border border-ai-cyan/30 transition-colors h-touch-target">
<span class="font-label-mobile text-tiny-web">Structural Mesh</span>
<span class="material-symbols-outlined text-[16px]">visibility</span>
</button>
<button class="flex items-center justify-between p-space-2 rounded bg-surface-container-low text-on-surface-variant border border-outline-variant/30 hover:bg-surface-container transition-colors h-touch-target">
<span class="font-label-mobile text-tiny-web">Point Cloud</span>
<span class="material-symbols-outlined text-[16px]">visibility_off</span>
</button>
<button class="flex items-center justify-between p-space-2 rounded bg-surface-container-low text-on-surface-variant border border-outline-variant/30 hover:bg-surface-container transition-colors h-touch-target">
<span class="font-label-mobile text-tiny-web">Heatmap (Stress)</span>
<span class="material-symbols-outlined text-[16px]">visibility_off</span>
</button>
</div>
</div>
</aside>
<!-- Bottom Controls Overlay -->
<div class="fixed bottom-edge-mobile left-1/2 -translate-x-1/2 flex items-center gap-space-4 z-40 bg-surface-container-lowest/80 backdrop-blur-2xl p-space-2 rounded-2xl border border-ai-cyan/20 shadow-2xl">
<!-- Interaction Tools -->
<div class="flex items-center p-space-1 bg-surface-container-high/50 rounded-xl">
<button class="w-touch-target h-touch-target flex items-center justify-center text-ai-cyan rounded-lg hover:bg-ai-cyan/10 transition-all active:scale-90" title="Rotate">
<span class="material-symbols-outlined">rotate_90_degrees_cw</span>
</button>
<button class="w-touch-target h-touch-target flex items-center justify-center text-on-surface-variant rounded-lg hover:bg-surface-bright/20 transition-all active:scale-90" title="Pan">
<span class="material-symbols-outlined">pan_tool</span>
</button>
<button class="w-touch-target h-touch-target flex items-center justify-center text-on-surface-variant rounded-lg hover:bg-surface-bright/20 transition-all active:scale-90" title="Zoom">
<span class="material-symbols-outlined">zoom_in</span>
</button>
</div>
<div class="h-8 w-[1px] bg-outline-variant/30"></div>
<!-- View Presets -->
<div class="flex items-center gap-space-2 px-space-2">
<button class="px-space-3 py-space-1 rounded-full bg-ai-cyan text-on-secondary font-label-mobile text-tiny-web uppercase tracking-wider">Top View</button>
<button class="px-space-3 py-space-1 rounded-full bg-surface-container-high text-on-surface-variant font-label-mobile text-tiny-web uppercase tracking-wider hover:text-on-surface transition-colors">Isometric</button>
<button class="px-space-3 py-space-1 rounded-full bg-surface-container-high text-on-surface-variant font-label-mobile text-tiny-web uppercase tracking-wider hover:text-on-surface transition-colors">Section</button>
</div>
<div class="h-8 w-[1px] bg-outline-variant/30"></div>
<!-- Capture / Action -->
<button class="h-touch-target px-space-4 bg-ai-cyan text-on-secondary rounded-xl flex items-center gap-space-2 font-label-mobile uppercase active:scale-95 transition-transform shadow-lg shadow-ai-cyan/20">
<span class="material-symbols-outlined">photo_camera</span>
<span class="">Snapshot</span>
</button>
</div>
<!-- Orientation Widget (Compass) -->
<div class="fixed bottom-edge-mobile right-edge-mobile z-40 w-24 h-24 pointer-events-none opacity-80">
<div class="relative w-full h-full border-2 border-ai-cyan/20 rounded-full flex items-center justify-center bg-dark-bg/20">
<div class="absolute top-1 text-tiny-web font-bold text-ai-cyan/60">N</div>
<div class="absolute bottom-1 text-tiny-web font-bold text-on-surface-variant/40">S</div>
<div class="absolute left-1 text-tiny-web font-bold text-on-surface-variant/40">W</div>
<div class="absolute right-1 text-tiny-web font-bold text-on-surface-variant/40">E</div>
<!-- Dynamic needle -->
<div class="w-1 h-12 bg-ai-cyan rounded-full origin-center transition-transform duration-75 shadow-[0_0_8px_rgba(76,215,246,0.4)]" id="compass-needle" style="transform: rotate(134.155deg);"></div>
</div>
</div>
<!-- Status Ticker - Maintain clear BIM status -->
<div class="fixed bottom-edge-mobile left-edge-mobile z-40 flex flex-col gap-space-1 pointer-events-none">
<div class="flex items-center gap-space-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[14px]">sensors</span>
<span class="font-tiny-web uppercase">LiDAR Stream: <span class="text-ai-cyan">Active</span></span>
</div>
<div class="flex items-center gap-space-2 bg-surface-container-highest/40 backdrop-blur-md px-space-2 py-space-1 rounded-lg border border-outline-variant/30">
<span class="material-symbols-outlined text-[14px] text-mobile-success">cloud_sync</span>
<span class="font-tiny-web uppercase font-bold tracking-wider text-mobile-success">SYNCED TO BIM SERVER</span>
</div>
</div>
<script>
        // Micro-interaction for the compass needle simulation
        let rotation = 45;
        setInterval(() => {
            rotation += (Math.random() - 0.5) * 2.5;
            const needle = document.getElementById('compass-needle');
            if (needle) needle.style.transform = `rotate(${rotation}deg)`;
        }, 100);

        // Simple button active state visual feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
            btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
        });
    </script>


</body></html>

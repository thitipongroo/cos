<script>
        // Micro-interaction for shutter press
        document.querySelector('.shutter-glow').addEventListener('click', function() {
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[100] opacity-100 transition-opacity duration-300';
            document.body.appendChild(flash);
            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 300);
            }, 50);
        });

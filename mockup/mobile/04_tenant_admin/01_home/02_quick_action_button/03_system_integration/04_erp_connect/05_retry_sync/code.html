<style>
        @keyframes pulse-yellow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
        }
        .pulse-yellow {
            animation: pulse-yellow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes rotate-industrial {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-industrial-spin {
            animation: rotate-industrial 4s linear infinite;
        }
        .glass-ai {
            background: rgba(3, 181, 211, 0.08);
            backdrop-filter: blur(12px);
            border-left: 3px solid #4cd7f6;
        }
        .wireframe-grid {
            background-image: radial-gradient(#26364a 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .progress-ring {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>

<body class="bg-dark-bg text-on-surface font-body-mobile overflow-hidden h-screen flex flex-col">
<!-- Background Layer: Infrastructure Navy Wireframe -->
<div class="fixed inset-0 wireframe-grid opacity-20 pointer-events-none"></div>
<div class="fixed inset-0 bg-gradient-to-b from-dark-bg/50 via-transparent to-dark-bg pointer-events-none"></div>
<!-- TopAppBar - JSON Source Mapping -->

<div class="flex items-center gap-3">

</div>
<div class="flex items-center gap-2 px-3 py-1 bg-sync-active/10 rounded-full pulse-yellow">

</div>
</header>
<!-- Main Content Canvas -->

<!-- Industrial Loading Component -->
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Background Ring -->
<svg class="absolute w-full h-full">
<circle class="text-surface-variant" cx="128" cy="128" fill="transparent" r="100" stroke="currentColor" stroke-width="8"></circle>
</svg>
<!-- Progress Ring -->
<svg class="absolute w-full h-full">
<circle class="text-primary progress-ring" cx="128" cy="128" fill="transparent" r="100" stroke="currentColor" stroke-dasharray="628.3" stroke-dashoffset="364.4" stroke-linecap="round" stroke-width="8" style="stroke-dashoffset: 6.283;"></circle>
</svg>
<!-- Decorative Industrial Teeth -->
<div class="absolute inset-0 animate-industrial-spin opacity-20">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-4 h-6 bg-primary rounded-sm"></div>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-4 h-6 bg-primary rounded-sm"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-6 h-4 bg-primary rounded-sm"></div>
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-6 h-4 bg-primary rounded-sm"></div>
</div>
<!-- Central Percentage -->
<div class="flex flex-col items-center">
<span class="font-hero-mobile text-[56px] text-on-surface leading-none" id="percent-display">99%</span>
<span class="font-label-mobile text-on-surface-variant uppercase tracking-tighter opacity-70">กำลังประมวลผล</span>
</div>
</div>

<span class="material-symbols-outlined text-[18px]">close</span>CANCEL SYNC</button>
</footer>
<script>
        // Micro-interaction for percentage counter
        let count = 42;
        const display = document.getElementById('percent-display');
        const interval = setInterval(() => {
            if (count < 99) {
                count += Math.floor(Math.random() * 3);
                if (count > 99) count = 99;
                display.innerText = count + '%';
                
                // Update ring dash offset (Circumference ~ 628.3)
                const offset = 628.3 - (628.3 * count / 100);
                document.querySelector('.progress-ring').style.strokeDashoffset = offset;
            }
        }, 1500);

        // Simple touch feedback on the screen
        document.body.addEventListener('touchstart', (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'absolute rounded-full bg-primary/10 pointer-events-none -translate-x-1/2 -translate-y-1/2 animate-ping';
            ripple.style.width = '100px';
            ripple.style.height = '100px';
            ripple.style.left = e.touches[0].clientX + 'px';
            ripple.style.top = e.touches[0].clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1000);
        });
    </script>

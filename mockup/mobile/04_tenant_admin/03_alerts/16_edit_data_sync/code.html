<!-- Micro-interaction Script -->
<script>
        function applyAICorrection() {
            const field = document.getElementById('tax-id-field');
            field.value = "TX-9920-X";
            field.classList.remove('text-mobile-danger', 'border-mobile-danger/50', 'font-bold');
            field.classList.add('text-secondary', 'border-secondary/50');
            
            // Notification or visual feedback
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined">check</span>';
            btn.classList.replace('bg-secondary', 'bg-mobile-success');
            
            setTimeout(() => {
                btn.innerText = 'APPLIED';
            }, 1000);
        }

        // Ripple/Active State enhancement for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.opacity = '0.8';
            });
            btn.addEventListener('touchend', () => {
                btn.style.opacity = '1';
            });
        });
    </script>

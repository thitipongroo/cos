<!-- Interactive Layer: Ripple simulation -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                if (this.classList.contains('bento-card')) {
                    document.querySelectorAll('.bento-card').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Visual feedback for "Selection"
                    const color = this.querySelector('div').style.backgroundColor || 
                                 window.getComputedStyle(this.querySelector('div')).backgroundColor;
                    
                    document.querySelectorAll('.bg-\\[\\#b4c5ff\\]').forEach(el => {
                        el.style.backgroundColor = color;
                    });
                    document.querySelectorAll('.border-\\[\\#b4c5ff\\]').forEach(el => {
                        el.style.borderColor = color;
                    });
                    document.querySelectorAll('.text-\\[\\#b4c5ff\\]').forEach(el => {
                        el.style.color = color;
                    });
                }
            });
        });

        // Simple subtle entrance animation
        window.addEventListener('DOMContentLoaded', () => {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.4s ease';
            requestAnimationFrame(() => {
                document.body.style.opacity = '1';
            });
        });
    </script>

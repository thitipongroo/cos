<body class="bg-background text-on-surface min-h-screen flex flex-col overflow-x-hidden">

<div class="flex items-center gap-3">

<h1 class="font-h1-web text-h1-web-mobile font-bold text-on-surface tracking-tight">CONSTRUCTION OS</h1>

<div class="flex items-center gap-2 px-3 py-1 bg-mobile-success/10 rounded-full border border-mobile-success/20">

</div>

<!-- Success Animation/Icon Container -->
<div class="relative mb-8">
<div class="w-24 h-24 rounded-full bg-mobile-success flex items-center justify-center success-glow transform transition-transform duration-500 hover:scale-105">
<span class="material-symbols-outlined text-white text-5xl" data-icon="check" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<!-- Concentric rings effect -->
<div class="absolute inset-0 border-2 border-mobile-success/20 rounded-full scale-125 animate-ping opacity-30"></div>
</div>
<!-- Text Content -->
<div class="text-center space-y-4 max-w-sm">
<h2 class="font-hero-mobile text-hero-mobile text-white">บันทึกโลโก้สำเร็จ</h2>
<p class="font-body-mobile text-body-mobile text-on-surface-variant">
                อัตลักษณ์แบรนด์ของคุณได้รับการอัปเดตและซิงค์ข้อมูลลงในระบบเรียบร้อยแล้ว
            </p>

</div>
<div>
<p class="font-label-mobile text-[11px] uppercase tracking-[0.1em] text-secondary opacity-80">System Integrity Scan</p>
<p class="font-body-mobile text-sm text-on-surface font-medium">CORE_AI: Brand consistency verified across all modules (100% confidence)</p>
</div>
</div>
</div>
<!-- Action Buttons Cluster -->
<div class="mt-12 w-full max-w-md flex flex-col gap-space-3">
<button class="h-touch-target w-full bg-primary-container text-on-primary-container font-label-mobile text-label-mobile rounded-xl font-bold uppercase tracking-wider flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-lg">
<span>กลับไปยังหน้าหลัก</span>

<button class="h-touch-target w-full border border-outline text-on-surface font-label-mobile text-label-mobile rounded-xl font-bold uppercase tracking-wider flex items-center justify-center gap-2 hover:bg-surface-bright/5 active:scale-[0.98] transition-all">
<span>ดูการตั้งค่าระบบ</span>

<script>
        // Micro-interaction for the success icon on load
        document.addEventListener('DOMContentLoaded', () => {
            const checkIcon = document.querySelector('.success-glow');
            if(checkIcon) {
                checkIcon.classList.add('scale-0');
                setTimeout(() => {
                    checkIcon.classList.remove('scale-0');
                    checkIcon.classList.add('scale-100');
                }, 100);
            }
        });
    </script>

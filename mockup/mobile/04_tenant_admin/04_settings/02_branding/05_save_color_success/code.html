<!DOCTYPE html>

<html class="dark" lang="th"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .success-glow {
            box-shadow: 0 0 40px rgba(0, 200, 83, 0.15);
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        body {
            background-color: #031427;
            font-family: 'Inter Tight', sans-serif;
        }
    </style>
</head>
<body class="antialiased text-on-surface overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-container-low flex items-center justify-between px-edge-mobile h-touch-target">
<div class="flex items-center gap-space-3">
<button class="active:scale-95 transition-transform hover:bg-surface-container-high p-2 rounded-full">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h1-mobile text-h1-mobile font-bold tracking-tight text-on-surface">CONSTRUCTION OS</h1>
</div>
<div class="flex items-center gap-space-2 bg-surface-container-high px-3 py-1 rounded-full border border-outline-variant/20">
<span class="w-2 h-2 rounded-full bg-sync-active animate-pulse"></span>
<span class="text-tiny-web text-on-surface-variant font-bold">SYNCED</span>
</div>
</header>
<!-- Main Canvas -->
<main class="relative pt-[72px] pb-[72px] min-h-screen flex flex-col px-edge-mobile overflow-y-auto">
<!-- Atmospheric Background Shaders -->
<div class="absolute inset-0 pointer-events-none -z-10 opacity-30">

</div>
<!-- Success Identity Section -->
<div class="flex-grow flex flex-col items-center justify-center py-space-4 mt-8">
<div class="relative mb-8">
<!-- Success Glow & Animation -->
<div class="absolute inset-0 bg-mobile-success opacity-20 blur-3xl rounded-full animate-pulse"></div>
<div class="w-24 h-24 bg-surface-container-highest rounded-full flex items-center justify-center success-glow border-2 border-mobile-success/30 relative z-10">
<span class="material-symbols-outlined text-[48px] text-mobile-success" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<h2 class="font-hero-mobile text-hero-mobile text-white text-center mb-space-2">
                บันทึกสีระบบสำเร็จ
            </h2>
<p class="font-body-mobile text-body-mobile text-on-surface-variant text-center max-w-[280px]">
                โทนสีหลักของระบบได้รับการอัปเดตและมีผลกับทุกโมดูลเรียบร้อยแล้ว
            </p>
</div>
<!-- AI Insight Box -->
<div class="mb-8 p-space-4 bg-surface-container-high rounded-xl border-l-4 border-secondary shadow-sm relative overflow-hidden">
<div class="shimmer absolute inset-0 opacity-10"></div>
<div class="flex gap-space-3 relative z-10">
<span class="material-symbols-outlined text-secondary" data-icon="neurology">neurology</span>
<div>
<span class="block text-tiny-web font-bold text-secondary tracking-widest mb-1 uppercase">CORE_AI Insight</span>
<p class="text-label-mobile text-on-surface leading-tight">
                        Color palette meets WCAG 2.2 AA standards for all lighting conditions.
                    </p>
</div>
</div>
</div>
<!-- Action Stack -->
<div class="flex flex-col gap-space-3 mb-12">
<button class="w-full h-[52px] bg-primary-container text-on-primary-container font-bold uppercase tracking-wider rounded-xl active:scale-95 transition-all shadow-lg flex items-center justify-center gap-space-2">
<span>กลับไปยังหน้าหลัก</span>
</button>
<button class="w-full h-[52px] bg-transparent text-on-surface border border-outline-variant font-bold uppercase tracking-wider rounded-xl active:scale-95 transition-all flex items-center justify-center hover:bg-surface-container-low">
<span>ดูการตั้งค่าระบบ</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container-lowest pb-safe h-[72px] flex justify-around items-center px-2 shadow-lg">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-all active:scale-95">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-mobile text-label-mobile mt-0.5">แดชบอร์ด</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-all active:scale-95">
<span class="material-symbols-outlined" data-icon="architecture">architecture</span>
<span class="font-label-mobile text-label-mobile mt-0.5">โครงการ</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-all active:scale-95">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<span class="font-label-mobile text-label-mobile mt-0.5">งาน</span>
</button>
<!-- Active Tab: Settings -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-all active:scale-95">
<span class="material-symbols-outlined" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-mobile text-label-mobile mt-0.5">ตั้งค่า</span>
</button>
</nav>
<script>
        // Simple Micro-interaction for feedback
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.classList.add('scale-95');
            });
            button.addEventListener('touchend', function() {
                this.classList.remove('scale-95');
            });
        });

        // Background Subtle Interaction
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 10 - 5;
            const y = (e.clientY / window.innerHeight) * 10 - 5;
            document.querySelector('main').style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body></html>

<script>
        // Micro-interaction for the Download Button
        const downloadBtn = document.getElementById('downloadBtn');
        const progress = document.getElementById('progress');
        
        downloadBtn.addEventListener('click', () => {
            if (downloadBtn.classList.contains('processing')) return;
            
            downloadBtn.classList.add('processing');
            const btnText = downloadBtn.querySelector('.z-10');
            const originalHTML = btnText.innerHTML;
            
            btnText.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Generating...';
            
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    btnText.innerHTML = '<span class="material-symbols-outlined">check</span> Exported';
                    setTimeout(() => {
                        progress.style.width = '0%';
                        btnText.innerHTML = originalHTML;
                        downloadBtn.classList.remove('processing');
                    }, 2000);
                } else {
                    width += 2;
                    progress.style.width = width + '%';
                }
            }, 30);
        });

        // Hover animation logic for cards
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => btn.classList.add('opacity-70'));
            btn.addEventListener('touchend', () => btn.classList.remove('opacity-70'));
        });

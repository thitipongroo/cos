<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple animation for the AI module
            const aiModule = document.querySelector('.animate-pulse-subtle');
            if (aiModule) {
                let opacity = 0.05;
                let growing = true;
                setInterval(() => {
                    if (growing) {
                        opacity += 0.005;
                        if (opacity >= 0.12) growing = false;
                    } else {
                        opacity -= 0.005;
                        if (opacity <= 0.05) growing = true;
                    }
                    aiModule.style.backgroundColor = `rgba(6, 182, 212, ${opacity})`;
                }, 100);
            }

            // Input focus effects
            const inputs = document.querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.querySelector('label')?.classList.add('text-cos-blue');
                });
                input.addEventListener('blur', () => {
                    input.parentElement.querySelector('label')?.classList.remove('text-cos-blue');
                });
            });
        });
    </script>

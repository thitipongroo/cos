<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Update Issue Status | SiteOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter Tight', sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .technical-grid {
            background-size: 24px 24px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        .glass-card {
            background: rgba(16, 32, 52, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(67, 70, 85, 0.5);
        }
        input:focus, textarea:focus {
            outline: none;
            box-shadow: inset 0 0 0 2px #2563EB;
        }
        .status-radio:checked + label {
            background-color: #0066FF;
            color: white;
            border-color: #0066FF;
        }
        .status-radio:checked + label .material-symbols-outlined {
            color: white;
        }
        .status-radio:checked + label .status-desc {
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#acedff",
                        "mobile-success": "#00C853",
                        "on-tertiary-container": "#eeefff",
                        "outline": "#8d90a0",
                        "sync-pending": "#94A3B8",
                        "tertiary": "#c1c5dc",
                        "on-primary-fixed": "#00174b",
                        "cos-cyan": "#06B6D4",
                        "inverse-on-surface": "#213145",
                        "on-primary-fixed-variant": "#003ea8",
                        "outline-variant": "#434655",
                        "on-tertiary-fixed": "#161b2b",
                        "cos-navy": "#0B1020",
                        "on-error-container": "#ffdad6",
                        "surface-container-lowest": "#000f21",
                        "on-primary-container": "#eeefff",
                        "inverse-surface": "#d3e4fe",
                        "on-error": "#690005",
                        "cos-blue": "#2563EB",
                        "tertiary-fixed-dim": "#c1c5dc",
                        "primary-container": "#2563eb",
                        "mobile-danger": "#FF3B30",
                        "surface-dim": "#031427",
                        "tertiary-container": "#686c80",
                        "secondary": "#4cd7f6",
                        "surface-tint": "#b4c5ff",
                        "on-secondary-fixed": "#001f26",
                        "sync-active": "#FFD60A",
                        "on-background": "#d3e4fe",
                        "on-tertiary-fixed-variant": "#414658",
                        "on-secondary": "#003640",
                        "background": "#031427",
                        "error": "#ffb4ab",
                        "surface-container-high": "#1b2b3f",
                        "surface": "#031427",
                        "inverse-primary": "#0053db",
                        "primary-fixed-dim": "#b4c5ff",
                        "dark-bg": "#020617",
                        "secondary-container": "#03b5d3",
                        "surface-container": "#102034",
                        "on-primary": "#002a78",
                        "cos-white": "#F8FAFC",
                        "secondary-fixed-dim": "#4cd7f6",
                        "primary-fixed": "#dbe1ff",
                        "error-container": "#93000a",
                        "primary": "#b4c5ff",
                        "on-secondary-fixed-variant": "#004e5c",
                        "on-surface-variant": "#c3c6d7",
                        "mobile-warning": "#FF9500",
                        "mobile-primary": "#0066FF",
                        "on-surface": "#d3e4fe",
                        "surface-container-low": "#0b1c30",
                        "surface-bright": "#2a3a4f",
                        "tertiary-fixed": "#dee1f9",
                        "on-tertiary": "#2b3041",
                        "dark-surface": "#0F172A",
                        "on-secondary-container": "#00424e",
                        "surface-container-highest": "#26364a",
                        "surface-variant": "#26364a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "web-base": "4px",
                        "web-space-3": "12px",
                        "web-space-2": "8px",
                        "web-space-8": "32px",
                        "mobile-edge": "24px",
                        "web-space-4": "16px",
                        "web-space-1": "4px",
                        "mobile-touch-target": "52px"
                    },
                    "fontFamily": {
                        "mobile-text-hero": ["Inter Tight"],
                        "web-text-tiny": ["Inter Tight"],

                        "web-text-h2": ["Inter Tight"],
                        "mobile-text-label": ["Inter Tight"]
                    },
                    "fontSize": {

                        "web-text-body": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "web-text-display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "web-text-small": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "web-text-h1": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "mobile-text-body": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "web-text-h2": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "mobile-text-label": ["13px", { "lineHeight": "18px", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-dark-bg text-cos-white technical-grid min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-mobile-edge h-mobile-touch-target bg-dark-surface border-b border-outline-variant/30 transition-colors duration-200">
<div class="flex items-center gap-4">
<button class="p-2 -ml-2 active:opacity-70 transition-colors duration-200 hover:bg-surface-variant/50 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-mobile-text-body text-mobile-text-body text-cos-white font-semibold">Update Status</h1>
</div>
<button class="p-2 -mr-2 active:opacity-70 transition-colors duration-200 hover:bg-surface-variant/50">
<span class="material-symbols-outlined text-primary">more_vert</span>
</button>
</header>
<main class="pt-20 px-mobile-edge max-w-md mx-auto space-y-6">
<!-- Issue Summary Header -->
<div class="bg-dark-surface p-4 rounded-xl border border-outline-variant/50 border-l-4 border-l-mobile-warning shadow-sm">
<div class="flex justify-between items-start mb-2">
<span class="font-web-text-tiny text-web-text-tiny text-on-surface-variant uppercase tracking-wider">Issue ID</span>
<span class="bg-mobile-warning/20 text-mobile-warning px-2 py-0.5 rounded text-[11px] font-bold">IN PROGRESS</span>
</div>
<h2 class="font-web-text-h2 text-web-text-h2 text-cos-white mb-1">Exposed Rebar Oxidation - Sector B</h2>
<p class="font-web-text-small text-web-text-small text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">tag</span>
                #IS-4402
            </p>
</div>
<!-- Status Selection -->
<section class="space-y-3">
<h3 class="font-mobile-text-label text-mobile-text-label text-on-surface-variant uppercase flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">rule</span>
                Select New Status
            </h3>
<div class="grid grid-cols-1 gap-3">
<input checked="" class="hidden status-radio" id="status_resolved" name="issue_status" type="radio"/>
<label class="flex items-center gap-4 p-4 rounded-lg border border-outline-variant/50 bg-dark-surface text-cos-white cursor-pointer transition-all active:scale-[0.98]" for="status_resolved">
<div class="w-10 h-10 rounded-full bg-mobile-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-mobile-primary">check_circle</span>
</div>
<div class="flex-1">
<p class="font-mobile-text-body text-mobile-text-body font-semibold">RESOLVED</p>
<p class="text-[12px] text-on-surface-variant status-desc">Work completed and verified on-site.</p>
</div>
</label>
<input class="hidden status-radio" id="status_closed" name="issue_status" type="radio"/>
<label class="flex items-center gap-4 p-4 rounded-lg border border-outline-variant/50 bg-dark-surface text-cos-white cursor-pointer transition-all active:scale-[0.98]" for="status_closed">
<div class="w-10 h-10 rounded-full bg-outline/10 flex items-center justify-center">
<span class="material-symbols-outlined text-outline">cancel</span>
</div>
<div class="flex-1">
<p class="font-mobile-text-body text-mobile-text-body font-semibold">CLOSED</p>
<p class="text-[12px] text-on-surface-variant status-desc">No further action required/Voided.</p>
</div>
</label>
<input class="hidden status-radio" id="status_keep_progress" name="issue_status" type="radio"/>
<label class="flex items-center gap-4 p-4 rounded-lg border border-outline-variant/50 bg-dark-surface text-cos-white cursor-pointer transition-all active:scale-[0.98]" for="status_keep_progress">
<div class="w-10 h-10 rounded-full bg-mobile-warning/10 flex items-center justify-center">
<span class="material-symbols-outlined text-mobile-warning">pending</span>
</div>
<div class="flex-1">
<p class="font-mobile-text-body text-mobile-text-body font-semibold">KEEP IN PROGRESS</p>
<p class="text-[12px] text-on-surface-variant status-desc">Active work continuing; update notes only.</p>
</div>
</label>
</div>
</section>
<!-- Resolution Notes with AI Support -->
<section class="space-y-3">
<div class="flex justify-between items-end">
<label class="font-mobile-text-label text-mobile-text-label text-on-surface-variant uppercase" for="notes">Resolution Notes</label>
<button class="flex items-center gap-1 text-[11px] font-bold text-cos-cyan bg-cos-cyan/10 px-2 py-1 rounded-full border border-cos-cyan/20">
<span class="material-symbols-outlined text-[14px]">auto_awesome</span>
                    AI ASSIST
                </button>
</div>
<div class="relative group">
<textarea class="w-full bg-dark-surface border border-outline-variant/50 rounded-lg p-4 text-cos-white placeholder:text-on-surface-variant/50 font-web-text-body text-web-text-body focus:border-mobile-primary transition-colors" id="notes" placeholder="Describe the remediation steps taken..." rows="4"></textarea>
<div class="absolute bottom-3 right-3 flex items-center gap-2 opacity-40">
<span class="material-symbols-outlined text-sm text-cos-white">mic</span>
<span class="text-[10px] font-mono text-cos-white">VOICE-ENABLED</span>
</div>
</div>
<!-- AI Suggestion Bubble -->
<div class="p-3 bg-cos-cyan/10 border-l-2 border-l-cos-cyan rounded-r-lg flex gap-3 animate-pulse">
<span class="material-symbols-outlined text-cos-cyan text-[18px]">psychology</span>
<p class="text-[13px] text-cos-cyan leading-tight">
                    Suggestion: "Applied high-zinc anti-corrosion coating and structural patch mortar to Sector B grid lines."
                </p>
</div>
</section>
<!-- Evidence Attachment -->
<section class="space-y-3">
<div class="flex justify-between items-center">
<h3 class="font-mobile-text-label text-mobile-text-label text-on-surface-variant uppercase">Remediation Evidence</h3>
<span class="text-[12px] text-on-surface-variant">0 / 4 Photos</span>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="aspect-square rounded-lg border-2 border-dashed border-outline-variant/50 flex flex-col items-center justify-center gap-2 text-on-surface-variant hover:bg-surface-variant/20 transition-colors bg-dark-surface/30">
<span class="material-symbols-outlined text-3xl">add_a_photo</span>
<span class="text-[12px] font-semibold">Add Photo</span>
</button>
<div class="aspect-square rounded-lg bg-dark-surface flex items-center justify-center border border-outline-variant/30">
<div class="w-full h-full opacity-30 grayscale relative">
<div class="absolute inset-0 bg-gradient-to-t from-dark-bg/80 to-transparent"></div>
<span class="absolute inset-0 flex items-center justify-center material-symbols-outlined text-4xl text-cos-white">image</span>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-dark-surface/90 backdrop-blur-xl border-t border-outline-variant/30 space-y-3 flex flex-col">
<button class="w-full h-mobile-touch-target bg-cos-blue text-white rounded-xl font-semibold flex items-center justify-center gap-2 shadow-lg shadow-cos-blue/20 active:scale-95 transition-transform">
<span class="material-symbols-outlined">save</span>
            Confirm Status Update
        </button>
<button class="w-full h-mobile-touch-target bg-transparent text-on-surface-variant rounded-xl font-semibold flex items-center justify-center hover:bg-surface-variant/50 active:scale-95 transition-all">
            Cancel
        </button>
</div>
<!-- Voice Note Hold-to-Record Trigger -->
<div class="fixed bottom-36 right-6 z-40">
<button class="w-16 h-16 rounded-full bg-mobile-primary text-white flex items-center justify-center shadow-2xl active:scale-110 transition-transform" id="voiceTrigger">
<span class="material-symbols-outlined text-3xl">mic</span>
</button>
</div>
<script>
        // Interaction logic for dark mode radio behavior
        const radioInputs = document.querySelectorAll('input[name="issue_status"]');
        const radioLabels = document.querySelectorAll('label[for^="status_"]');
        
        radioLabels.forEach(label => {
            label.addEventListener('click', () => {
                // Tailwind handles styling via :checked selector in CSS, 
                // but we can add manual focus-ring like effects here if needed
            });
        });

        // Micro-interaction for voice button
        const voiceBtn = document.getElementById('voiceTrigger');
        
        voiceBtn.addEventListener('mousedown', () => {
            voiceBtn.classList.add('scale-125', 'bg-mobile-danger');
        });

        voiceBtn.addEventListener('mouseup', () => {
            voiceBtn.classList.remove('scale-125', 'bg-mobile-danger');
        });

        voiceBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            voiceBtn.classList.add('scale-125', 'bg-mobile-danger');
        });

        voiceBtn.addEventListener('touchend', () => {
            voiceBtn.classList.remove('scale-125', 'bg-mobile-danger');
        });
    </script>
</body></html>

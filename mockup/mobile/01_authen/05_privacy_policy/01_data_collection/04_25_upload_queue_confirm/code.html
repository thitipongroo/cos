<style>
        /* Hide scrollbar for cleaner mobile look */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background h-screen flex flex-col antialiased selection:bg-mobile-primary selection:text-white">
<!-- Header: Focused Task Intent, Navigation Shelled Suppressed -->
<header class="flex justify-between items-center px-mobile-edge-margin h-touch-target-optimum border-b border-outline-variant bg-surface shrink-0">
<h1 class="font-mobile-title text-mobile-title text-on-surface">Uploads Queue</h1>
<button aria-label="Done, return to file system" class="font-headline-h3 text-headline-h3 text-mobile-primary font-bold h-full flex items-center active:scale-95 transition-transform">
            Done
        </button>
</header>
<!-- Main Content Area: List of Uploads -->
<main class="flex-1 overflow-y-auto p-mobile-edge-margin flex flex-col gap-mobile-section-pad"><div class="flex-1 flex flex-col items-center justify-center text-center gap-4 opacity-80">
<div class="w-20 h-20 rounded-full bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant">cloud_off</span>
</div>
<div class="flex flex-col gap-2">
<h2 class="font-headline-h2 text-headline-h2 text-on-surface">No Active Uploads</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[240px]">Your queue is empty. New uploads will appear here.</p>
</div>
<button class="mt-4 px-8 h-touch-target-optimum bg-mobile-primary text-white font-headline-h3 text-headline-h3 rounded-lg active:scale-95 transition-transform shadow-lg">
        Upload New File
    </button>
</div></main>
<!-- Footer Action -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-mobile-edge-margin bg-black/60 backdrop-blur-sm" id="clear-confirmation-modal">
<div class="bg-surface-container rounded-xl border border-outline-variant p-mobile-edge-margin w-full max-w-sm shadow-lg flex flex-col gap-4">
<div class="flex flex-col gap-2">
<h3 class="font-headline-h2 text-headline-h2 text-on-surface">Clear History?</h3>
<p class="font-body-md text-body-md text-on-surface-variant">This will remove all successfully uploaded files from this list. This action cannot be undone.</p>
</div>
<div class="flex justify-end gap-4 mt-2">
<button class="font-headline-h3 text-headline-h3 text-on-surface-variant px-4 h-10 active:scale-95 transition-transform">Cancel</button>
<button class="font-headline-h3 text-headline-h3 text-danger px-4 h-10 active:scale-95 transition-transform">Clear All</button>
</div>
</div>
</div></body></html>

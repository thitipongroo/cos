<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased flex flex-col h-screen overflow-hidden selection:bg-tertiary selection:text-on-tertiary">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant flex justify-between items-center px-mobile-edge-margin h-touch-target-optimum w-full docked full-width top-0 z-40 transition-colors duration-200">
<button class="text-on-surface-variant hover:bg-surface-variant transition-colors duration-200 rounded-full p-mobile-icon-pad flex items-center justify-center h-10 w-10">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back" data-weight="fill" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-headline-h1 text-headline-h1 font-bold tracking-tighter text-primary dark:text-primary">Escalate Violation</h1>
<button class="text-on-surface-variant hover:bg-surface-variant transition-colors duration-200 rounded-full p-mobile-icon-pad flex items-center justify-center h-10 w-10">
<span class="material-symbols-outlined text-2xl text-syncing" data-icon="sync" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sync</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pb-[90px] pt-4 px-4 sm:px-mobile-edge-margin">
<div class="max-w-md mx-auto flex flex-col gap-mobile-section-pad">
<!-- Progress Stepper -->
<div class="flex items-center justify-between px-2 mb-2">
<div class="flex items-center gap-2 flex-1">
<div class="h-6 w-6 rounded-full bg-success text-background flex items-center justify-center font-label-tiny text-label-tiny">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-tiny text-label-tiny text-on-surface-variant">Incident Context</span>
</div>
<div class="h-[2px] bg-outline-variant flex-1 mx-2"></div>
<div class="flex items-center gap-2 flex-1 justify-end">
<div class="h-6 w-6 rounded-full bg-tertiary text-background flex items-center justify-center font-label-tiny text-label-tiny">2</div>
<span class="font-label-tiny text-label-tiny text-tertiary">Escalation Details</span>
</div>
</div>
<!-- Section 1: Violation Reference -->
<section class="bg-surface-container rounded-xl border border-outline-variant p-mobile-card-pad flex flex-col gap-3">
<h2 class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider">Violation Reference</h2>
<div class="flex gap-4 items-center">
<div class="h-16 w-16 rounded-lg overflow-hidden shrink-0 border border-outline-variant relative">
<div class="bg-cover bg-center w-full h-full" data-alt="A close-up, high-contrast photograph of a construction worker's head from behind, noticeably missing a hard hat on an active industrial site. The lighting is harsh midday sun, casting deep shadows over concrete forms and steel rebar. The mood is tense and observational, highlighting a critical safety failure. The color palette emphasizes industrial grays and warning yellows against a stark, high-density background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBUtkDWyAWh4WvP155P-uekq8JLwF0NALQ2EXwhO428nu5fhygR5_FMxUBSxvguU2KKV79Amb5try53CE-MM7TP3f4LgDcVhdRjalz8ceXAQ0RXZJUE5ZhuMgBDZ2JRzd2VlAj9dHiELiLwq3_oavDFpi5dJSArC8YnFm4uT11oqutPuLcZgD2ec-Z37krIymyKTJpv5FFHo_hxQaCAZT4Lo2GvT4dxg3qiCyz3hdM7yCm4hKFB8JE5oQ')"></div>
</div>
<div class="flex flex-col gap-1">
<span class="inline-flex w-fit px-2 py-0.5 rounded-full bg-error-container text-on-error border border-error font-label-tiny text-label-tiny uppercase">PPE: HELMET MISSING</span>
<span class="font-body-md text-body-md text-on-surface">Incident ID: <span class="font-mono text-tertiary">VIO-992-G</span></span>
</div>
</div>
</section>
<!-- Section 2: Escalation Authority -->
<section class="flex flex-col gap-2">
<label class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider" for="escalation_authority">Escalation Authority</label>
<div class="relative">
<select class="w-full bg-surface-container border border-outline-variant rounded-lg h-touch-target-optimum px-4 text-on-surface font-body-md text-body-md appearance-none focus:outline-none focus:ring-2 focus:ring-tertiary focus:border-transparent" id="escalation_authority">
<option selected="" value="sarah">Project Manager - Sarah Miller</option>
<option value="david">HSE Director - David Chen</option>
<option value="site_lead">Site Superintendent - James Ross</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">expand_more</span>
</div>
</div>
</section>
<!-- Section 3: Severity Level -->
<section class="flex flex-col gap-2">
<label class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider">Severity Level</label>
<div class="grid grid-cols-2 gap-2">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="severity" type="radio" value="urgent"/>
<div class="h-touch-target-optimum rounded-lg border border-outline-variant bg-surface-container flex items-center justify-center gap-2 peer-checked:border-warning peer-checked:bg-surface-container-high transition-colors">
<span class="w-3 h-3 rounded-full bg-warning"></span>
<span class="font-headline-h3 text-headline-h3 text-on-surface">URGENT</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="severity" type="radio" value="emergency"/>
<div class="h-touch-target-optimum rounded-lg border border-outline-variant bg-surface-container flex items-center justify-center gap-2 peer-checked:border-danger peer-checked:bg-error-container peer-checked:text-on-error transition-colors">
<span class="w-3 h-3 rounded-full bg-danger"></span>
<span class="font-headline-h3 text-headline-h3 text-on-surface peer-checked:text-on-error">EMERGENCY</span>
</div>
</label>
</div>
</section>
<!-- Section 4: Additional Context -->
<section class="flex flex-col gap-2">
<label class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider" for="additional_context">Additional Context</label>
<textarea class="w-full bg-surface-container border border-outline-variant rounded-lg p-4 text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-tertiary focus:border-transparent resize-none" id="additional_context" placeholder="Enter field notes, observations, or immediate actions taken..." rows="4"></textarea>
</section>
<!-- Section 5: AI Impact Assessment -->
<section class="bg-surface-container-high rounded-xl border border-tertiary/30 p-mobile-card-pad flex flex-col gap-2 relative overflow-hidden">
<div class="absolute top-0 right-0 p-2 opacity-10">
<span class="material-symbols-outlined text-4xl text-tertiary" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<div class="flex items-center gap-2 text-tertiary">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">memory</span>
<h2 class="font-label-tiny text-label-tiny uppercase tracking-wider">AI Impact Assessment</h2>
</div>
<p class="font-body-md text-body-md text-on-surface">Projected Delay: <span class="font-headline-h3 text-headline-h3 text-warning">0.5 Days</span> (Work Stoppage Risk)</p>
</section>
<!-- Footer Action -->
<div class="mt-4 pb-4">
<button class="w-full h-touch-target-optimum bg-danger hover:bg-red-600 text-white font-headline-h3 text-headline-h3 rounded-lg flex items-center justify-center gap-2 transition-colors duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">warning</span>
                    Confirm Escalation
                </button>
</div>
</div>
</main>
</body></html>

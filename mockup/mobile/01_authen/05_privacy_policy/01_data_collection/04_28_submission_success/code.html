<style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(circle at 50% -20%, rgba(0, 102, 255, 0.1) 0%, rgba(3, 20, 39, 1) 40%);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .success-pulse {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar (From JSON) -->
<header class="bg-surface-dim dark:bg-surface-container-lowest text-primary dark:text-primary-fixed w-full top-0 sticky border-b border-outline-variant flex items-center justify-between px-mobile-edge-margin h-touch-target-optimum z-50">
<button aria-label="Go back" class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100 h-10 w-10 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-h2 text-headline-h2 font-bold tracking-tight">Submission Confirmed</h1>
<button aria-label="Sync status" class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-100 h-10 w-10 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined">sync</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-mobile-edge-margin py-8 w-full max-w-lg mx-auto relative overflow-hidden">
<div class="flex-1 flex flex-col items-center justify-center gap-8 w-full">
<!-- Success Indicator -->
<div class="relative w-28 h-28 flex items-center justify-center">
<div class="absolute inset-0 rounded-full bg-success/10 success-pulse"></div>
<div class="absolute inset-2 rounded-full border-2 border-success/30"></div>
<div class="w-20 h-20 rounded-full bg-surface-container border border-success/50 flex items-center justify-center shadow-[0_0_30px_rgba(16,185,129,0.2)] z-10">
<span class="material-symbols-outlined text-[48px] text-success" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Headline -->
<div class="text-center space-y-2">
<h2 class="font-mobile-hero text-mobile-hero text-concrete-white">Review Request Submitted</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Your data has been successfully securely transmitted.</p>
</div>
<!-- Reference ID Plaque -->
<div class="w-full bg-surface-container border border-outline-variant rounded-xl p-5 flex flex-col items-center gap-1 shadow-sm">
<span class="font-label-tiny text-label-tiny text-on-primary-container tracking-[0.1em] uppercase">Reference ID</span>
<span class="font-mono text-2xl font-bold text-tertiary tracking-wider select-all">REV-A93-B72</span>
</div>
<!-- Status Card -->
<div class="w-full bg-surface-container-high border-l-4 border-warning rounded-r-xl p-5 shadow-sm relative overflow-hidden">
<!-- Diagonal stripes for industrial feel -->
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, #fff 10px, #fff 20px);"></div>
<div class="relative z-10 flex flex-col gap-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-warning text-lg" style="font-variation-settings: 'FILL' 1;">pending</span>
<h3 class="font-label-tiny text-label-tiny text-warning uppercase tracking-wider">Pending Status</h3>
</div>
<p class="font-headline-h3 text-headline-h3 text-concrete-white">Awaiting Site Lead Approval</p>
<div class="h-px w-full bg-outline-variant/50 my-1"></div>
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-on-surface-variant text-base mt-0.5">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
                            Sarah Jenkins (Site Lead) has been notified. Expected response time: <span class="text-on-surface font-semibold">&lt; 24 hours</span>.
                        </p>
</div>
</div>
</div>
</div>
<!-- Action Area -->
<div class="w-full flex flex-col gap-4 mt-12 pb-6">
<button class="w-full h-touch-target-optimum bg-mobile-primary hover:bg-mobile-primary/90 text-concrete-white font-headline-h3 text-headline-h3 rounded-xl flex items-center justify-center gap-3 transition-all active:scale-[0.98] shadow-[0_4px_14px_0_rgba(0,102,255,0.39)]">
<span class="material-symbols-outlined text-xl">dashboard</span>
                Return to Dashboard
            </button>
<button class="w-full h-touch-target-optimum bg-transparent border border-outline hover:bg-surface-container-high text-on-surface font-headline-h3 text-headline-h3 rounded-xl flex items-center justify-center gap-3 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-xl">history</span>
                View Audit Log
            </button>
</div>
</main>
<!-- BottomNavBar is intentionally suppressed per Linear/Transactional rules -->
</body></html>

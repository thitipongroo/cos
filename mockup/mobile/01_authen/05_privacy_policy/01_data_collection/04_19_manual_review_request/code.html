<style>
        /* Custom scrollbar for horizontal scrolling */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

            -ms-overflow-style: none;
            scrollbar-width: none;

<body class="bg-background text-on-surface font-mobile-body antialiased min-h-screen flex flex-col">
<!-- Top App Bar (Semantic Shell - Replaces standard TopAppBar due to transactional nature) -->
<header class="w-full h-16 bg-surface border-b border-outline-variant flex items-center justify-between px-mobile-edge-margin z-40 sticky top-0">
<button aria-label="Go Back" class="h-touch-target-min w-touch-target-min flex items-center justify-start text-mobile-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-h2 text-headline-h2 text-on-surface text-center flex-1">Request Review</h1>
<div class="w-touch-target-min h-touch-target-min"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-mobile-edge-margin py-mobile-section-pad gap-mobile-section-pad pb-32 overflow-y-auto">
<!-- Context Card -->
<div class="bg-surface-container-low border border-outline-variant rounded-xl p-mobile-card-pad">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-mobile-primary text-sm">assignment</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Log ID: #A93-B72</span>
</div>
<h2 class="font-headline-h3 text-headline-h3 text-on-surface">Concrete Pour 4B - Structural Rebar Inspection Failure</h2>
</div>
<!-- Priority Selector -->
<section class="flex flex-col gap-mobile-base">
<label class="font-headline-h3 text-headline-h3 text-on-surface">Priority Level</label>
<div class="grid grid-cols-4 gap-2">
<button class="h-touch-target-min rounded-lg border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm flex flex-col items-center justify-center active:bg-surface-bright transition-colors" data-priority="low">Low</button>
<button class="h-touch-target-min rounded-lg border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm flex flex-col items-center justify-center active:bg-surface-bright transition-colors" data-priority="med">Med</button>
<button class="h-touch-target-min rounded-lg border-2 border-warning bg-warning/10 text-warning font-body-sm text-body-sm font-semibold flex flex-col items-center justify-center transition-colors" data-priority="high">High</button>
<button class="h-touch-target-min rounded-lg border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm flex flex-col items-center justify-center active:bg-surface-bright transition-colors" data-priority="urgent">Urgent</button>
</div>
</section>
<!-- Justification Input -->
<section class="flex flex-col gap-mobile-base">
<label class="font-headline-h3 text-headline-h3 text-on-surface" for="justification">Justification</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-4 font-mobile-body text-mobile-body text-on-surface placeholder:text-on-surface-variant focus:border-tertiary focus:ring-1 focus:ring-tertiary resize-none" id="justification" placeholder="Explain the reason for this manual review..." rows="4"></textarea>
</section>
<!-- Photo Evidence -->
<section class="flex flex-col gap-mobile-base overflow-hidden">
<label class="font-headline-h3 text-headline-h3 text-on-surface">Photo Evidence</label>
<div class="flex gap-4 overflow-x-auto hide-scrollbar pb-2">
<button class="shrink-0 w-24 h-24 rounded-xl border border-dashed border-outline-variant flex flex-col items-center justify-center bg-surface-container-low text-mobile-primary active:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-2xl mb-1">add_a_photo</span>
<span class="font-label-tiny text-label-tiny">Add Photo</span>
</button>
<div class="shrink-0 w-24 h-24 rounded-xl overflow-hidden border border-outline-variant relative">
<img class="w-full h-full object-cover" data-alt="A close-up photograph of exposed steel rebar inside a wooden concrete formwork on a construction site. The lighting is harsh, natural outdoor sunlight, highlighting rust spots and uneven wire ties. The overall aesthetic is industrial, rugged, and realistic, captured as field evidence for an engineering inspection." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBWa6h8UyBb9uEmRVULPAgkJpaxeB0rD6HOQUHeYiXqaEtiY3BYlQxaxPzWLTJeukm2kg_kFrbKgSJFnRC5gf9be7QLVLItIZO977g2V-1MYkezD8S2n0VMCnrZzg0fOVEuvIxlTYSFhpjU3sHrGyxLBP0PzuG5NpWY5gqWOFexnFS5FIpGgiW5FoeTVu3I4qfXMqmwt0QLZoZp8TWlYplQ4BWQF6RizVWF3QQ-sK0kJumC0zL54ml0WA"/>
<button class="absolute top-1 right-1 w-6 h-6 bg-surface/80 rounded-full flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">close</span>
</button>
</div>
</div>
</section>
<!-- Target Reviewer Selection -->
<section class="flex flex-col gap-mobile-base">
<label class="font-headline-h3 text-headline-h3 text-on-surface">Assign To</label>
<button class="w-full h-touch-target-optimum bg-surface-container-low border border-outline-variant rounded-xl px-4 flex items-center justify-between active:bg-surface-bright transition-colors">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-headline-h3 text-headline-h3">SJ</div>
<span class="font-mobile-body text-mobile-body text-on-surface">Sarah Jenkins (Site Lead)</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">arrow_drop_down</span>
</button>
</section>
</main>
<!-- Bottom Action Area (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-highest border-t border-outline-variant p-mobile-edge-margin pb-8 z-50">
<button class="w-full h-touch-target-optimum bg-mobile-primary text-concrete-white rounded-xl font-headline-h3 text-headline-h3 flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-lg">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">send</span>
            Submit Request
        </button>
</div>
<!-- Note: BottomNavBar is suppressed as this is a transactional/task-focused screen with a "Back" action, following the Semantic Shell Mandate. -->

        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-ai-cyan selection:text-white">
<!-- TopNavBar for Mobile (Composition Screen - Hiding global nav items) -->
<header class="w-full h-14 bg-primary-container border-b border-outline-variant flex justify-between items-center px-4 sticky top-0 z-50">
<button aria-label="Go Back" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;">arrow_back</span>
</button>
<h1 class="font-headline-h2 text-headline-h2 text-on-surface">Send Evidence</h1>
<button aria-label="Send" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-mobile-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined text-ai-cyan" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;">send</span>
</button>
</header>

<!-- Form Fields -->
<div class="flex flex-col gap-4">
<!-- Recipient Input -->
<div class="flex flex-col gap-1">
<label class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider" for="recipient-email">Recipient Email</label>
<div class="relative">
<input class="w-full rounded bg-surface-container-high border border-outline px-4 mobile-input-height font-body-md focus:border-ai-cyan focus:ring-1 focus:ring-ai-cyan" id="recipient-email" placeholder="project.manager@constructintel.com" required="" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">contact_mail</span>
</div>
</div>
<!-- CC Input -->
<div class="flex flex-col gap-1">
<label class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider" for="cc-email">CC (Optional)</label>
<input class="w-full rounded bg-surface-container-high border border-outline px-4 mobile-input-height font-body-md focus:border-ai-cyan focus:ring-1 focus:ring-ai-cyan" id="cc-email" placeholder="team@example.com" type="text"/>
</div>
<!-- Subject Input -->
<div class="flex flex-col gap-1">
<label class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider" for="subject">Subject</label>
<input class="w-full rounded bg-surface-container-high border border-outline px-4 mobile-input-height font-body-md focus:border-ai-cyan focus:ring-1 focus:ring-ai-cyan" id="subject" required="" type="text" value="Site Ops Evidence: Node 7 Rack Status Issue"/>
</div>
<!-- Message Area -->
<div class="flex flex-col gap-1 flex-grow">
<label class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider" for="message">Message / Context</label>
<textarea class="w-full rounded bg-surface-container-high border border-outline p-4 font-body-md resize-none focus:border-ai-cyan focus:ring-1 focus:ring-ai-cyan min-h-[120px]" id="message" placeholder="Add operational context here..." rows="5"></textarea>
<!-- AI Insight Suggestion -->
<div class="flex items-center gap-2 mt-2 p-2 bg-surface-container rounded border-l-2 border-ai-cyan">
<span class="material-symbols-outlined text-ai-cyan text-[16px]">smart_toy</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Auto-generated summary available based on attached metadata.</span>
<button class="ml-auto text-ai-cyan font-label-tiny text-label-tiny hover:underline">APPLY</button>
</div>
</div>
</div>

            </h3>

<!-- Overlay Icon -->
<div class="absolute inset-0 flex items-center justify-center bg-black/30">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</div>
<!-- Metadata -->
<div class="flex-grow flex flex-col justify-center min-w-0">
<span class="font-body-md text-body-md text-on-surface truncate font-medium">node7_rack_status.jpg</span>
<div class="flex items-center gap-2 mt-1">
<span class="bg-surface-variant text-on-surface-variant px-2 py-0.5 rounded font-label-tiny text-label-tiny">3.2 MB</span>
<span class="text-on-surface-variant font-body-sm text-body-sm truncate flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">location_on</span>
                            Sector 4B, Level -2
                        </span>
</div>
</div>

<button aria-label="Remove attachment" class="h-10 w-10 flex items-center justify-center text-on-surface-variant hover:text-danger hover:bg-danger/10 rounded transition-colors flex-shrink-0">
<span class="material-symbols-outlined">close</span>
</button>
</div>

<span class="material-symbols-outlined">add_photo_alternate</span>

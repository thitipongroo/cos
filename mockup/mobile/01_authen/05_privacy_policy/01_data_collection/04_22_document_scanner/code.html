<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        .viewfinder-cutout {
            box-shadow: 0 0 0 9999px rgba(3, 20, 39, 0.85); /* surface color with opacity */
            border-radius: 4px;
        }
        .edge-guide {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: #06B6D4; /* ai-cyan */
            border-style: solid;
        }
        .edge-guide.top-left { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-top-left-radius: 4px; }
        .edge-guide.top-right { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-top-right-radius: 4px; }
        .edge-guide.bottom-left { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-bottom-left-radius: 4px; }
        .edge-guide.bottom-right { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-bottom-right-radius: 4px; }
        
        /* Shimmer effect for guides */
        @keyframes shimmer {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        .edge-guide {
            animation: shimmer 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-black text-on-surface h-screen w-screen overflow-hidden flex flex-col relative font-mobile-body">
<!-- Camera Feed Mockup Background -->
<div class="absolute inset-0 z-0 bg-surface">
<div class="w-full h-full bg-cover bg-center opacity-40" data-alt="A blurred top-down view of an active construction site blueprint spread across a rough wooden table. The lighting is slightly dim and industrial, suggesting a field office environment. The image is out of focus, serving as a background for a camera interface." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDlNmlCTEAwO0E3peftQgMcw4qq-2kVBjQuYU4xMJNcOwKvplRLYkPAepM4jhtsozC7j_UXtcoeJ8HX35sJH487nYtYueHL2DUMk-0JqiIt1LoXYVc36_HdbBELnk3fr0217xpXgQTePThvbgUAElbXqEjRVamsuWxEdH3D-fsKlNPWpysTomHszUPtgjl9kqPNLh6i5tn4LRALiek9C-RTSWIevs-tMo-Z3R7EsWbhqXFqBcHz7FKa7w')"></div>
</div>
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant transition-colors duration-200 active:opacity-70 flex justify-between items-center px-mobile-edge-margin h-touch-target-optimum fixed top-0 w-full z-50">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-bright dark:hover:bg-surface-bright rounded-full p-2 h-touch-target-min w-touch-target-min flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-mobile-title text-mobile-title font-bold text-primary dark:text-primary">Document Capture</h1>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-bright dark:hover:bg-surface-bright rounded-full p-2 h-touch-target-min w-touch-target-min flex items-center justify-center">
<span class="material-symbols-outlined">flash_on</span>
</button>
</header>
<!-- Viewfinder Area -->
<main class="flex-grow flex flex-col items-center justify-center relative z-10 pt-touch-target-optimum pb-32">
<!-- Overlay with Cutout -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center p-6">
<div class="w-full h-full max-h-[70vh] border-2 border-transparent relative viewfinder-cutout">
<!-- AI Edge Detection Guides -->
<div class="edge-guide top-left"></div>
<div class="edge-guide top-right"></div>
<div class="edge-guide bottom-left"></div>
<div class="edge-guide bottom-right"></div>
<!-- Center Reticle (Subtle) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-8 h-8 border border-white/20 rounded-full flex items-center justify-center">
<div class="w-1 h-1 bg-white/40 rounded-full"></div>
</div>
</div>
</div>
<!-- Guidance Text -->
<div class="absolute bottom-40 left-0 right-0 text-center px-mobile-edge-margin z-20 pointer-events-none">
<div class="inline-flex items-center gap-2 bg-surface-container-highest/90 backdrop-blur-sm px-4 py-2 rounded-full border border-ai-cyan/30 shadow-lg">
<span class="material-symbols-outlined text-ai-cyan text-sm" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
<p class="font-body-md text-body-md text-concrete-white font-medium">Position document within the frame</p>
</div>
</div>
</main>
<!-- Bottom Controls (Replaces BottomNavBar for task focus) -->
<div class="fixed bottom-0 w-full bg-surface-container/95 backdrop-blur-md border-t border-outline-variant pb-safe pt-4 px-mobile-edge-margin z-50 flex items-center justify-between h-32">
<!-- Gallery Button -->
<button class="flex flex-col items-center justify-center w-touch-target-optimum h-touch-target-optimum group">
<div class="w-12 h-12 rounded-lg border border-outline-variant overflow-hidden mb-1 group-active:scale-95 transition-transform">
<div class="w-full h-full bg-cover bg-center" data-alt="A small thumbnail showing a previously scanned construction invoice document with clear black text on white paper, neatly cropped." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA0QSTn8_VGd1h6U66Rwj9vZKId80WiYew1LCz1P9X6zHybKOpL7eOk0DOE7mxjoyGfTV0loOTh7o_LNVtwhcrMNACUF4xe2f9pKYzgFjzM8Vvy43esInBos80n36RVmkvL2c3Wjoq39-fU7c4kzLe17ulirJDRXdeSJPxvvYzNH4aeIpu7trq3_5G4GOCbezV5piK37-OcbuPtU_N7910bNH6KOAhPvXMBEgQLCy2cDWBeQS7vAJKpuA')"></div>
</div>
</button>
<!-- Shutter Button -->
<button class="relative w-20 h-20 rounded-full border-4 border-outline flex items-center justify-center active:scale-95 transition-transform">
<div class="w-16 h-16 bg-concrete-white rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.3)]">
<!-- Inner circle indication for photo -->
</div>
</button>
<!-- Auto-Capture Toggle -->
<button class="flex flex-col items-center justify-center w-touch-target-optimum h-touch-target-optimum group">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center border border-ai-cyan/50 text-ai-cyan group-active:bg-surface-bright transition-colors">
<span class="material-symbols-outlined">auto_awesome</span>
</div>
<span class="font-label-tiny text-label-tiny text-on-surface-variant mt-1 uppercase tracking-wider">Auto On</span>
</button>
</div>
</body></html>

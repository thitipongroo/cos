                </button>

                    Didn't receive a code? <button class="text-[#2563EB] font-medium hover:underline disabled:opacity-50 disabled:no-underline ml-1" disabled="" id="resend-btn">Resend (available in <span id="timer">54</span>s)</button>

<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            // Paste logic
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, inputs.length).replace(/[^0-9]/g, '');
                for (let i = 0; i < pastedData.length; i++) {
                    if (index + i < inputs.length) {
                        inputs[index + i].value = pastedData[i];
                        if (index + i < inputs.length - 1) {
                             inputs[index + i + 1].focus();
                        }
                    }
                }
            });
        });

        // Form submission (Optimistic UI mockup)
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            
            // Simulate processing
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span><span class="ml-2">Verifying...</span>`;
            btn.disabled = true;
            
            setTimeout(() => {
                // Simulate success
                btn.classList.remove('bg-[#2563EB]', 'hover:bg-blue-600', 'shadow-[0_0_15px_rgba(37,99,235,0.3)]');
                btn.classList.add('bg-success');
                btn.innerHTML = `<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span><span class="ml-2">Export Started</span>`;
            }, 1000);
        });

        // Timer Logic
        let timeLeft = 54;
        const timerSpan = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');
        
        const countdown = setInterval(() => {
            timeLeft--;
            timerSpan.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                resendBtn.disabled = false;
                resendBtn.innerHTML = 'Resend now';
            }
        }, 1000);
    </script>

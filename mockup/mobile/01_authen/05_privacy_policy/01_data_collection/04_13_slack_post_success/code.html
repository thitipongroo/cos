<body class="bg-background text-on-background min-h-screen flex flex-col antialiased overflow-hidden font-mobile-body">
<!-- Top Navigation (Transactional screen, nav suppressed but retaining a back option as a safety fallback, though instructions say linear hides nav. We'll implement a clean, minimal header for mission-critical feel) -->
<header class="w-full h-touch-target-optimum px-mobile-edge-margin flex items-center justify-between border-b border-outline-variant/30 bg-surface z-50">
<button aria-label="Close" class="w-[44px] h-[44px] flex items-center justify-center rounded text-on-surface-variant hover:bg-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-h2 text-headline-h2 text-primary"></h1>
<div class="w-[44px]"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-mobile-edge-margin pb-24 pt-8">
<!-- Success Animation / Hex Icon -->
<div class="relative w-32 h-32 mb-8 flex items-center justify-center group animate-[pulse_3s_ease-in-out_infinite]">
<!-- Outer Hex (Glow/Container) -->
<div class="absolute inset-0 bg-[#06B6D4]/10 hex-shape scale-110 blur-sm"></div>
<!-- Inner Hex (Border) -->
<div class="absolute inset-0 bg-[#06B6D4] hex-shape opacity-20"></div>
<!-- Core Hex (Icon Container) -->
<div class="relative w-28 h-28 bg-surface-container hex-shape border-[1px] ai-cyan-border flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.3)]">
<span class="material-symbols-outlined ai-cyan-text text-5xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Typography -->
<div class="text-center mb-10 w-full">
<h1 class="font-mobile-hero text-mobile-hero text-primary mb-3 tracking-tight">Post Successful</h1>
<p class="font-mobile-body text-mobile-body text-on-surface-variant max-w-[280px] mx-auto">
                The evidence has been posted to <span class="text-primary font-medium">#site-alerts</span>
</p>
</div>
<!-- Summary Card (Bento Style / High Density) -->
<div class="w-full bg-surface-container rounded-xl border border-outline-variant p-4 flex items-center gap-4 mb-12 shadow-sm">
<!-- Thumbnail -->
<div class="w-16 h-16 rounded-lg overflow-hidden bg-surface-variant border border-outline-variant shrink-0">
<img class="w-full h-full object-cover" data-alt="A highly detailed close-up shot of a dark, industrial server rack in a dimly lit, mission-critical facility. The lighting is cool, technical, and moody, featuring sharp contrasts and subtle cybernetic blue highlights. The texture of brushed steel and complex cabling is clearly visible." src="https://lh3.googleusercontent.com/aida-public/AB6AXuATFtVGeGXrSACJ4E4YqWmc6h1prvqLqDzSbok23J2blkJw8lspKoQy9pDBUXnBOXulTQSPnsdG9mX7kul-I6wswMWW52Sj5YVggRw7TdnbieyCWesIeIa8lZB2g21XM-YMEnx32-5xo73Wa61N6FEKliIu82e3tdvYVc6Vpwt5gYSTiCyN11GTQKEH7K-NKgKqahyWzOYKZFK-Ear1wLpQQzrnTMejOVzEcs7A-H8Fu4jbbYjKDN2_aQ"/>
</div>

<span class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider mb-1">Attached Evidence</span>
<span class="font-headline-h3 text-headline-h3 text-on-surface truncate w-full">node7_rack_status.jpg</span>
<div class="flex items-center gap-1.5 mt-2">
<span class="material-symbols-outlined text-[14px] text-tertiary" style="font-variation-settings: 'FILL' 1;">tag</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">site-alerts</span>
</div>
</div>

<button class="w-full h-touch-target-optimum bg-mobile-primary text-concrete-white font-headline-h3 text-headline-h3 rounded-lg flex items-center justify-center active:bg-mobile-primary/80 transition-colors">

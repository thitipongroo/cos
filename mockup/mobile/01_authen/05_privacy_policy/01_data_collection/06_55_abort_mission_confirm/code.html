<body class="bg-background text-on-surface antialiased font-mobile-body h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface-container-highest fixed top-0 w-full z-50 border-b border-outline flex justify-between items-center px-mobile-edge-margin h-touch-target-optimum">
<button class="text-danger flex items-center justify-center w-10 h-10 transition-all duration-150 active:scale-95 hover:bg-on-surface/10 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-h2 text-headline-h2 font-black text-danger uppercase tracking-tighter">ABORT MISSION</h1>
<div class="w-10 h-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto mt-[52px] pb-[120px] px-mobile-edge-margin space-y-mobile-section-pad pt-mobile-section-pad">
<!-- Warning Section -->
<section class="bg-error-container/20 border-l-4 border-danger rounded-r-lg p-mobile-card-pad animate-pulse">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-danger text-2xl mt-1" data-icon="warning">warning</span>
<div>
<h2 class="font-headline-h3 text-headline-h3 text-danger uppercase mb-1">CRITICAL ACTION REQUIRED</h2>
<p class="font-label-tiny text-label-tiny text-on-surface-variant uppercase mb-2">MISSION #04-ALPHA</p>
<p class="font-body-sm text-body-sm text-on-surface">Abort mission immediately? This will notify all field teams and log the termination timestamp.</p>
</div>
</div>
</section>
<!-- Technical Metadata Summary -->
<section class="bg-surface-container border border-outline rounded-lg p-mobile-card-pad">
<h3 class="font-label-tiny text-label-tiny text-on-surface-variant uppercase mb-3 border-b border-outline pb-2">Status Summary</h3>
<div class="grid grid-cols-2 gap-y-4 gap-x-2">
<div>
<p class="font-label-tiny text-label-tiny text-on-surface-variant uppercase mb-1">Elapsed Time</p>
<p class="font-headline-h3 text-headline-h3 text-tertiary-fixed-dim font-mono">04:12:38</p>
</div>
<div>
<p class="font-label-tiny text-label-tiny text-on-surface-variant uppercase mb-1">Personnel Found</p>
<p class="font-headline-h3 text-headline-h3 text-warning font-mono">0 / 14</p>
</div>
<div class="col-span-2">
<p class="font-label-tiny text-label-tiny text-on-surface-variant uppercase mb-1">Team Status</p>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-success"></span>
<span class="font-body-sm text-body-sm text-on-surface">3 Units Active - Sector 7G</span>
</div>
</div>
</div>
</section>
<!-- Reason Input -->
<section class="space-y-2">
<label class="block font-label-tiny text-label-tiny text-on-surface-variant uppercase" for="abort-reason">Reason for Abort *</label>
<div class="relative">
<textarea class="w-full bg-surface text-on-surface border border-outline rounded-lg p-3 font-body-sm text-body-sm focus:ring-2 focus:ring-tertiary-fixed-dim focus:border-tertiary-fixed-dim outline-none transition-all placeholder:text-on-surface-variant/50" id="abort-reason" placeholder="E.g., Target Secured, Unsafe Conditions, Equipment Failure..." rows="4"></textarea>
<div class="absolute bottom-2 right-2 flex items-center justify-center">
<span class="material-symbols-outlined text-outline text-sm" data-icon="edit">edit</span>
</div>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<footer class="fixed bottom-0 w-full bg-surface-container-highest border-t border-outline px-mobile-edge-margin py-mobile-card-pad pb-[calc(12px+env(safe-area-inset-bottom))] flex flex-col gap-3 z-50">
<button class="w-full bg-danger text-concrete-white h-touch-target-optimum rounded-lg font-headline-h3 text-headline-h3 uppercase tracking-wider flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-[0_0_15px_rgba(239,68,68,0.3)]">
<span class="material-symbols-outlined" data-icon="cancel">cancel</span>
            CONFIRM MISSION ABORT
        </button>
<button class="w-full bg-surface border border-outline text-on-surface h-touch-target-optimum rounded-lg font-headline-h3 text-headline-h3 uppercase tracking-wider transition-transform active:scale-95 hover:bg-surface-bright">
            RESUME MISSION
        </button>
</footer>

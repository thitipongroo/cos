<style>

            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;

<body class="min-h-screen w-full flex flex-col items-center justify-center relative overflow-hidden bg-primary-container">
<!-- Background Design Element -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-10 flex items-center justify-center">
<div class="w-96 h-96 rounded-full bg-success blur-[120px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-mobile-edge-margin flex flex-col items-center justify-center z-10 space-y-12 h-full">
<!-- Success Icon Section -->
<div class="flex flex-col items-center gap-6">

<span class="material-symbols-outlined text-success" style="font-size: 48px; font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="text-center space-y-2">
<h1 class="font-mobile-hero text-mobile-hero text-concrete-white">Export Complete</h1>
<p class="font-mobile-body text-mobile-body text-on-surface-variant">Your report has been successfully generated and is ready to view.</p>
</div>
</div>
<!-- File Metadata Card -->
<div class="w-full bg-surface-container rounded-xl border border-outline-variant p-mobile-card-pad flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center border border-outline-variant flex-shrink-0">
<span class="material-symbols-outlined text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1;">picture_as_pdf</span>
</div>
<div class="flex-1 min-w-0">
<h3 class="font-headline-h3 text-headline-h3 text-concrete-white truncate">Site_Inspection_Report_Q3.pdf</h3>
<div class="flex items-center gap-2 mt-1">
<span class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">PDF</span>

<span class="font-body-sm text-body-sm text-on-surface-variant">2.4 MB</span>
</div>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">cloud_done</span>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-4 pt-8">
<button class="w-full h-touch-target-optimum bg-mobile-primary hover:bg-secondary-container active:scale-95 transition-all duration-200 rounded-lg flex items-center justify-center gap-2 font-headline-h3 text-headline-h3 text-concrete-white border border-mobile-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">open_in_new</span>
                Open PDF
            </button>
<button class="w-full h-touch-target-optimum bg-surface-container hover:bg-surface-bright active:scale-95 transition-all duration-200 rounded-lg flex items-center justify-center font-headline-h3 text-headline-h3 text-concrete-white border border-outline-variant">
                Done
            </button>

</main>
<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                // Prevent default form submission if any
                e.preventDefault();
                
                // Add a quick visual ripple or feedback
                const originalBg = this.style.backgroundColor;
                this.style.opacity = '0.7';
                setTimeout(() => {
                    this.style.opacity = '1';
                }, 150);
                
                // If it's the "Done" button, we could simulate closing the view
                if(this.textContent.trim() === 'Done') {
                    console.log('Closing success view...');
                    // In a real app, this would route back
                }
            });
        });
    </script>

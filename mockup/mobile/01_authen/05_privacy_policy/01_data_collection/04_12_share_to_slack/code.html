<script>
        // Simple micro-interaction for the channel selector modal
        const channelBtn = document.getElementById('channel-selector-btn');
        const modal = document.getElementById('channel-modal');
        const modalContent = document.getElementById('channel-modal-content');
        const closeBtn = document.getElementById('close-modal-btn');

        channelBtn.addEventListener('click', () => {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // Small delay to allow display change before animating transform
            setTimeout(() => {
                modalContent.classList.remove('translate-y-full');
            }, 10);
        });

        function closeModal() {
            modalContent.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300); // match duration-300
        }

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });
    </script>

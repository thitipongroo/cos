<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Broadcast History Logs</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#4cd7f6",
                        "on-error": "#690005",
                        "success": "#10B981",
                        "mobile-primary": "#0066FF",
                        "secondary-fixed-dim": "#b4c5ff",
                        "on-secondary-container": "#cdd7ff",
                        "primary": "#c1c5dc",
                        "surface-container-low": "#0b1c30",
                        "offline": "#8E8E93",
                        "outline-variant": "#46464c",
                        "surface-bright": "#2a3a4f",
                        "surface-tint": "#c1c5dc",
                        "error-container": "#93000a",
                        "surface-dim": "#031427",
                        "on-secondary": "#002a78",
                        "background": "#031427",
                        "on-primary-fixed": "#161b2b",
                        "on-primary-fixed-variant": "#414658",
                        "concrete-white": "#F8FAFC",
                        "secondary": "#b4c5ff",
                        "outline": "#909097",
                        "on-surface-variant": "#c7c6cd",
                        "warning": "#F59E0B",
                        "surface": "#031427",
                        "syncing": "#FFD60A",
                        "primary-fixed-dim": "#c1c5dc",
                        "tertiary-container": "#001318",
                        "error": "#ffb4ab",
                        "on-surface": "#d3e4fe",
                        "primary-container": "#0b1020",
                        "danger": "#EF4444",
                        "surface-variant": "#26364a",
                        "on-tertiary-fixed": "#001f26",
                        "surface-container": "#102034",
                        "inverse-on-surface": "#213145",
                        "tertiary": "#4cd7f6",
                        "on-background": "#d3e4fe",
                        "secondary-container": "#0053db",
                        "inverse-primary": "#595e71",
                        "on-tertiary-container": "#0088a0",
                        "on-secondary-fixed-variant": "#003ea8",
                        "inverse-surface": "#d3e4fe",
                        "secondary-fixed": "#dbe1ff",
                        "on-secondary-fixed": "#00174b",
                        "on-tertiary": "#003640",
                        "on-primary": "#2b3041",
                        "tertiary-fixed": "#acedff",
                        "on-primary-container": "#777c90",
                        "primary-fixed": "#dee1f9",
                        "surface-container-high": "#1b2b3f",
                        "on-tertiary-fixed-variant": "#004e5c",
                        "on-error-container": "#ffdad6",
                        "surface-container-lowest": "#000f21",
                        "surface-container-highest": "#26364a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "web-base": "4px",
                        "mobile-icon-pad": "8px",
                        "web-page-gap": "64px",
                        "mobile-edge-margin": "24px",
                        "web-margin-component": "32px",
                        "web-gap-tight": "4px",
                        "touch-target-min": "44px",
                        "mobile-section-pad": "16px",
                        "web-padding-card": "16px",
                        "touch-target-optimum": "52px",
                        "mobile-card-pad": "12px",
                        "mobile-base": "8px"
                    },
                    "fontFamily": {
                        "mobile-hero": ["Inter"],
                        "mobile-title": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-h2": ["Inter"],
                        "headline-h1": ["Inter"],
                        "label-tiny": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "mobile-body": ["Inter"],
                        "headline-h3": ["Inter"]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .font-mobile-hero { font-family: 'Inter', sans-serif; font-size: 28px; line-height: 1.2; font-weight: 700; }
            .font-mobile-title { font-family: 'Inter', sans-serif; font-size: 22px; line-height: 1.3; font-weight: 600; }
            .font-body-md { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.6; font-weight: 400; }
            .font-headline-h2 { font-family: 'Inter', sans-serif; font-size: 20px; line-height: 1.3; font-weight: 600; }
            .font-headline-h1 { font-family: 'Inter', sans-serif; font-size: 24px; line-height: 1.3; font-weight: 600; }
            .font-label-tiny { font-family: 'Inter', sans-serif; font-size: 11px; line-height: 1; letter-spacing: 0.05em; font-weight: 600; }
            .font-body-sm { font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.5; font-weight: 400; }
            .font-headline-h3 { font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.3; font-weight: 500; }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-[52px]">
<!-- TopAppBar -->
<header class="bg-surface-dim dark:bg-surface-dim docked full-width top-0 border-b border-outline-variant flat no shadows sticky z-40">
<div class="flex justify-between items-center w-full px-mobile-edge-margin h-touch-target-optimum">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-variant/50 active:scale-95 transition-transform p-mobile-icon-pad rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-h2 text-headline-h2 text-on-surface">Emergency Broadcasts</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-variant/50 active:scale-95 transition-transform p-mobile-icon-pad rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">sync</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="px-mobile-edge-margin py-mobile-section-pad flex flex-col gap-mobile-section-pad">
<!-- Search & Filter Row -->
<div class="flex gap-mobile-base items-center w-full">
<div class="flex-grow relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-DEFAULT h-touch-target-min pl-10 pr-4 text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-tertiary-fixed-dim focus:border-transparent transition-all placeholder:text-on-surface-variant/50" placeholder="Search logs..." type="text">
</div>
<button class="h-touch-target-min w-touch-target-min bg-surface-container border border-outline-variant rounded-DEFAULT flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors active:scale-95 shrink-0">
<span class="material-symbols-outlined">filter_list</span>
</button>
</div>
<!-- Logs List -->
<div class="flex flex-col gap-mobile-base">
<!-- Log Card 1: EVACUATE (Red/Danger) -->
<button class="w-full text-left bg-surface-container-high border border-outline-variant rounded-lg p-mobile-card-pad flex flex-col gap-mobile-base hover:bg-surface-bright active:bg-surface-bright transition-all active:scale-[0.98] group relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-danger"></div>
<div class="flex justify-between items-start pl-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-danger text-[20px]" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-headline-h3 text-danger tracking-wide">EVACUATE</span>
</div>
<div class="flex items-center gap-2">
<span class="font-label-tiny text-on-surface-variant uppercase">2023-10-27 15:20 UTC</span>
<span class="material-symbols-outlined text-on-surface-variant/50">chevron_right</span>
</div>
</div>
<div class="pl-2 flex flex-col gap-1">
<p class="font-body-md text-on-surface">Target: <span class="font-medium text-concrete-white">ZONE 04: NORTH SECTOR</span></p>
<div class="flex justify-between items-end mt-2">
<div class="flex flex-col gap-1">
<span class="font-label-tiny text-on-surface-variant">DELIVERY</span>
<span class="font-body-sm text-tertiary-fixed-dim flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">smartphone</span> 4.8k App Push Sent</span>
</div>
<div class="bg-success/20 border border-success/50 px-2 py-1 rounded-full flex items-center gap-1 active:scale-95 hover:bg-success/30 transition-all cursor-pointer shadows">
<span class="font-label-tiny text-success">SUCCESS</span>
<span class="material-symbols-outlined text-success text-[14px]">chevron_right</span>
</div>
</div>
</div>
</button>
<!-- Log Card 2: STOP WORK (Yellow/Warning) -->
<button class="w-full text-left bg-surface-container-high border border-outline-variant rounded-lg p-mobile-card-pad flex flex-col gap-mobile-base hover:bg-surface-bright active:bg-surface-bright transition-all active:scale-[0.98] group relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-warning"></div>
<div class="flex justify-between items-start pl-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-warning text-[20px]" style="font-variation-settings: 'FILL' 1;">pan_tool</span>
<span class="font-headline-h3 text-warning tracking-wide">STOP WORK</span>
</div>
<div class="flex items-center gap-2">
<span class="font-label-tiny text-on-surface-variant uppercase">2023-10-27 14:05 UTC</span>
<span class="material-symbols-outlined text-on-surface-variant/50">chevron_right</span>
</div>
</div>
<div class="pl-2 flex flex-col gap-1">
<p class="font-body-md text-on-surface">Target: <span class="font-medium text-concrete-white">ALL ACTIVE ZONES</span></p>
<div class="flex justify-between items-end mt-2">
<div class="flex flex-col gap-1">
<span class="font-label-tiny text-on-surface-variant">DELIVERY</span>
<span class="font-body-sm text-tertiary-fixed-dim flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">smartphone</span> 12.2k App Push Sent</span>
</div>
<div class="bg-warning/20 border border-warning/50 px-2 py-1 rounded-full flex items-center gap-1 active:scale-95 hover:bg-warning/30 transition-all cursor-pointer shadows">
<span class="font-label-tiny text-warning">PARTIAL</span>
<span class="material-symbols-outlined text-warning text-[14px]">chevron_right</span>
</div>
</div>
</div>
</button>
<!-- Log Card 3: STAY PUT (Blue/Primary) -->
<button class="w-full text-left bg-surface-container-high border border-outline-variant rounded-lg p-mobile-card-pad flex flex-col gap-mobile-base hover:bg-surface-bright active:bg-surface-bright transition-all active:scale-[0.98] group relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-mobile-primary"></div>
<div class="flex justify-between items-start pl-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-mobile-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">gite</span>
<span class="font-headline-h3 text-mobile-primary tracking-wide">STAY PUT</span>
</div>
<div class="flex items-center gap-2">
<span class="font-label-tiny text-on-surface-variant uppercase">2023-10-26 09:12 UTC</span>
<span class="material-symbols-outlined text-on-surface-variant/50">chevron_right</span>
</div>
</div>
<div class="pl-2 flex flex-col gap-1">
<p class="font-body-md text-on-surface">Target: <span class="font-medium text-concrete-white">ZONE 02: EAST WING</span></p>
<div class="flex justify-between items-end mt-2">
<div class="flex flex-col gap-1">
<span class="font-label-tiny text-on-surface-variant">DELIVERY</span>
<span class="font-body-sm text-tertiary-fixed-dim flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">smartphone</span> 1.1k App Push Sent</span>
</div>
<div class="bg-success/20 border border-success/50 px-2 py-1 rounded-full flex items-center gap-1 active:scale-95 hover:bg-success/30 transition-all cursor-pointer shadows">
<span class="font-label-tiny text-success">SUCCESS</span>
<span class="material-symbols-outlined text-success text-[14px]">chevron_right</span>
</div>
</div>
</div>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-touch-target-optimum bg-surface-container border-t border-outline-variant rounded-t-xl pb-safe">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-bright active:scale-90 transition-all duration-150 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined text-[24px]">group</span>
<span class="font-label-tiny mt-1">Roll Call</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-bright active:scale-90 transition-all duration-150 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined text-[24px]">map</span>
<span class="font-label-tiny mt-1">Map</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-bright active:scale-90 transition-all duration-150 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined text-[24px]">emergency_share</span>
<span class="font-label-tiny mt-1">Rescue</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 active:scale-90 transition-all duration-150" href="#">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="font-label-tiny mt-1">Logs</span>
</a>
</nav>
<style>
        /* Fallback safe area padding for modern mobile browsers */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>


</body></html>

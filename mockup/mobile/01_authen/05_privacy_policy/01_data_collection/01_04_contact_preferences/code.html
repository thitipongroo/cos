<script>
        // Simple script to handle visual toggle state for checkboxes (Tailwind peer works too, but this ensures robustness across browsers for custom toggle positioning if needed)
        document.querySelectorAll('.toggle-checkbox:not(:disabled)').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                if(this.checked) {
                    this.style.left = '100%';
                    this.style.transform = 'translate(-100%, -50%)';
                } else {
                    this.style.left = '0';
                    this.style.transform = 'translate(0, -50%)';
                }
            });
            
            // Init state
            if(checkbox.checked) {
                checkbox.style.left = '100%';
                checkbox.style.transform = 'translate(-100%, -50%)';
            }
        });
    </script>

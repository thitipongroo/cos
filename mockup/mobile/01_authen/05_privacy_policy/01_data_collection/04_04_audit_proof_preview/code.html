<body class="bg-background text-on-background min-h-screen flex flex-col font-mobile-body antialiased selection:bg-tertiary-fixed-dim selection:text-on-tertiary-fixed">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-container-highest dark:bg-surface-container-highest border-b border-outline-variant dark:border-outline-variant flex items-center justify-between px-mobile-edge-margin h-touch-target-optimum">
<button aria-label="Go back" class="text-primary dark:text-primary hover:bg-surface-bright dark:hover:bg-surface-bright active:scale-95 transition-transform flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-mobile-title text-mobile-title font-bold text-on-surface dark:text-on-surface">Log Options</h1>
<button aria-label="Sync status" class="text-primary dark:text-primary hover:bg-surface-bright dark:hover:bg-surface-bright active:scale-95 transition-transform flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
</button>
</header>
<!-- Main Content Canvas -->
<!-- Added pt-[52px] to account for TopAppBar and pb-[80px] to ensure content is above the fixed bottom button -->
<main class="flex-1 overflow-y-auto pt-[52px] pb-[100px] px-mobile-edge-margin flex flex-col gap-mobile-section-pad mt-mobile-section-pad">
<!-- PDF Preview Window -->
<div class="relative w-full aspect-[1/1.4] bg-surface-container-low border border-outline rounded-lg overflow-hidden flex flex-col shadow-lg">
<!-- Mock PDF Toolbar -->
<div class="h-10 bg-surface-container flex items-center justify-between px-mobile-card-pad border-b border-outline-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-sm">picture_as_pdf</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate w-32">Audit_Log_OCT24.pdf</span>
</div>
<div class="flex items-center gap-mobile-base">
<span class="material-symbols-outlined text-on-surface-variant text-sm cursor-pointer hover:text-on-surface transition-colors">zoom_in</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm cursor-pointer hover:text-on-surface transition-colors">zoom_out</span>
</div>
</div>
<!-- Mock PDF Content Area -->
<div class="flex-1 bg-concrete-white p-4 overflow-hidden relative">
<!-- Watermark -->
<div class="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none">
<span class="font-display-lg text-display-lg text-background -rotate-45 font-bold uppercase tracking-widest whitespace-nowrap">Confidential</span>
</div>
<!-- Mock Document Structure -->
<div class="space-y-4">
<div class="flex justify-between items-start border-b border-gray-300 pb-2">
<div class="w-16 h-4 bg-gray-300 rounded"></div>
<div class="w-24 h-4 bg-gray-200 rounded"></div>
</div>
<div class="w-3/4 h-6 bg-gray-400 rounded"></div>
<div class="space-y-2">
<div class="w-full h-2 bg-gray-200 rounded"></div>
<div class="w-full h-2 bg-gray-200 rounded"></div>
<div class="w-5/6 h-2 bg-gray-200 rounded"></div>
</div>
<div class="mt-6 border border-gray-200 rounded-sm">
<div class="grid grid-cols-3 bg-gray-100 p-2 border-b border-gray-200">
<div class="h-2 bg-gray-300 rounded w-1/2"></div>
<div class="h-2 bg-gray-300 rounded w-1/2"></div>
<div class="h-2 bg-gray-300 rounded w-1/2"></div>
</div>
<div class="grid grid-cols-3 p-2 border-b border-gray-100">
<div class="h-2 bg-gray-200 rounded w-3/4"></div>
<div class="h-2 bg-gray-200 rounded w-1/4"></div>
<div class="h-2 bg-gray-200 rounded w-1/2"></div>
</div>
<div class="grid grid-cols-3 p-2">
<div class="h-2 bg-gray-200 rounded w-2/3"></div>
<div class="h-2 bg-gray-200 rounded w-1/3"></div>
<div class="h-2 bg-gray-200 rounded w-1/4"></div>
</div>
</div>
<div class="pt-4 flex items-center gap-2">
<div class="w-4 h-4 rounded-full bg-success"></div>
<div class="w-20 h-2 bg-gray-300 rounded"></div>
</div>
</div>
</div>
<!-- Scan line effect for tech feel -->
<div class="absolute inset-0 pointer-events-none overflow-hidden opacity-20 mix-blend-overlay">
<div class="w-full h-1 bg-tertiary shadow-[0_0_8px_rgba(76,215,246,0.8)] animate-[scan_4s_ease-in-out_infinite]"></div>
</div>
</div>
<!-- Audit Details Card -->
<div class="bg-surface p-mobile-card-pad rounded-lg border border-outline-variant flex flex-col gap-mobile-base">
<div class="flex items-center justify-between border-b border-outline-variant pb-mobile-base">
<span class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">Log ID</span>
<span class="font-mobile-body text-mobile-body font-mono text-on-surface">AUD-2024-8842-X</span>
</div>
<div class="flex items-center justify-between border-b border-outline-variant pb-mobile-base">
<span class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">Generated Date</span>
<span class="font-mobile-body text-mobile-body text-on-surface">Oct 24, 2024 - 14:32 PST</span>
</div>
<div class="flex items-center justify-between pt-mobile-base">
<span class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">Integrity Status</span>
<div class="flex items-center gap-1.5 bg-success/10 border border-success/30 px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-success text-[14px]" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-tiny text-label-tiny text-success uppercase font-bold tracking-widest">Verified</span>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-mobile-edge-margin bg-background/90 backdrop-blur-md border-t border-outline-variant z-40 pb-[calc(24px+env(safe-area-inset-bottom))]">
<button class="w-full h-touch-target-optimum bg-mobile-primary hover:bg-mobile-primary/90 active:scale-[0.98] transition-all rounded-lg flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(0,102,255,0.2)]">
<span class="material-symbols-outlined text-concrete-white" data-icon="file_download">file_download</span>
<span class="font-mobile-title text-[18px] text-concrete-white font-semibold">Confirm &amp; Export</span>
</button>
</div>
<!-- Suppress Bottom Navigation Bar on Transactional Screen -->
<!-- The prompt implies a focused task ("Confirm & Export"), so the main nav shell is hidden to prioritize the canvas as per rules. -->
<style>
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1400%); } /* Approximate height multiplier */
        }
    </style>

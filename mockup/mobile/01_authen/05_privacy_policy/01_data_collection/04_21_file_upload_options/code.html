<body class="bg-background text-on-background font-body-md antialiased min-h-screen relative selection:bg-mobile-primary selection:text-white">
<!-- Note: TopAppBar and BottomNavBar are suppressed per rules as this is a transactional overlay screen -->
<!-- Overlay Background (simulating a modal/sheet over a darker interface) -->
<div class="fixed inset-0 bg-surface-container flex flex-col justify-end z-50">
<!-- Sheet Handle (Visual cue for pull-down, though functional as full screen here) -->
<div class="w-full flex justify-center py-4">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Sheet Content -->
<div class="flex flex-col flex-1 px-mobile-edge-margin pb-safe">
<div class="mb-8 mt-2">
<h2 class="font-headline-h1 text-headline-h1 text-on-surface">Upload File</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Select an upload method</p>
</div>
<!-- Action Cards -->
<div class="flex flex-col gap-4 flex-1">
<!-- Card 1: Take Photo/Video -->
<button class="w-full bg-surface-container-high border border-outline-variant rounded-xl p-mobile-section-pad flex items-center gap-6 active:scale-95 transition-transform duration-150 hover:bg-surface-container-highest touch-manipulation group text-left">
<div class="w-16 h-16 rounded-lg bg-surface flex items-center justify-center border border-outline-variant group-hover:border-mobile-primary transition-colors">
<span class="material-symbols-outlined text-mobile-primary text-3xl" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<div>
<span class="block font-mobile-title text-mobile-title text-on-surface">Take Photo/Video</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant mt-0.5">Capture directly from camera</span>
</div>
</button>
<!-- Card 2: Upload Document -->
<button class="w-full bg-surface-container-high border border-outline-variant rounded-xl p-mobile-section-pad flex items-center gap-6 active:scale-95 transition-transform duration-150 hover:bg-surface-container-highest touch-manipulation group text-left">
<div class="w-16 h-16 rounded-lg bg-surface flex items-center justify-center border border-outline-variant group-hover:border-mobile-primary transition-colors">
<span class="material-symbols-outlined text-mobile-primary text-3xl" style="font-variation-settings: 'FILL' 1;">folder_open</span>
</div>
<div>
<span class="block font-mobile-title text-mobile-title text-on-surface">Upload Document</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant mt-0.5">Browse device files</span>
</div>
</button>
<!-- Card 3: Scan Document (AI Enabled) -->
<button class="w-full bg-surface-container-high border border-outline-variant rounded-xl p-mobile-section-pad flex items-center gap-6 active:scale-95 transition-transform duration-150 hover:bg-surface-container-highest touch-manipulation group text-left relative overflow-hidden">
<!-- Subtle AI Cyan glow indication -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-tertiary"></div>
<div class="w-16 h-16 rounded-lg bg-surface flex items-center justify-center border border-outline-variant group-hover:border-tertiary transition-colors">
<span class="material-symbols-outlined text-tertiary text-3xl" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
</div>
<div>
<div class="flex items-center gap-2">
<span class="block font-mobile-title text-mobile-title text-on-surface">Scan Document</span>
<span class="bg-tertiary/20 text-tertiary font-label-tiny text-label-tiny px-2 py-0.5 rounded-full uppercase tracking-wider border border-tertiary/30">Auto OCR</span>
</div>
<span class="block font-body-sm text-body-sm text-on-surface-variant mt-0.5">Extract text automatically</span>
</div>
</button>
</div>

<div class="pt-8 pb-8">
<button class="w-full h-touch-target-optimum bg-surface-variant border border-outline-variant text-on-surface font-headline-h3 text-headline-h3 rounded-lg active:scale-95 transition-transform duration-150 flex items-center justify-center shadow-lg">

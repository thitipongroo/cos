<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Document Capture</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #46464c;
            border-radius: 2px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#acedff",
                        "on-secondary": "#002a78",
                        "on-background": "#d3e4fe",
                        "surface-container": "#102034",
                        "surface-bright": "#2a3a4f",
                        "primary": "#c1c5dc",
                        "secondary-container": "#0053db",
                        "surface-container-high": "#1b2b3f",
                        "tertiary": "#4cd7f6",
                        "surface-variant": "#26364a",
                        "tertiary-container": "#001318",
                        "inverse-primary": "#595e71",
                        "on-primary-container": "#777c90",
                        "error-container": "#93000a",
                        "background": "#031427",
                        "secondary-fixed": "#dbe1ff",
                        "on-primary-fixed": "#161b2b",
                        "success": "#10B981",
                        "inverse-on-surface": "#213145",
                        "inverse-surface": "#d3e4fe",
                        "warning": "#F59E0B",
                        "on-primary": "#2b3041",
                        "concrete-white": "#F8FAFC",
                        "primary-fixed-dim": "#c1c5dc",
                        "surface-container-highest": "#26364a",
                        "syncing": "#FFD60A",
                        "mobile-primary": "#0066FF",
                        "danger": "#EF4444",
                        "primary-fixed": "#dee1f9",
                        "on-tertiary": "#003640",
                        "secondary": "#b4c5ff",
                        "surface-container-low": "#0b1c30",
                        "surface-container-lowest": "#000f21",
                        "on-tertiary-fixed": "#001f26",
                        "on-secondary-container": "#cdd7ff",
                        "offline": "#8E8E93",
                        "surface-dim": "#031427",
                        "surface-tint": "#c1c5dc",
                        "error": "#ffb4ab",
                        "on-surface-variant": "#c7c6cd",
                        "on-surface": "#d3e4fe",
                        "secondary-fixed-dim": "#b4c5ff",
                        "surface": "#031427",
                        "outline": "#909097",
                        "tertiary-fixed-dim": "#4cd7f6",
                        "on-secondary-fixed": "#00174b",
                        "on-error-container": "#ffdad6",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#414658",
                        "on-tertiary-fixed-variant": "#004e5c",
                        "on-tertiary-container": "#0088a0",
                        "primary-container": "#0b1020",
                        "on-secondary-fixed-variant": "#003ea8",
                        "outline-variant": "#46464c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "touch-target-min": "44px",
                        "mobile-card-pad": "12px",
                        "mobile-base": "8px",
                        "mobile-section-pad": "16px",
                        "web-gap-tight": "4px",
                        "mobile-icon-pad": "8px",
                        "web-page-gap": "64px",
                        "web-base": "4px",
                        "touch-target-optimum": "52px",
                        "mobile-edge-margin": "24px",
                        "web-padding-card": "16px",
                        "web-margin-component": "32px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "mobile-hero": ["Inter"],
                        "mobile-title": ["Inter"],
                        "headline-h1": ["Inter"],
                        "body-md": ["Inter"],
                        "mobile-body": ["Inter"],
                        "headline-h3": ["Inter"],
                        "headline-h2": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-tiny": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "mobile-hero": ["28px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "mobile-title": ["22px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-h1": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "mobile-body": ["17px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-h3": ["16px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "headline-h2": ["20px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-sm": ["12px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-tiny": ["11px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md antialiased overflow-hidden flex flex-col h-screen select-none">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface fixed top-0 w-full z-50 border-b border-outline-variant dark:border-outline-variant transition-colors duration-200 flex justify-between items-center px-mobile-edge-margin h-touch-target-optimum">
<button aria-label="Go back" class="w-touch-target-min h-touch-target-min flex items-center justify-start text-primary dark:text-primary active:opacity-70">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-mobile-title text-mobile-title font-bold text-primary dark:text-primary truncate px-2">Document Capture</h1>
<button aria-label="Sync status" class="w-touch-target-min h-touch-target-min flex items-center justify-end text-primary dark:text-primary active:opacity-70">
<span class="material-symbols-outlined text-syncing" data-icon="sync">sync</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto mt-[52px] pb-[160px] relative w-full max-w-md mx-auto">
<!-- Document Preview Section -->
<div class="relative w-full aspect-[3/4] bg-surface-container-high border-b border-outline-variant overflow-hidden">
<!-- Scanned Document Image Placeholder -->
<img class="w-full h-full object-cover opacity-80" data-alt="A highly detailed, perspective-corrected scan of a construction delivery receipt. The document is crisp, high-contrast, black text on white paper, showing part numbers, quantities, and a signature block. The lighting is even, resembling a high-quality scanner output. The image fits within a mission-critical, dark-themed industrial UI. The document appears slightly weathered, typical of a busy construction site environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCP-KfdIeRrDm8qaeWVTpmmryHJCuV0iMj208V40nofC3XsFjGhTvK121_6ibKXS-ZAdrZ8D7TvyL9Xw8cQLZlYQsC9SiSltpAFH3qkpzie18v7I1uYVjenAZNR9qFAmuVVDTAsqdwG3vCqIolMDC0xFaUs3GVwUlVVry8o0qvmoZ_VihZLBhQCQGzlUaxvYBkpCNPHGU655wCMvTUB-3hk3I_uMWydjZEu7cbRCWzPMv-WlDufypd7fg"/>
<!-- OCR Highlights Overlay -->
<div class="absolute top-[15%] left-[20%] w-[30%] h-[5%] bg-tertiary/30 border border-tertiary shadow-[0_0_8px_rgba(76,215,246,0.5)] rounded-sm pointer-events-none pulse-border"></div>
<div class="absolute top-[22%] left-[10%] w-[40%] h-[4%] bg-tertiary/30 border border-tertiary shadow-[0_0_8px_rgba(76,215,246,0.5)] rounded-sm pointer-events-none pulse-border" style="animation-delay: 0.2s;"></div>
<div class="absolute top-[45%] right-[15%] w-[25%] h-[6%] bg-tertiary/30 border border-tertiary shadow-[0_0_8px_rgba(76,215,246,0.5)] rounded-sm pointer-events-none pulse-border" style="animation-delay: 0.4s;"></div>
<div class="absolute bottom-[10%] left-[20%] w-[20%] h-[4%] bg-tertiary/30 border border-tertiary shadow-[0_0_8px_rgba(76,215,246,0.5)] rounded-sm pointer-events-none pulse-border" style="animation-delay: 0.6s;"></div>
<!-- Scanning Overlay Grid (Atmospheric) -->
<div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff0a_1px,transparent_1px),linear-gradient(to_bottom,#ffffff0a_1px,transparent_1px)] bg-[size:16px_16px] pointer-events-none opacity-50"></div>
</div>
<!-- Data Validation Section -->
<div class="p-mobile-edge-margin flex flex-col gap-mobile-section-pad">
<div class="flex items-center justify-between mb-2">
<h2 class="font-headline-h3 text-headline-h3 text-on-surface">Extracted Data</h2>
<div class="flex items-center gap-1 text-success bg-success/10 px-2 py-1 rounded border border-success/20">
<span class="material-symbols-outlined fill text-[14px]" data-icon="check_circle">check_circle</span>
<span class="font-label-tiny text-label-tiny uppercase">AI Verified</span>
</div>
</div>
<!-- Form Field: Document Type -->
<div class="flex flex-col gap-web-gap-tight">
<label class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider">Document Type</label>
<div class="relative w-full h-touch-target-optimum bg-surface-container border border-tertiary rounded flex items-center px-4 focus-within:ring-2 focus-within:ring-tertiary focus-within:border-transparent transition-all shadow-[0_0_0_1px_rgba(76,215,246,0.2)]">
<span class="material-symbols-outlined text-tertiary mr-3" data-icon="auto_awesome">auto_awesome</span>
<select class="w-full h-full bg-transparent text-on-surface font-mobile-body border-none focus:ring-0 appearance-none outline-none">
<option selected="" value="delivery">Delivery Note</option>
<option value="safety">Safety Report</option>
<option value="invoice">Invoice</option>
<option value="other">Other</option>
</select>
<span class="material-symbols-outlined text-outline-variant absolute right-4 pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Form Field: Ref No. -->
<div class="flex flex-col gap-web-gap-tight">
<div class="flex justify-between items-end">
<label class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider">Ref No.</label>
<span class="material-symbols-outlined text-success text-[16px]" data-icon="check">check</span>
</div>
<div class="relative w-full h-touch-target-optimum bg-surface-container border border-outline rounded flex items-center px-4 focus-within:ring-2 focus-within:ring-tertiary focus-within:border-transparent transition-all">
<input class="w-full h-full bg-transparent text-on-surface font-mobile-body border-none focus:ring-0 outline-none" type="text" value="DN-2023-8842-A"/>
</div>
</div>
<!-- Form Field: Total Amount -->
<div class="flex flex-col gap-web-gap-tight">
<div class="flex justify-between items-end">
<label class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider">Total Amount</label>
<span class="material-symbols-outlined text-warning text-[16px]" data-icon="warning">warning</span>
</div>
<div class="relative w-full h-touch-target-optimum bg-surface-container border border-outline rounded flex items-center px-4 focus-within:ring-2 focus-within:ring-tertiary focus-within:border-transparent transition-all">
<span class="text-on-surface-variant mr-2">$</span>
<input class="w-full h-full bg-transparent text-on-surface font-mobile-body border-none focus:ring-0 outline-none" type="text" value="4,250.00"/>
</div>
<span class="font-body-sm text-body-sm text-warning mt-1">Low confidence. Please verify.</span>
</div>
<!-- Form Field: Date -->
<div class="flex flex-col gap-web-gap-tight">
<div class="flex justify-between items-end">
<label class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider">Date</label>
<span class="material-symbols-outlined text-success text-[16px]" data-icon="check">check</span>
</div>
<div class="relative w-full h-touch-target-optimum bg-surface-container border border-outline rounded flex items-center px-4 focus-within:ring-2 focus-within:ring-tertiary focus-within:border-transparent transition-all">
<input class="w-full h-full bg-transparent text-on-surface font-mobile-body border-none focus:ring-0 outline-none block" type="date" value="2023-10-27"/>
</div>
</div>
</div>
</main>
<!-- Fixed Action Bottom Bar (Replaces BottomNavBar for linear task) -->
<div class="fixed bottom-0 w-full bg-surface-container-high border-t border-outline-variant px-mobile-edge-margin py-mobile-section-pad pb-[calc(16px+env(safe-area-inset-bottom))] z-50 max-w-md left-1/2 -translate-x-1/2 flex gap-4">
<button class="flex-1 h-touch-target-optimum border border-outline text-on-surface rounded font-headline-h3 text-headline-h3 flex justify-center items-center active:bg-surface-variant transition-colors">
            Retake
        </button>
<button class="flex-[2] h-touch-target-optimum bg-mobile-primary text-concrete-white rounded font-headline-h3 text-headline-h3 flex justify-center items-center shadow-lg active:opacity-80 transition-opacity">
            Confirm & Upload
        </button>
</div>
<style>
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(76, 215, 246, 0.4); box-shadow: 0 0 8px rgba(76, 215, 246, 0.2); }
            50% { border-color: rgba(76, 215, 246, 1); box-shadow: 0 0 12px rgba(76, 215, 246, 0.6); }
        }
        .pulse-border {
            animation: pulse-border 2s infinite ease-in-out;
        }
        /* Style date input calendar icon */
        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.5;
            cursor: pointer;
        }
    </style>
</body></html>

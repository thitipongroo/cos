<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
        }
        
        .hardware-accelerated {
            transform: translateZ(0);
            will-change: transform;
        }

        /* Custom scrollbar for textareas */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.surface-container');
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.outline-variant');
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased bg-background text-on-surface overflow-x-hidden min-h-screen flex flex-col pt-[52px] pb-[84px] md:hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-container-highest border-b border-outline flex justify-between items-center px-mobile-edge-margin h-touch-target-optimum">
<button class="text-on-surface-variant hover:bg-on-surface/10 transition-all duration-150 active:scale-95 flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-h2 text-headline-h2 font-black text-on-surface uppercase tracking-tighter">
            SEND SITREP
        </div>
<button class="text-mobile-primary font-bold hover:bg-on-surface/10 transition-all duration-150 active:scale-95 flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full">
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-mobile-edge-margin py-mobile-section-pad gap-mobile-section-pad">
<!-- Metadata Header -->
<div class="flex justify-between items-center border-b border-outline-variant pb-mobile-base">
<div class="flex items-center gap-2 text-syncing">
<span class="material-symbols-outlined text-[16px] animate-pulse">satellite_alt</span>
<span class="font-label-tiny text-label-tiny uppercase">Syncing Uplink</span>
</div>
<div class="font-label-tiny text-label-tiny text-on-surface-variant uppercase">
                T+02:14:00
            </div>
</div>
<!-- Personnel Status Card -->
<section class="bg-surface-container rounded-xl p-mobile-card-pad border border-outline-variant shadow-sm flex flex-col gap-4">
<div class="flex justify-between items-center">
<h3 class="font-headline-h3 text-headline-h3 text-on-surface uppercase">Personnel Found</h3>
<span class="bg-surface-container-highest px-3 py-1 rounded-full font-label-tiny text-label-tiny text-[#06B6D4] uppercase border border-[#06B6D4]/30">Target: 14</span>
</div>
<div class="flex items-center justify-between bg-surface-container-low rounded-lg p-2 border border-outline-variant/50">
<button class="w-touch-target-optimum h-touch-target-optimum flex items-center justify-center bg-surface-variant text-on-surface rounded-lg active:scale-95 transition-transform border border-outline-variant hover:bg-surface-bright">
<span class="material-symbols-outlined text-[32px]">remove</span>
</button>
<div class="flex flex-col items-center justify-center flex-1">
<div class="font-display-lg text-display-lg text-mobile-primary font-black tabular-nums">0</div>
<div class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-widest mt-1">Found</div>
</div>
<button class="w-touch-target-optimum h-touch-target-optimum flex items-center justify-center bg-mobile-primary text-white rounded-lg active:scale-95 transition-transform border border-mobile-primary/50 hover:bg-mobile-primary/90 shadow-[0_0_15px_rgba(0,102,255,0.3)]">
<span class="material-symbols-outlined text-[32px]">add</span>
</button>
</div>
</section>
<!-- Mission Status Selector -->
<section class="flex flex-col gap-mobile-base">
<h3 class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-widest pl-1">Team Status</h3>
<div class="grid grid-cols-2 gap-2">
<!-- Active State -->
<button class="relative h-[48px] bg-[#06B6D4]/10 border-2 border-[#06B6D4] text-[#06B6D4] rounded-lg font-headline-h3 text-headline-h3 flex items-center justify-center gap-2 active:scale-95 transition-all">
<span class="absolute inset-0 bg-[#06B6D4]/5 animate-pulse rounded-md"></span>
<span class="material-symbols-outlined text-[20px]" data-weight="fill">search</span>
                    SEARCHING
                </button>
<!-- Inactive States -->
<button class="h-[48px] bg-surface-container border border-outline-variant text-on-surface-variant hover:bg-surface-bright rounded-lg font-headline-h3 text-headline-h3 flex items-center justify-center gap-2 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[20px]">medical_services</span>
                    FIRST AID
                </button>
<button class="h-[48px] bg-surface-container border border-outline-variant text-on-surface-variant hover:bg-surface-bright rounded-lg font-headline-h3 text-headline-h3 flex items-center justify-center gap-2 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[20px]">engineering</span>
                    EXTRICATING
                </button>
<button class="h-[48px] bg-surface-container border border-outline-variant text-on-surface-variant hover:bg-surface-bright rounded-lg font-headline-h3 text-headline-h3 flex items-center justify-center gap-2 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[20px]">flight_takeoff</span>
                    EVACUATING
                </button>
</div>
</section>
<!-- Tactical Observations -->
<section class="flex flex-col gap-mobile-base">
<div class="flex justify-between items-center pl-1">
<h3 class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-widest">Observations / Blockers</h3>
<span class="material-symbols-outlined text-[16px] text-[#06B6D4]">mic</span>
</div>
<div class="relative">
<textarea class="w-full bg-surface-container border border-outline text-on-surface rounded-lg p-3 font-body-md text-body-md min-h-[120px] focus:ring-2 focus:ring-[#06B6D4] focus:border-[#06B6D4] focus:outline-none resize-none transition-all placeholder:text-on-surface-variant/50" placeholder="Describe current conditions, visibility, or new obstacles..."></textarea>
<div class="absolute bottom-3 right-3 flex items-center gap-2">
<button class="bg-surface-variant p-2 rounded-full border border-outline-variant text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]">photo_camera</span>
</button>
<button class="bg-surface-variant p-2 rounded-full border border-outline-variant text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]">location_on</span>
</button>
</div>
</div>
</section>
<!-- Critical Hazards Toggle -->
<section class="bg-surface-container border border-danger/30 rounded-xl overflow-hidden mt-2">
<label class="flex items-center justify-between p-mobile-card-pad cursor-pointer hover:bg-surface-bright transition-colors" id="hazard-toggle-label">
<div class="flex items-center gap-3">
<div class="bg-danger/20 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-danger text-[20px]">warning</span>
</div>
<span class="font-headline-h3 text-headline-h3 text-danger uppercase tracking-wide">New Hazard Detected</span>
</div>
<div class="relative inline-block w-12 h-6 rounded-full bg-surface-variant border border-outline">
<input class="peer sr-only" id="hazard-toggle" type="checkbox"/>
<span class="absolute left-1 top-1 w-4 h-4 rounded-full bg-on-surface-variant transition-all peer-checked:left-7 peer-checked:bg-danger"></span>
</div>
</label>
<!-- Expanding section (hidden by default, handled via CSS peer-checked in a real app, using JS here for simplicity or structural demo) -->
<div class="hidden border-t border-danger/20 p-mobile-card-pad bg-surface-container-low grid-cols-3 gap-2" id="hazard-options">
<button class="flex flex-col items-center justify-center gap-2 bg-surface-container border border-outline-variant p-3 rounded-lg text-on-surface-variant hover:border-danger hover:text-danger active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]">air</span>
<span class="font-label-tiny text-label-tiny uppercase">Gas</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 bg-surface-container border border-outline-variant p-3 rounded-lg text-on-surface-variant hover:border-danger hover:text-danger active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]">house_siding</span>
<span class="font-label-tiny text-label-tiny uppercase">Collapse</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 bg-surface-container border border-outline-variant p-3 rounded-lg text-on-surface-variant hover:border-danger hover:text-danger active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]">water_drop</span>
<span class="font-label-tiny text-label-tiny uppercase">Flood</span>
</button>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-mobile-edge-margin pb-safe bg-surface-container-highest border-t border-outline-variant z-40">
<button class="w-full h-touch-target-optimum bg-mobile-primary text-white font-headline-h3 text-headline-h3 rounded-lg uppercase tracking-wider flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-[0_4px_20px_rgba(0,102,255,0.4)]">
<span class="material-symbols-outlined" data-weight="fill">cell_tower</span>
            Submit Sitrep
        </button>
</div>
<script>
        // Simple toggle logic for the hazard section
        document.getElementById('hazard-toggle').addEventListener('change', function(e) {
            const optionsPanel = document.getElementById('hazard-options');
            if(e.target.checked) {
                optionsPanel.classList.remove('hidden');
                optionsPanel.classList.add('grid');
            } else {
                optionsPanel.classList.add('hidden');
                optionsPanel.classList.remove('grid');
            }
        });
    </script>
</body></html>

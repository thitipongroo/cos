<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Photo Capture - Construction OS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "danger": "#EF4444",
                    "surface": "#031427",
                    "outline": "#909097",
                    "tertiary-fixed": "#acedff",
                    "on-primary-container": "#777c90",
                    "surface-container-high": "#1b2b3f",
                    "surface-bright": "#2a3a4f",
                    "surface-tint": "#c1c5dc",
                    "secondary-fixed-dim": "#b4c5ff",
                    "tertiary-container": "#001318",
                    "primary-container": "#0b1020",
                    "on-primary": "#2b3041",
                    "inverse-surface": "#d3e4fe",
                    "surface-variant": "#26364a",
                    "on-tertiary-fixed": "#001f26",
                    "primary-fixed": "#dee1f9",
                    "on-tertiary-fixed-variant": "#004e5c",
                    "error": "#ffb4ab",
                    "tertiary": "#4cd7f6",
                    "secondary-fixed": "#dbe1ff",
                    "secondary": "#b4c5ff",
                    "error-container": "#93000a",
                    "inverse-on-surface": "#213145",
                    "inverse-primary": "#595e71",
                    "background": "#031427",
                    "concrete-white": "#F8FAFC",
                    "offline": "#8E8E93",
                    "on-secondary-container": "#cdd7ff",
                    "on-error": "#690005",
                    "surface-dim": "#031427",
                    "success": "#10B981",
                    "on-tertiary-container": "#0088a0",
                    "mobile-primary": "#0066FF",
                    "warning": "#F59E0B",
                    "outline-variant": "#46464c",
                    "on-secondary": "#002a78",
                    "on-secondary-fixed-variant": "#003ea8",
                    "on-surface": "#d3e4fe",
                    "on-primary-fixed-variant": "#414658",
                    "primary-fixed-dim": "#c1c5dc",
                    "syncing": "#FFD60A",
                    "on-tertiary": "#003640",
                    "surface-container-highest": "#26364a",
                    "surface-container-lowest": "#000f21",
                    "tertiary-fixed-dim": "#4cd7f6",
                    "secondary-container": "#0053db",
                    "surface-container": "#102034",
                    "on-background": "#d3e4fe",
                    "primary": "#c1c5dc",
                    "on-surface-variant": "#c7c6cd",
                    "on-primary-fixed": "#161b2b",
                    "surface-container-low": "#0b1c30",
                    "on-error-container": "#ffdad6",
                    "on-secondary-fixed": "#00174b"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "touch-target-min": "44px",
                    "web-page-gap": "64px",
                    "mobile-section-pad": "16px",
                    "mobile-card-pad": "12px",
                    "mobile-base": "8px",
                    "web-base": "4px",
                    "web-gap-tight": "4px",
                    "touch-target-optimum": "52px",
                    "mobile-edge-margin": "24px",
                    "web-padding-card": "16px",
                    "web-margin-component": "32px",
                    "mobile-icon-pad": "8px"
            },
            "fontFamily": {
                    "mobile-body": ["Inter"],
                    "headline-h3": ["Inter"],
                    "headline-h2": ["Inter"],
                    "mobile-title": ["Inter"],
                    "headline-h1": ["Inter"],
                    "mobile-hero": ["Inter"],
                    "label-tiny": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "display-lg": ["Inter"]
            },
            "fontSize": {
                    "mobile-body": ["17px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "headline-h3": ["16px", {"lineHeight": "1.3", "fontWeight": "500"}],
                    "headline-h2": ["20px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "mobile-title": ["22px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "headline-h1": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "mobile-hero": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "label-tiny": ["11px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-sm": ["12px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: #031427;
            color: #d3e4fe;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .grid-overlay {
            background-size: 33.33% 33.33%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.3) 1px, transparent 1px);
        }
        
        .viewfinder-container {
            position: relative;
            flex-grow: 1;
            overflow: hidden;
            background-color: #000; /* Camera background */
        }
        
        /* Simulating camera feed */
        .camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8; /* Simulate dark environment a bit */
        }

        .offline-badge {
            animation: pulse-sync 2s infinite;
        }
        
        @keyframes pulse-sync {
            0% { opacity: 0.8; }
            50% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<!-- Top App Bar -->
<header class="flex items-center justify-between px-mobile-edge-margin w-full h-touch-target-optimum bg-surface dark:bg-surface border-b border-outline-variant shrink-0 z-10">
<button aria-label="Back" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors active:opacity-80 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-h2 text-headline-h2 font-bold text-primary tracking-tight">FIELD CAPTURE</h1>
<button aria-label="Cloud Sync" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors active:opacity-80 rounded-full">
<span class="material-symbols-outlined" data-icon="cloud_sync">cloud_sync</span>
</button>
</header>
<!-- Offline Queue Badge -->
<div class="bg-surface-container border-b border-warning/30 px-mobile-edge-margin py-2 flex items-center justify-center gap-2 shrink-0 z-10">
<span class="material-symbols-outlined text-warning text-sm offline-badge" data-icon="sync_disabled">sync_disabled</span>
<span class="font-body-sm text-body-sm text-warning">Offline - 3 items in queue</span>
</div>
<!-- Main Viewfinder Area -->
<main class="viewfinder-container flex flex-col relative">
<!-- Background Camera Feed Simulation -->
<img alt="Camera Feed" class="camera-feed absolute inset-0 z-0" data-alt="A POV shot from a smartphone camera looking at a concrete structural pillar on a construction site. The lighting is bright outdoor sunlight casting sharp shadows. The concrete texture is rough and industrial. The overall color palette is dominated by gray concrete and structural steel, conveying a sense of mission-critical engineering work." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEnkcQNcslLTVzacdvVOsrInEm63prI3p-hd8MDpGUel1z9lMmUOKu_Dfs6dLsIhkxMcQT_R6K2yUEUwKrdjTcb5EH5tXyJ-KUi6AwgQ9qDfRW-TKWRr9Y888woOVJZDdlbBTSoZy1Qqucf8Mn9t5ZeqVJmilx2K6nTei_AxmLI-PF0dQZEbH_GsiMDj8J3tTwSYu7K4Qu_F-9XMwhq-0wjkOV8Q7YDhYZ6cmZZgkKA2FGGK0a_EEhXw"/>
<!-- Grid Overlay -->
<div class="absolute inset-0 grid-overlay z-10 pointer-events-none border border-white/20 m-4"></div>
<!-- Crosshairs/Center marker -->
<div class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
<div class="w-8 h-8 border border-white/50 rounded-full relative">
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-1 h-1 bg-tertiary rounded-full"></div>
</div>
</div>
<!-- Annotation Toolbar (Floating) -->
<div class="absolute top-mobile-edge-margin right-mobile-edge-margin flex flex-col gap-mobile-base z-20 bg-surface-container/80 backdrop-blur-md p-2 rounded-xl border border-outline-variant shadow-lg">
<button aria-label="Draw" class="h-10 w-10 flex items-center justify-center rounded-lg bg-tertiary/20 text-tertiary border border-tertiary hover:bg-tertiary/30 transition-colors" title="Pencil/Draw">
<span class="material-symbols-outlined text-lg" data-icon="edit">edit</span>
</button>
<button aria-label="Arrow" class="h-10 w-10 flex items-center justify-center rounded-lg text-on-surface hover:bg-surface-variant transition-colors" title="Arrow">
<span class="material-symbols-outlined text-lg" data-icon="north_east">north_east</span>
</button>
<button aria-label="Text" class="h-10 w-10 flex items-center justify-center rounded-lg text-on-surface hover:bg-surface-variant transition-colors" title="Text Box">
<span class="material-symbols-outlined text-lg" data-icon="text_fields">text_fields</span>
</button>
<button aria-label="Eraser" class="h-10 w-10 flex items-center justify-center rounded-lg text-danger hover:bg-danger/10 transition-colors" title="Eraser">
<span class="material-symbols-outlined text-lg" data-icon="ink_eraser">ink_eraser</span>
</button>
</div>
<!-- Measurement / AI Insight overlay snippet -->
<div class="absolute bottom-32 left-mobile-edge-margin bg-surface-container/90 backdrop-blur-sm p-3 rounded-lg border border-tertiary/50 z-20 flex flex-col gap-1 max-w-[200px]">
<div class="flex items-center gap-1 text-tertiary font-label-tiny text-label-tiny uppercase">
<span class="material-symbols-outlined text-[14px]" data-icon="memory">memory</span> AI INSIGHT
             </div>
<div class="font-body-sm text-body-sm text-on-surface">Structural crack detected. Approx 2.4mm width.</div>
</div>
<!-- Bottom Control Bar -->
<div class="absolute bottom-0 w-full h-32 bg-gradient-to-t from-surface via-surface/80 to-transparent flex items-center justify-between px-mobile-edge-margin pb-6 z-20">
<!-- Gallery Shortcut -->
<button aria-label="Gallery" class="h-touch-target-optimum w-touch-target-optimum flex items-center justify-center rounded-full bg-surface-variant border border-outline-variant text-on-surface hover:bg-surface-bright transition-colors active:scale-95">
<img alt="Latest photo" class="w-10 h-10 rounded-full object-cover border-2 border-surface" data-alt="A small square thumbnail image of a previously taken construction site photo, showing steel rebar against a concrete background, slightly blurred." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBaROQV99nGLrhoG3k64IDWgdTGW_RRHU32ynefjXunhlFHEbsAZtwfr-ExcvNlOnlwBjvaMVVVxdNFTYqn_4DaPd6DTEXtexboTQayYeq1ieksa6L0EhUc5MQ7HKGwqkFpRau10mfO7NYbFNRy46OAj-ZjIy5fkNL6FhU-Zb5ENDMGVDgpER2FR2LKSm478WVBWj2PX9lb44BqE2IuvuQhVvEUx7643GC0_wJeVs3OsuYYxHcp4clWFA"/>
</button>
<!-- Shutter Button -->
<button aria-label="Capture Photo" class="h-20 w-20 rounded-full bg-surface border-4 border-on-surface flex items-center justify-center hover:bg-surface-container-high active:scale-90 transition-transform duration-150 group">
<div class="h-16 w-16 rounded-full bg-mobile-primary group-active:bg-secondary-container transition-colors shadow-[0_0_15px_rgba(0,102,255,0.5)]"></div>
</button>
<!-- Flash Toggle -->
<button aria-label="Toggle Flash" class="h-touch-target-optimum w-touch-target-optimum flex items-center justify-center rounded-full bg-surface-variant border border-outline-variant text-on-surface hover:bg-surface-bright transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="flash_on">flash_on</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-mobile-base pb-mobile-base pt-2 bg-surface-container-lowest dark:bg-surface-container-lowest border-t border-outline-variant shrink-0">
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl h-10 w-16 active:scale-95 transition-transform duration-150 hover:text-on-surface">
<span class="material-symbols-outlined" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
<button class="flex flex-col items-center justify-center text-outline h-10 w-16 active:scale-95 transition-transform duration-150 hover:text-on-surface">
<span class="material-symbols-outlined" data-icon="draw">draw</span>
</button>
<button class="flex flex-col items-center justify-center text-outline h-10 w-16 active:scale-95 transition-transform duration-150 hover:text-on-surface">
<span class="material-symbols-outlined" data-icon="grid_view">grid_view</span>
</button>
<button class="flex flex-col items-center justify-center text-outline h-10 w-16 active:scale-95 transition-transform duration-150 hover:text-on-surface">
<span class="material-symbols-outlined" data-icon="sync_saved_locally">sync_saved_locally</span>
</button>
</nav>
<!-- Padding to account for fixed bottom nav -->
<div class="h-[72px] shrink-0 bg-surface-container-lowest"></div>
</body></html>

<body class="bg-background text-on-background min-h-screen font-body-md flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface text-primary font-headline-h1 text-headline-h1 docked full-width top-0 border-b border-outline-variant flat no shadows flex justify-between items-center w-full px-mobile-edge-margin h-[64px] fixed z-50">

</button>
<h1 class="font-headline-h1 text-headline-h1 text-on-surface truncate">Export Evidence</h1>
<button class="hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full text-on-surface-variant flex items-center justify-center h-[44px] w-[44px]">

</button>
</header>

</div>

<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">check_circle</span>

</div>

<button class="w-full text-left bg-surface-container rounded-xl p-4 border-2 border-tertiary flex items-start gap-4 active:scale-[0.98] transition-transform relative overflow-hidden group shadow-md shadow-tertiary/10">
<div class="absolute inset-0 bg-tertiary opacity-10 group-hover:opacity-20 transition-opacity"></div>
<div class="h-10 w-10 rounded-full bg-tertiary-container flex items-center justify-center shrink-0 text-tertiary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">picture_as_pdf</span>
</div>
<div class="flex flex-col gap-1 pr-6 relative z-10">
<span class="font-headline-h3 text-headline-h3 text-on-surface">PDF Audit Proof</span>
<span class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">Include technical metadata, AI analysis, and digital signature</span>
</div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center justify-center z-10">
<div class="h-6 w-6 rounded-full border-2 border-tertiary flex items-center justify-center bg-surface-container">
<div class="h-3 w-3 rounded-full bg-tertiary"></div>
</div>
</div>
</button>

</div>
<div class="flex flex-col gap-1">
<span class="font-headline-h3 text-headline-h3 text-on-surface">High-Res Image</span>
<span class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">Export original 4K resolution photo without markups</span>
</div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center justify-center">
<div class="h-6 w-6 rounded-full border-2 border-outline-variant"></div>
</div>
</button>

<span class="material-symbols-outlined">data_object</span>
</div>
<div class="flex flex-col gap-1">
<span class="font-headline-h3 text-headline-h3 text-on-surface">Technical Data (CSV/JSON)</span>
<span class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">Export raw sensor logs, GPS coordinates, and EXIF data</span>
</div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center justify-center">
<div class="h-6 w-6 rounded-full border-2 border-outline-variant"></div>
</div>

<div class="h-14 w-14 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center text-on-surface group-active:bg-surface-variant group-hover:border-tertiary transition-colors relative overflow-hidden">

</div>
<span class="font-body-sm text-body-sm text-on-surface-variant text-center leading-tight">Project Slack</span>
</button>
<!-- Destination 2 -->
<button class="snap-start shrink-0 flex flex-col items-center gap-2 w-20 group">
<div class="h-14 w-14 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center text-on-surface group-active:bg-surface-variant group-hover:border-tertiary transition-colors relative overflow-hidden">
<span class="material-symbols-outlined relative z-10">mail</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant text-center leading-tight">Site Email</span>
</button>
<!-- Destination 3 -->

<div class="h-14 w-14 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center text-on-surface group-active:bg-surface-variant group-hover:border-tertiary transition-colors relative overflow-hidden">

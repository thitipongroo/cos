        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface min-h-screen flex flex-col pt-[72px]">
<!-- TopAppBar -->
<header class="bg-surface-container-highest dark:bg-surface-container-highest fixed top-0 w-full z-50 border-b border-outline-variant dark:border-outline-variant flex items-center justify-between px-mobile-edge-margin h-touch-target-optimum w-full">
<button class="text-primary dark:text-primary hover:bg-surface-bright dark:hover:bg-surface-bright active:scale-95 transition-transform flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-mobile-title text-mobile-title font-bold text-on-surface dark:text-on-surface">Log Options</h1>
<button class="text-primary dark:text-primary hover:bg-surface-bright dark:hover:bg-surface-bright active:scale-95 transition-transform flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-mobile-edge-margin py-mobile-section-pad flex flex-col gap-4">
<!-- Context Card (Log Details Summary) -->
<div class="bg-surface-container rounded-xl p-mobile-card-pad border border-outline-variant flex flex-col gap-2">
<div class="flex items-center justify-between">
<span class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider">Log ID: #A93-B72</span>
<span class="font-label-tiny text-label-tiny text-success uppercase bg-success/10 px-2 py-1 rounded-full">Verified</span>
</div>
<div class="font-mobile-body text-mobile-body text-on-surface">Structural Integrity Audit - Zone 4</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">Timestamp: 2023-10-27 14:32:01 UTC</div>
</div>
<!-- Options List -->
<div class="flex flex-col gap-2 mt-4">
<!-- Option: Export -->
<button class="bg-surface-container-low hover:bg-surface-bright active:scale-[0.98] transition-all rounded-lg p-4 border border-outline-variant flex items-center justify-between min-h-touch-target-optimum group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container/20 flex items-center justify-center text-mobile-primary group-hover:bg-mobile-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="ios_share">ios_share</span>
</div>
<span class="font-body-md text-body-md font-medium text-on-surface">Export Audit Proof (PDF)</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Option: Report -->
<button class="bg-surface-container-low hover:bg-surface-bright active:scale-[0.98] transition-all rounded-lg p-4 border border-outline-variant flex items-center justify-between min-h-touch-target-optimum group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-warning/10 flex items-center justify-center text-warning group-hover:bg-warning group-hover:text-surface-dim transition-colors">
<span class="material-symbols-outlined" data-icon="report_problem">report_problem</span>
</div>
<span class="font-body-md text-body-md font-medium text-on-surface">Report Data Discrepancy</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Option: View Technical JSON -->
<button class="bg-surface-container-low hover:bg-surface-bright active:scale-[0.98] transition-all rounded-lg p-4 border border-outline-variant flex items-center justify-between min-h-touch-target-optimum group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-tertiary/10 flex items-center justify-center text-tertiary group-hover:bg-tertiary group-hover:text-tertiary-container transition-colors">
<span class="material-symbols-outlined" data-icon="code">code</span>
</div>
<span class="font-body-md text-body-md font-medium text-on-surface">View Technical JSON</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Option: Flag -->
<button class="bg-surface-container-low hover:bg-surface-bright active:scale-[0.98] transition-all rounded-lg p-4 border border-danger/30 flex items-center justify-between min-h-touch-target-optimum group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-danger/10 flex items-center justify-center text-danger group-hover:bg-danger group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="flag">flag</span>
</div>
<span class="font-body-md text-body-md font-medium text-danger">Flag for Manual Review</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-danger">chevron_right</span>
</button>
</div>
</main>
<!-- Suppressed Nav Shell - Task focused screen with back action implies temporary departure from main flow -->
</body></html>

<!DOCTYPE html>

<html class="dark" lang="en"><head>

<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Report Site Deviation - Construction OS</title>

                        "error": "#ffb4ab",
                        "surface-tint": "#c1c5dc",
                        "on-secondary-fixed": "#00174b",
                        "inverse-primary": "#595e71",
                        "tertiary": "#4cd7f6",

                        "error-container": "#93000a",

                        "on-background": "#d3e4fe",

                        "outline-variant": "#46464c",
                        "mobile-primary": "#0066FF",
                        "on-secondary-fixed-variant": "#003ea8",
                        "on-tertiary": "#003640",

                    "borderRadius": {

<style>
        /* Hide scrollbar for a cleaner mobile app look */
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Style adjustments for native HTML elements */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased pb-24 pt-16">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center h-[52px] px-mobile-edge-margin bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline-variant">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-high transition-colors active:opacity-80 transition-opacity flex items-center justify-center w-touch-target-min h-touch-target-min -ml-mobile-icon-pad">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-h2 text-headline-h2 text-on-surface dark:text-on-surface font-bold tracking-tight flex-1 text-center truncate">Report Deviation</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-high transition-colors active:opacity-80 transition-opacity flex items-center justify-center w-touch-target-min h-touch-target-min -mr-mobile-icon-pad">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</header>
<main class="px-mobile-edge-margin flex flex-col gap-6 w-full max-w-md mx-auto">
<!-- Location & Element -->
<section class="flex flex-col gap-4">
<h2 class="font-headline-h3 text-headline-h3 text-primary mb-1">Location &amp; Element</h2>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant">Sector</label>
<div class="relative flex items-center h-[52px] bg-surface-container border border-outline-variant rounded-DEFAULT overflow-hidden focus-within:ring-2 focus-within:ring-tertiary-fixed-dim">
<input class="w-full h-full bg-transparent border-none text-on-surface px-4 py-2 placeholder-on-surface-variant focus:ring-0" placeholder="Sector G" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant">Floor</label>
<div class="relative flex items-center h-[52px] bg-surface-container border border-outline-variant rounded-DEFAULT overflow-hidden focus-within:ring-2 focus-within:ring-tertiary-fixed-dim">
<input class="w-full h-full bg-transparent border-none text-on-surface px-4 py-2 placeholder-on-surface-variant focus:ring-0" placeholder="Level 4" type="text"/>
</div>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant">BIM Element ID</label>
<div class="relative flex items-center h-[52px] bg-surface-container border border-outline-variant rounded-DEFAULT overflow-hidden focus-within:ring-2 focus-within:ring-tertiary-fixed-dim">
<input class="w-full h-full bg-transparent border-none text-on-surface pl-4 pr-12 py-2 placeholder-on-surface-variant focus:ring-0" placeholder="Scan or enter ID..." type="text"/>
<button class="absolute right-0 h-full w-[52px] flex items-center justify-center text-mobile-primary active:opacity-80">
<span class="material-symbols-outlined">qr_code_scanner</span>
</button>
</div>
</div>
</section>
<!-- Deviation Details -->
<section class="flex flex-col gap-4">
<h2 class="font-headline-h3 text-headline-h3 text-primary mb-1">Deviation Details</h2>
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant">Deviation Type</label>
<div class="relative flex items-center h-[52px] bg-surface-container border border-outline-variant rounded-DEFAULT overflow-hidden focus-within:ring-2 focus-within:ring-tertiary-fixed-dim">
<select class="w-full h-full bg-transparent border-none text-on-surface pl-4 pr-12 py-2 focus:ring-0">
<option class="bg-surface-dim" disabled="" selected="" value="">Select type...</option>
<option class="bg-surface-dim" value="clash">Structural Clash</option>
<option class="bg-surface-dim" value="material">Material Defect</option>
<option class="bg-surface-dim" value="alignment">Alignment Issue</option>
<option class="bg-surface-dim" value="other">Other</option>
</select>
<span class="material-symbols-outlined absolute right-4 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant">Description</label>
<div class="relative flex bg-surface-container border border-outline-variant rounded-DEFAULT overflow-hidden focus-within:ring-2 focus-within:ring-tertiary-fixed-dim">
<textarea class="w-full min-h-[104px] bg-transparent border-none text-on-surface p-4 placeholder-on-surface-variant focus:ring-0 resize-y" placeholder="Provide detailed observation..."></textarea>
</div>
</div>
</section>
<!-- Evidence -->
<section class="flex flex-col gap-4">
<div class="flex justify-between items-end mb-1">
<h2 class="font-headline-h3 text-headline-h3 text-primary">Evidence</h2>
<span class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider">0 Attached</span>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex flex-col items-center justify-center gap-2 h-[120px] bg-surface-container border-2 border-dashed border-outline-variant rounded-DEFAULT text-mobile-primary hover:bg-surface-bright active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl">photo_camera</span>
<span class="font-body-sm text-body-sm font-medium">Capture Field</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 h-[120px] bg-surface-container border-2 border-dashed border-outline-variant rounded-DEFAULT text-mobile-primary hover:bg-surface-bright active:scale-95 transition-all opacity-50 cursor-not-allowed">
<span class="material-symbols-outlined text-3xl">3d_rotation</span>
<span class="font-body-sm text-body-sm font-medium text-center px-2">Compare with BIM<br/><span class="text-[10px] text-on-surface-variant font-normal">(Requires ID)</span></span>
</button>
</div>
</section>
<!-- Severity Level -->
<section class="flex flex-col gap-4">
<h2 class="font-headline-h3 text-headline-h3 text-primary mb-1">Severity Level</h2>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer">
<input class="peer sr-only" name="severity" type="radio" value="low"/>
<div class="flex items-center justify-center h-[44px] px-4 rounded-full border border-outline-variant bg-surface-container text-on-surface-variant peer-checked:bg-surface-bright peer-checked:text-on-surface peer-checked:border-on-surface transition-colors">
<span class="font-body-sm text-body-sm font-medium">Low</span>
</div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="severity" type="radio" value="medium"/>
<div class="flex items-center justify-center h-[44px] px-4 rounded-full border border-outline-variant bg-surface-container text-on-surface-variant peer-checked:bg-warning peer-checked:text-background peer-checked:border-warning transition-colors">
<span class="font-body-sm text-body-sm font-medium">Medium</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="severity" type="radio" value="high"/>
<div class="flex items-center justify-center h-[44px] px-4 rounded-full border border-outline-variant bg-surface-container text-on-surface-variant peer-checked:bg-danger peer-checked:text-background peer-checked:border-danger transition-colors">
<span class="font-body-sm text-body-sm font-medium">High</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="severity" type="radio" value="critical"/>
<div class="flex items-center justify-center h-[44px] px-4 rounded-full border border-outline-variant bg-surface-container text-danger border-danger peer-checked:bg-danger peer-checked:text-background peer-checked:border-danger transition-colors font-bold shadow-[0_0_10px_rgba(239,68,68,0.3)]">
<span class="font-body-sm text-body-sm">Critical</span>
</div>
</label>
</div>
</section>
<!-- Assignment -->
<section class="flex flex-col gap-4 mb-8">
<h2 class="font-headline-h3 text-headline-h3 text-primary mb-1">Assignment</h2>
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant">Assign To</label>
<div class="relative flex items-center h-[52px] bg-surface-container border border-outline-variant rounded-DEFAULT overflow-hidden focus-within:ring-2 focus-within:ring-tertiary-fixed-dim">
<select class="w-full h-full bg-transparent border-none text-on-surface pl-4 pr-12 py-2 focus:ring-0">
<option class="bg-surface-dim" disabled="" selected="" value="">Select assignee...</option>
<option class="bg-surface-dim" value="eng1">Structural Engineering Team</option>
<option class="bg-surface-dim" value="arch1">Architecture Lead</option>
<option class="bg-surface-dim" value="qa1">QA/QC Inspector</option>
</select>
<span class="material-symbols-outlined absolute right-4 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</section>
<!-- Submit CTA -->
<button class="w-full h-[52px] bg-mobile-primary text-white font-headline-h3 text-headline-h3 rounded-DEFAULT flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-lg shadow-mobile-primary/20 mt-4 mb-4">
<span class="material-symbols-outlined">send</span>
<span>Submit Deviation Report</span>
</button>
</main>
<!-- BottomNavBar from JSON -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-[52px] px-mobile-edge-margin bg-surface-container dark:bg-surface-container border-t border-outline-variant dark:border-outline-variant md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-bright dark:hover:bg-surface-bright active:scale-95 transition-transform duration-100 h-full min-w-[touch-target-min]">
<span class="material-symbols-outlined mb-0.5" style="font-variation-settings: 'FILL' 0;">assignment</span>
<span class="font-label-tiny text-label-tiny">Tasks</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container rounded-full px-4 py-1 hover:bg-surface-bright dark:hover:bg-surface-bright active:scale-95 transition-transform duration-100 h-[calc(100%-8px)] min-w-[touch-target-min]">
<span class="material-symbols-outlined mb-0.5" style="font-variation-settings: 'FILL' 1;">analytics</span>
<span class="font-label-tiny text-label-tiny">Reports</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-bright dark:hover:bg-surface-bright active:scale-95 transition-transform duration-100 h-full min-w-[touch-target-min]">
<span class="material-symbols-outlined mb-0.5" style="font-variation-settings: 'FILL' 0;">inventory_2</span>
<span class="font-label-tiny text-label-tiny">Inventory</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-bright dark:hover:bg-surface-bright active:scale-95 transition-transform duration-100 h-full min-w-[touch-target-min]">
<span class="material-symbols-outlined mb-0.5" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-tiny text-label-tiny">Profile</span>
</button>
</nav>
<!-- Spacer for desktop equivalent nav logic if ever expanded -->
<div class="hidden md:flex fixed top-[52px] left-0 h-[calc(100vh-52px)] w-64 bg-surface-container border-r border-outline-variant flex-col p-4 opacity-0 pointer-events-none">
<!-- Desktop Nav Placeholder -->
</div>
</body></html>

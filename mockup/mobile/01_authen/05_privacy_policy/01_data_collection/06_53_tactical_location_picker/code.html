<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-60" data-alt="A highly detailed overhead view of an industrial excavation site or tactical zone at night. The scene is illuminated by harsh, artificial floodlights cutting through the darkness, creating deep shadows and high contrast. The image is styled as a digital satellite or drone feed, with a dark, monochromatic blue-gray color palette consistent with a mission-critical military or corporate interface. Technical, structural details are visible in the terrain." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBiyWIk5uPtr9glUEuwZW8tLcIQqo_uDsmxl75o-1NVcvpTXFvu5EA3f8KBRFKfNm832Lj_52y98XDI5otGxExEK-qQmcKWrZt3C1L2qfS3B9Tf9m1bCRGQ4-M4ZIhu5YmpHvcWAvAQ734pnfwaBmaWdp2NdWrKCCE9mYx7OTE2v4ggvJUxcaSu4vv3HOXUQo1Zbgp0xmmKcOz5Woe9hDAVmuiZ-Lcyz8eOpsYjkx6ar3bUWWcAMPwQMg"/>
<div class="absolute inset-0 grid-overlay"></div>

<!-- TopAppBar -->
<header class="relative z-20 flex items-center justify-between px-mobile-edge-margin w-full h-touch-target-optimum bg-surface-container-lowest dark:bg-surface-container-lowest border-b border-outline-variant flat no shadows">
<button aria-label="Back" class="h-10 w-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-bright active:scale-95 transition-transform rounded">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-h2 text-headline-h2 font-bold text-on-surface tracking-tighter">TACTICAL LOCATOR</h1>
<button aria-label="Sync" class="h-10 w-10 flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-bright active:scale-95 transition-transform rounded">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
</button>
</header>
<main class="relative flex-grow z-10 flex flex-col">
<!-- Search Overlay -->
<div class="px-mobile-edge-margin py-mobile-section-pad">
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant z-10">search</span>
<input class="w-full h-touch-target-optimum bg-surface-container text-on-surface pl-12 pr-4 rounded-xl border border-outline focus:ring-2 focus:ring-tertiary focus:border-transparent outline-none font-body-md shadow-lg placeholder:text-on-surface-variant/50" placeholder="Search Sector or Zone..." type="text"/>
</div>
</div>
<!-- Crosshair Center -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative w-16 h-16">
<div class="absolute top-0 bottom-0 left-1/2 w-0.5 bg-tertiary -translate-x-1/2"></div>
<div class="absolute left-0 right-0 top-1/2 h-0.5 bg-tertiary -translate-y-1/2"></div>
<div class="absolute inset-0 border-2 border-tertiary rounded-full opacity-50 scale-75"></div>
<div class="absolute inset-2 border border-tertiary rounded-full opacity-80"></div>
<div class="absolute top-1/2 left-1/2 w-1.5 h-1.5 bg-tertiary rounded-full -translate-x-1/2 -translate-y-1/2"></div>
</div>
</div>
</main>
<!-- Bottom Fixed Section -->
<div class="relative z-20 w-full px-mobile-edge-margin pb-mobile-edge-margin pt-4 flex flex-col gap-mobile-base">
<!-- Floating Control -->
<div class="self-end mb-2">
<button class="w-12 h-12 bg-surface-container border border-outline-variant rounded-full flex items-center justify-center text-on-surface shadow-lg hover:bg-surface-bright active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="my_location">my_location</span>
</button>
</div>
<!-- Details Card -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-mobile-card-pad shadow-xl flex flex-col gap-3">
<div class="flex justify-between items-start">
<h2 class="font-headline-h3 text-headline-h3 text-primary">Selected Coordinates</h2>
<div class="flex items-center gap-1.5 px-2 py-0.5 bg-success/10 border border-success/30 rounded-full">
<div class="w-1.5 h-1.5 bg-success rounded-full animate-pulse"></div>
<span class="font-label-tiny text-label-tiny text-success uppercase">GPS: Strong (±2m)</span>
</div>
</div>
<div class="flex flex-col gap-1">
<p class="font-body-md text-body-md text-on-surface">Sector G: North Excavation</p>
<div class="flex items-center gap-2 text-on-surface-variant font-mono">
<span class="material-symbols-outlined text-[16px]">location_on</span>
<span class="font-body-sm text-body-sm">LAT 13.7563 / LONG 100.5018</span>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-touch-target-optimum bg-mobile-primary hover:bg-mobile-primary/90 text-white font-headline-h3 text-headline-h3 rounded-lg flex items-center justify-center gap-2 mt-2 active:scale-[0.98] transition-transform">
<span>CONFIRM LOCATION</span>
<span class="material-symbols-outlined text-[18px]">check_circle</span>
</button>
</div>
</div>

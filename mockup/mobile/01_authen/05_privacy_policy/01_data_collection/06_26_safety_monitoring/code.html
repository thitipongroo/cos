<body class="bg-background text-on-surface font-body-md antialiased md:hidden h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface surface-dim flex items-center justify-between px-mobile-edge-margin h-16 shrink-0 border-b border-outline-variant relative z-40 shadow-sm">
<button aria-label="Go Back" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-primary active:opacity-80 transition-opacity -ml-mobile-icon-pad">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-h2 text-headline-h2 font-bold text-on-surface text-center flex-1">Safety Monitoring</h1>
<button aria-label="Information" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-primary active:opacity-80 transition-opacity -mr-mobile-icon-pad">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">info</span>
</button>
</header>
<!-- Tabs -->
<div class="flex border-b border-outline-variant bg-surface-container-low shrink-0">
<button class="flex-1 py-mobile-section-pad text-tertiary font-semibold border-b-2 border-tertiary font-headline-h3 text-headline-h3 text-center">
            Live Alerts
        </button>
<button class="flex-1 py-mobile-section-pad text-on-surface-variant font-medium border-b-2 border-transparent font-headline-h3 text-headline-h3 text-center active:bg-surface-container-high transition-colors">
            Statistics
        </button>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-mobile-edge-margin py-mobile-section-pad space-y-4 pb-24">
<!-- Critical Alert Card -->
<article class="bg-surface-container rounded-xl border border-danger/30 overflow-hidden shadow-sm flex flex-col">
<div class="p-mobile-card-pad border-b border-outline-variant/30 flex items-start justify-between bg-error-container/10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-danger text-[20px]" style="font-variation-settings: 'FILL' 1;">warning</span>
<h2 class="font-headline-h3 text-headline-h3 text-danger font-semibold">Critical Violation</h2>
</div>
<span class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider">2 mins ago</span>
</div>
<div class="relative w-full h-48 bg-surface-container-lowest">
<img alt="Safety Incident Image" class="w-full h-full object-cover" data-alt="A high-contrast industrial construction site scene captured from a high-angle security camera perspective. A construction worker is visible on a steel scaffold structure. A stark, bright red glowing AI bounding box accurately highlights the worker's head, indicating a missing hard hat. The scene has a gritty, mission-critical aesthetic with deep navy shadows and stark lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcKz5tqb1vqpDsf9Kn5C4cLlZx-j7HToFnFkaSpSFHftjfbgrhu52Uo-C2LBBskgzposUHs5-A59pLFrOuD_appyTuUFw7aTEy5TqzlXqHFB24uzSJnxPlJ0QXVeImuDIbgMweUAaLvAOw0YajDqNzyZPSQaNf0vYqmJOhYTA_9rMR0A1Sx9H28xGpYTHyfcQNnPKRPeo1aqLuGgSYrLr4Einx94V45eJjS9xP5EhthLP5oJ-Ip2-UvA"/>
<!-- AI Bounding Box Simulation over Image (using CSS for demo if image isn't loaded) -->
<div class="absolute inset-0 border-2 border-danger shadow-[0_0_8px_rgba(239,68,68,0.6)] rounded-sm m-8 pointer-events-none flex items-start justify-end p-1">
<span class="bg-danger text-concrete-white font-label-tiny text-label-tiny px-1 rounded-sm shadow-md">PPE: HELMET MISSING</span>
</div>
</div>
<div class="p-mobile-card-pad flex flex-col gap-3">
<div>
<h3 class="font-mobile-body text-mobile-body font-medium text-on-surface">PPE Violation detected</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                        Sector G - Level 2
                    </p>
</div>
<div class="flex gap-2 mt-2">
<button class="flex-1 h-touch-target-min bg-surface-variant border border-outline-variant rounded-lg text-on-surface font-headline-h3 text-headline-h3 flex items-center justify-center active:bg-surface-container-high transition-colors">
                        Acknowledge
                    </button>
<button class="flex-1 h-touch-target-min bg-danger text-concrete-white rounded-lg font-headline-h3 text-headline-h3 flex items-center justify-center shadow-sm active:opacity-80 transition-opacity">
                        Escalate
                    </button>
</div>
</div>
</article>
<!-- Warning Alert Card -->
<article class="bg-surface-container rounded-xl border border-warning/30 overflow-hidden shadow-sm flex flex-col mt-4">
<div class="p-mobile-card-pad border-b border-outline-variant/30 flex items-start justify-between bg-warning/10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-warning text-[20px]" style="font-variation-settings: 'FILL' 1;">error</span>
<h2 class="font-headline-h3 text-headline-h3 text-warning font-semibold">Warning</h2>
</div>
<span class="font-label-tiny text-label-tiny text-on-surface-variant uppercase tracking-wider">15 mins ago</span>
</div>
<div class="relative w-full h-40 bg-surface-container-lowest">
<img alt="Safety Incident Image" class="w-full h-full object-cover" data-alt="A gritty industrial view of an indoor construction floor zone, lit by harsh overhead work lights. A specific rectangular section of the concrete floor is highlighted with a semi-transparent amber-warning digital overlay grid, indicating a restricted hazardous zone. Dark, deep shadows contrast with the stark warning highlight in a mission-critical style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDstZ31P8VVyLucHOQgzMNJ0UMmkZ5FM9KsX56Bhtf8iS8FAcygsHB9PKD4mHdQFh48-tGPnUD6dbduu7x1QgYY3ZMgC1LM6FuGNFaTp4ch7ZpfSeNU0l3kbr75kS7R3u2CZK9ppXM4DqUojfIJOkKiYEVJF4ZIMNM5Ai6_79Q8JOtuM5uifVur5dZeeBUIfpeVQAFpXw3mAEjopaejoEVJWa_eWfDwLl-DPmP7qlRHBOtynk5qs10Wlg"/>
<!-- AI Zone Simulation -->
<div class="absolute bottom-4 left-4 right-20 top-12 bg-warning/20 border border-warning/50 rounded-sm pointer-events-none"></div>
</div>
<div class="p-mobile-card-pad flex flex-col gap-3">
<div>
<h3 class="font-mobile-body text-mobile-body font-medium text-on-surface">Unauthorized Incursion</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                        Zone 4 (Hazardous)
                    </p>
</div>
</div>
</article>
<!-- Summary Bottom Row -->
<div class="mt-6 p-4 bg-surface-container-low border border-outline-variant rounded-xl flex items-center justify-between shadow-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-success/20 flex items-center justify-center border border-success/50">
<span class="material-symbols-outlined text-success" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-headline-h3 text-headline-h3 text-on-surface">Overall Compliance</span>
</div>
<span class="font-mobile-title text-mobile-title text-success">94%</span>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-surface-container-low border-t border-outline-variant flex items-center justify-around z-50 shadow-[0_-4px_16px_rgba(0,0,0,0.5)]">
<!-- Field (Inactive) -->
<button class="flex flex-col items-center justify-center w-16 h-full text-on-surface-variant active:opacity-80 transition-opacity">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">construction</span>
<span class="font-label-tiny text-label-tiny">Field</span>
</button>
<!-- Safety (Active) -->
<button class="flex flex-col items-center justify-center w-16 h-full text-tertiary font-semibold active:opacity-80 transition-opacity">
<div class="bg-tertiary/20 p-1 rounded-full mb-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
<span class="font-label-tiny text-label-tiny">Safety</span>
</button>
<!-- Logs (Inactive) -->
<button class="flex flex-col items-center justify-center w-16 h-full text-on-surface-variant active:opacity-80 transition-opacity">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">list_alt</span>
<span class="font-label-tiny text-label-tiny">Logs</span>
</button>
<!-- Profile (Inactive) -->
<button class="flex flex-col items-center justify-center w-16 h-full text-on-surface-variant active:opacity-80 transition-opacity">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-tiny text-label-tiny">Profile</span>
</button>
</nav>
</body></html>

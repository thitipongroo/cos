</button>
<div class="flex-1 flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-tertiary" data-icon="hexagon" style="font-variation-settings: 'FILL' 1;">hexagon</span>
<h1 class="font-headline-h2 text-headline-h2 font-bold text-on-surface dark:text-on-surface">Ongoing Call</h1>
</div>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>

<span class="material-symbols-outlined text-success text-[14px]" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-tiny text-label-tiny text-success uppercase tracking-wider">Secure Line / AES-256</span>
</div>
<!-- Caller Info & Avatar -->
<div class="relative flex flex-col items-center mb-16">
<!-- Pulsing Animation Rings -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[160px] h-[160px] bg-tertiary/20 rounded-full pulse-ring" style="animation-delay: 0s;"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[160px] h-[160px] bg-tertiary/20 rounded-full pulse-ring" style="animation-delay: 1s;"></div>

<div class="mt-4 font-headline-h1 text-headline-h1 text-tertiary font-mono tracking-widest">
                02<span class="time-colon">:</span>45
            </div>
</div>

<div class="grid grid-cols-3 gap-6 w-full place-items-center">
<!-- Mute -->
<button class="flex flex-col items-center gap-2 group">
<div class="w-[64px] h-[64px] rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center transition-colors active:scale-95 group-hover:bg-surface-variant">
<span class="material-symbols-outlined text-on-surface text-3xl" data-icon="mic_off">mic_off</span>
</div>
<span class="font-label-tiny text-label-tiny text-on-surface-variant">Mute</span>
</button>
<!-- Keypad -->

<div class="w-[64px] h-[64px] rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center transition-colors active:scale-95 group-hover:bg-surface-variant">
<span class="material-symbols-outlined text-on-surface text-3xl" data-icon="dialpad">dialpad</span>
</div>
<span class="font-label-tiny text-label-tiny text-on-surface-variant">Keypad</span>
</button>

</div>
<span class="font-label-tiny text-label-tiny text-on-surface-variant">Speaker</span>
</button>

<button class="flex flex-col items-center gap-2 group col-start-2">
<div class="w-[64px] h-[64px] rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center transition-colors active:scale-95 group-hover:bg-surface-variant">
<span class="material-symbols-outlined text-on-surface text-3xl" data-icon="person_add">person_add</span>
</div>
<span class="font-label-tiny text-label-tiny text-on-surface-variant">Add Call</span>
</button>
</div>

<div class="mt-4 w-full flex justify-center">
<button class="w-[88px] h-[88px] rounded-full bg-danger flex items-center justify-center shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined text-concrete-white text-4xl" data-icon="call_end" style="font-variation-settings: 'FILL' 1;">call_end</span>

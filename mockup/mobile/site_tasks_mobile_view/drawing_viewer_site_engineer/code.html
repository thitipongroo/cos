<script>
        // Micro-interactions for the canvas
        const canvas = document.getElementById('drawingCanvas');
        const zoomTarget = document.getElementById('zoomTarget');
        let scale = 1;
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.pageX - translateX;
            startY = e.pageY - translateY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            translateX = e.pageX - startX;
            translateY = e.pageY - startY;
            zoomTarget.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            scale = Math.min(Math.max(.5, scale + delta), 4);
            zoomTarget.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        });

        // Touch support for mobile
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].pageX - translateX;
                startY = e.touches[0].pageY - translateY;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length > 1) return;
            translateX = e.touches[0].pageX - startX;
            translateY = e.touches[0].pageY - startY;
            zoomTarget.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });

        // BIM Toggle logic
        const bimBtn = document.querySelector('button .w-8.h-4');
        let bimActive = false;
        bimBtn.parentElement.addEventListener('click', () => {
            bimActive = !bimActive;
            const dot = bimBtn.querySelector('.w-2.h-2');
            if (bimActive) {
                dot.style.left = '20px';
                bimBtn.classList.replace('bg-outline-variant', 'bg-cos-cyan');
            } else {
                dot.style.left = '4px';
                bimBtn.classList.replace('bg-cos-cyan', 'bg-outline-variant');
            }
        });
    </script>

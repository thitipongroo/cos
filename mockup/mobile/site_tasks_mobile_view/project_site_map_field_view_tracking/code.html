<body class="bg-surface-dim text-on-surface font-mobile-text-body text-mobile-text-body overflow-hidden h-screen w-screen flex flex-col">
<!-- Top App Bar (From Shared Components) -->
<header class="flex items-center justify-between px-web-space-4 w-full h-mobile-touch-target bg-surface-dim dark:bg-surface-dim z-50">

</button>
</header>
<!-- Main Map Canvas -->
<main class="relative flex-1 overflow-hidden bg-cos-navy">
<!-- Interactive Map Background -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="A high-resolution satellite view of a massive construction site at dusk, featuring complex grid overlays and glowing architectural blueprints. The scene is rendered in a dark, tech-focused aesthetic with deep blue and charcoal tones. Sparse orange lights from the site and vibrant cyan lines demarcating structural sectors A, B, and C create a high-contrast, professional GIS interface feel. The overall mood is precise, authoritative, and technologically advanced." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAUNPlH8UK4aEbE934Tm-oap0we8QtSg6VpwUCCnyqJOuJ25X8ArlTjjHskY8PfyBVTrZYmHKurQPt14N4Hv0x_vu1jmCxI6_QMakW8SDAqG1ZLkUYXRDVbATclnF6yMpbvK5jaAGy5RhyjSWe_JBHcWTEn57-ohHhI7cfdQX3g2HckiwMOq9cXygX7Ce6WwLl-1zliImbrwVS8uybGScxG31wLND1LzwTng6JjiNlW27WjkQhjozKl6DOgws0Sae_YYSber_68p4g')">

<svg class="absolute inset-0 w-full h-full opacity-60 pointer-events-none" viewbox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
<!-- Sector A -->
<path d="M50,100 L200,150 L180,300 L30,250 Z" fill="rgba(6, 182, 212, 0.1)" stroke="#06B6D4" stroke-dasharray="4 2" stroke-width="2"></path>
<text class="font-bold text-[10px]" fill="#06B6D4" x="70" y="180">SECTOR A</text>
<!-- Sector B -->
<path d="M220,160 L370,140 L380,450 L210,480 Z" fill="rgba(6, 182, 212, 0.05)" stroke="#06B6D4" stroke-width="1.5"></path>
<text class="font-bold text-[10px]" fill="#06B6D4" x="260" y="300">SECTOR B</text>
<!-- Sector C -->
<path d="M40,320 L190,310 L160,550 L20,530 Z" fill="rgba(6, 182, 212, 0.08)" stroke="#06B6D4" stroke-dasharray="8 4" stroke-width="1.5"></path>
<text class="font-bold text-[10px]" fill="#06B6D4" x="60" y="440">SECTOR C</text>
</svg>
</div>
<!-- Fog of War / UI Depth Overlays -->
<div class="absolute inset-0 map-gradient-overlay z-10"></div>
<!-- Search Bar Floating -->
<div class="absolute top-web-space-4 left-mobile-edge right-mobile-edge z-20">
<div class="flex items-center bg-surface-container-high rounded-lg h-12 px-4 shadow-xl border border-outline-variant/30">

</div>

</div>

</div>
</div>
</div>

</div>

<div class="flex flex-col bg-surface-container-highest rounded-lg shadow-lg border border-outline-variant/30 overflow-hidden">
<button class="w-12 h-12 flex items-center justify-center text-on-surface border-b border-outline-variant/30 active:bg-surface-bright transition-colors">

</button>

<span class="material-symbols-outlined">person</span>
<span class="font-mobile-text-label text-mobile-text-label">Profile</span>
</div>
</nav>
<!-- Floating AI Prompt Component (Contextual FAB) - Suppressed per rule since this is a "Detail/Utility" view, but added a mini AI assist trigger for high-density GIS -->
<div class="fixed bottom-24 right-mobile-edge z-40">
<button class="w-14 h-14 bg-surface-container-highest border border-cos-cyan/30 text-cos-cyan rounded-full flex items-center justify-center shadow-2xl active:scale-90 transition-transform">
<span class="material-symbols-outlined filled-icon text-[30px]">smart_toy</span>
</button>
</div>
<script>
        // Simple touch interaction feedback
        document.querySelectorAll('button, .cursor-pointer').forEach(el => {
            el.addEventListener('touchstart', () => {
                el.classList.add('opacity-70');
            });
            el.addEventListener('touchend', () => {
                el.classList.remove('opacity-70');
            });
        });

        // Layer toggle logic (visual only)
        const layerBtn = document.querySelector('button .material-symbols-outlined[innerText="layers"]')?.parentElement;
        if(layerBtn) {
            layerBtn.addEventListener('click', () => {
                alert('Toggling Map Layers: Satellite / Blueprint Overlay / Terrain');
            });
        }
    </script>

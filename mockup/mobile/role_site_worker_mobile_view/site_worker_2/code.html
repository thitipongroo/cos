<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-surface-variant flex items-center justify-between px-mobile-edge h-mobile-touch-target">
<div class="flex items-center gap-3">

</div>
<h1 class="font-web-text-h2 text-web-text-h2 text-cos-blue dark:text-primary uppercase tracking-tight">รายงานปัญหาด่วน - Site Worker</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-surface-variant/10 transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface-variant dark:text-outline" data-icon="close">close</span>
</button>
</header>
<main class="mt-mobile-touch-target pt-4 px-mobile-edge space-y-6">
<!-- PhotoCapture Area -->
<section class="relative group">
<div id="viewfinder" class="w-full aspect-[4/3] bg-surface-container-lowest rounded-xl overflow-hidden border border-outline-variant relative flex flex-col items-center justify-center overflow-hidden">

<!-- Viewfinder Overlays -->
<div class="absolute inset-4 border border-white/20 pointer-events-none rounded-lg"></div>
<div class="absolute top-4 right-4 bg-black/50 backdrop-blur-md px-3 py-1 rounded-full flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-mobile-success animate-pulse"></div>
<span class="text-web-text-tiny uppercase text-white">Live Feed</span>
</div>
<!-- Shutter Trigger Overlay -->
<button class="absolute bottom-6 w-16 h-16 rounded-full border-4 border-white flex items-center justify-center active:scale-90 transition-transform" onclick="takePhoto()">
<div class="w-12 h-12 bg-white rounded-full"></div>
</button>
<!-- AI Hint -->
<div class="absolute bottom-6 left-6 right-6 pointer-events-none">
<div class="bg-cos-navy/80 backdrop-blur-sm border-l-2 border-cos-cyan p-2 text-web-text-tiny text-cos-cyan flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]" data-icon="auto_awesome">auto_awesome</span>
<span class="">AI Suggestion: Safety Issue detected in frame</span>
</div>
</div>
</div>
<p class="text-web-text-tiny text-outline mt-2 text-center">Tap shutter to capture photo</p>
</section>
<!-- Quick Category Selection -->
<section class="space-y-3">
<label class="font-mobile-text-label text-mobile-text-label text-outline uppercase tracking-wider block">Category / ประเภทปัญหา</label>
<div class="grid grid-cols-2 gap-3">
<button class="category-chip active flex items-center gap-3 p-4 bg-surface-container border border-outline-variant rounded-xl transition-all active:scale-95" onclick="selectCategory(this)">
<span class="material-symbols-outlined text-mobile-danger" data-icon="health_and_safety">health_and_safety</span>
<span class="font-mobile-text-label text-mobile-text-label">Safety</span>
</button>
<button class="category-chip flex items-center gap-3 p-4 bg-surface-container border border-outline-variant rounded-xl transition-all active:scale-95" onclick="selectCategory(this)">
<span class="material-symbols-outlined text-mobile-warning" data-icon="inventory_2">inventory_2</span>
<span class="font-mobile-text-label text-mobile-text-label">Material</span>
</button>
<button class="category-chip flex items-center gap-3 p-4 bg-surface-container border border-outline-variant rounded-xl transition-all active:scale-95" onclick="selectCategory(this)">
<span class="material-symbols-outlined text-cos-blue" data-icon="construction">construction</span>
<span class="font-mobile-text-label text-mobile-text-label">Technical</span>
</button>
<button class="category-chip flex items-center gap-3 p-4 bg-surface-container border border-outline-variant rounded-xl transition-all active:scale-95" onclick="selectCategory(this)">
<span class="material-symbols-outlined text-sync-pending" data-icon="block">block</span>
<span class="font-mobile-text-label text-mobile-text-label">Blocker</span>
</button>
</div>
</section>
<!-- Voice Note Button -->
<section class="space-y-3">
<label class="font-mobile-text-label text-mobile-text-label text-outline uppercase tracking-wider block">Voice Note / บันทึกเสียง</label>
<div class="relative flex flex-col items-center gap-4 py-4 bg-surface-container-low rounded-xl border border-dashed border-outline-variant">
<button class="w-20 h-20 bg-mobile-primary rounded-full flex items-center justify-center text-white shadow-lg active:scale-95 transition-all touch-none" id="voiceBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchend="stopRecording()" ontouchstart="startRecording()">
<span class="material-symbols-outlined text-4xl" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<p class="font-mobile-text-body text-mobile-text-body text-center px-6">กดค้างเพื่อบันทึกเสียงอธิบายปัญหา</p>
<div class="hidden flex items-center gap-1" id="recordingWave">
<div class="w-1 h-4 bg-cos-cyan rounded-full animate-bounce"></div>
<div class="w-1 h-8 bg-cos-cyan rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
<div class="w-1 h-6 bg-cos-cyan rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
<div class="w-1 h-10 bg-cos-cyan rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
<div class="w-1 h-5 bg-cos-cyan rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
</div>
</div>
</section>
<!-- Text Description -->
<section class="space-y-3">
<label class="font-mobile-text-label text-mobile-text-label text-outline uppercase tracking-wider block">Description / รายละเอียดเพิ่มเติม</label>
<textarea class="w-full h-24 bg-surface-container-high border border-outline-variant rounded-xl p-4 text-on-surface focus:border-cos-blue focus:ring-1 focus:ring-cos-blue outline-none transition-all resize-none font-mobile-text-body text-mobile-text-body" placeholder="ระบุรายละเอียดเพิ่มเติมที่นี่ (ไม่บังคับ)..."></textarea>

<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<span class="font-mobile-text-label text-mobile-text-label">Tasks</span>
</a>
<a class="flex flex-col items-center justify-center text-cos-blue dark:text-secondary-fixed bg-primary-container/10 rounded-xl px-3 py-1 transition-all active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="report_problem" style="font-variation-settings: 'FILL' 1;">report_problem</span>
<span class="font-mobile-text-label text-mobile-text-label">Issues</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-variant/20 transition-all active:scale-95 px-3 py-1" href="#">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-mobile-text-label text-mobile-text-label">Reports</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-variant/20 transition-all active:scale-95 px-3 py-1" href="#">
<span class="material-symbols-outlined" data-icon="health_and_safety">health_and_safety</span>
<span class="font-mobile-text-label text-mobile-text-label">Safety</span>
</a>
</nav>
<script>
        function selectCategory(btn) {
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
        }

        function takePhoto() {
            const viewfinder = document.getElementById('viewfinder');
            viewfinder.classList.add('shutter-effect');
            setTimeout(() => viewfinder.classList.remove('shutter-effect'), 300);
            
            // Haptic feedback (if available)
            if (window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        }

        function startRecording() {
            const btn = document.getElementById('voiceBtn');
            const wave = document.getElementById('recordingWave');
            btn.classList.add('recording-pulse', 'bg-mobile-danger');
            wave.classList.remove('hidden');
            if (window.navigator.vibrate) {
                window.navigator.vibrate([10, 30, 10]);
            }
        }

        function stopRecording() {
            const btn = document.getElementById('voiceBtn');
            const wave = document.getElementById('recordingWave');
            btn.classList.remove('recording-pulse', 'bg-mobile-danger');
            wave.classList.add('hidden');
            if (window.navigator.vibrate) {
                window.navigator.vibrate(20);
            }
        }

        // Prevent context menu on long press for voice button
        document.getElementById('voiceBtn').addEventListener('contextmenu', e => e.preventDefault());
    </script>

</body></html>

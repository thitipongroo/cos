<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Material Request | SiteOps</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        body {
            font-family: 'Inter Tight', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Technical Grid Background Pattern */
        .tech-grid {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: inset 0 0 0 1px #2563eb;
        }
        /* Mobile scroll behavior */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "background": "#031427",
                      "surface-container-highest": "#26364a",
                      "inverse-primary": "#0053db",
                      "surface-bright": "#2a3a4f",
                      "error-container": "#93000a",
                      "dark-surface": "#0F172A",
                      "primary": "#b4c5ff",
                      "on-tertiary-container": "#eeefff",
                      "cos-blue": "#2563EB",
                      "mobile-danger": "#FF3B30",
                      "surface-container-high": "#1b2b3f",
                      "secondary-container": "#03b5d3",
                      "cos-white": "#F8FAFC",
                      "primary-container": "#2563eb",
                      "inverse-surface": "#d3e4fe",
                      "on-background": "#d3e4fe",
                      "on-surface-variant": "#c3c6d7",
                      "on-tertiary": "#2b3041",
                      "tertiary-fixed-dim": "#c1c5dc",
                      "on-tertiary-fixed": "#161b2b",
                      "sync-active": "#FFD60A",
                      "on-primary": "#002a78",
                      "on-error": "#690005",
                      "on-secondary": "#003640",
                      "primary-fixed": "#dbe1ff",
                      "on-secondary-container": "#00424e",
                      "secondary-fixed-dim": "#4cd7f6",
                      "secondary-fixed": "#acedff",
                      "inverse-on-surface": "#213145",
                      "on-surface": "#d3e4fe",
                      "cos-cyan": "#06B6D4",
                      "outline": "#8d90a0",
                      "secondary": "#4cd7f6",
                      "on-primary-fixed": "#00174b",
                      "mobile-primary": "#0066FF",
                      "sync-pending": "#94A3B8",
                      "error": "#ffb4ab",
                      "on-error-container": "#ffdad6",
                      "mobile-success": "#00C853",
                      "primary-fixed-dim": "#b4c5ff",
                      "surface": "#031427",
                      "surface-tint": "#b4c5ff",
                      "dark-bg": "#020617",
                      "on-secondary-fixed": "#001f26",
                      "tertiary": "#c1c5dc",
                      "surface-container-lowest": "#000f21",
                      "on-primary-container": "#eeefff",
                      "surface-dim": "#031427",
                      "on-primary-fixed-variant": "#003ea8",
                      "surface-container-low": "#0b1c30",
                      "tertiary-fixed": "#dee1f9",
                      "on-secondary-fixed-variant": "#004e5c",
                      "tertiary-container": "#686c80",
                      "surface-container": "#102034",
                      "outline-variant": "#434655",
                      "surface-variant": "#26364a",
                      "on-tertiary-fixed-variant": "#414658",
                      "mobile-warning": "#FF9500",
                      "cos-navy": "#0B1020"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "mobile-edge": "24px",
                      "web-space-4": "16px",
                      "web-space-3": "12px",
                      "web-space-1": "4px",
                      "web-space-8": "32px",
                      "web-space-2": "8px",
                      "web-base": "4px",
                      "mobile-touch-target": "52px"
              },
              "fontFamily": {
                      "mobile-text-hero": ["Inter Tight"],
                      "mobile-text-label": ["Inter Tight"],
                      "mobile-text-body": ["Inter Tight"]
              },
              "fontSize": {
                      "mobile-text-hero": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                      "mobile-text-label": ["13px", {"lineHeight": "18px", "fontWeight": "600"}],
                      "mobile-text-body": ["17px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-dark-bg text-on-surface tech-grid min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-dark-surface flex justify-between items-center px-mobile-edge h-mobile-touch-target">
<div class="flex items-center gap-4">
<button class="transition-colors duration-200 active:opacity-70">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<h1 class="font-mobile-text-label text-mobile-text-label uppercase tracking-widest text-primary">Material Request</h1>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-surface-container-high border border-outline-variant/30">
<span class="w-1.5 h-1.5 rounded-full bg-mobile-success"></span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Synced</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</div>
</header>
<main class="pt-20 px-mobile-edge space-y-6">
<!-- Project Info -->
<section class="bg-surface-container-low border-l-4 border-cos-blue p-4 rounded-r-xl">
<div class="flex flex-col gap-1">
<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Project Context</span>
<div class="flex justify-between items-center">
<p class="font-mobile-text-label text-mobile-text-body text-white">Skyline Tower A</p>
<span class="text-xs font-medium text-cos-cyan bg-cos-cyan/10 px-2 py-0.5 rounded">Sector B-12</span>
</div>
</div>
</section>
<!-- Search & Add Section -->
<section class="space-y-3">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full h-mobile-touch-target pl-12 pr-4 bg-surface-container-high border border-outline-variant rounded-xl font-mobile-text-label text-white placeholder:text-on-surface-variant/50" placeholder="Search Master BOQ (Rebar, Cement...)" type="text">
</div>
</section>
<!-- Requested Items List -->
<section class="space-y-4">
<div class="flex justify-between items-end">
<h2 class="font-mobile-text-label text-mobile-text-label uppercase text-on-surface-variant tracking-widest">Requested Items (2)</h2>
<button class="text-cos-blue font-bold text-xs uppercase tracking-tight">+ Add Manual</button>
</div>
<!-- Item Card 1 -->
<div class="bg-surface-container rounded-xl overflow-hidden border border-outline-variant/50">
<div class="p-4 space-y-4">
<div class="flex justify-between items-start">
<div class="space-y-0.5">
<h3 class="font-mobile-text-label text-mobile-text-body text-white">Rebar 12mm High-tensile Steel</h3>
<p class="text-xs text-on-surface-variant">Code: MT-ST-12-HT</p>
</div>
<button class="text-on-surface-variant active:text-mobile-danger transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="text-[11px] font-bold text-on-surface-variant uppercase">Quantity (Tons)</label>
<input class="w-full h-11 bg-surface-container-highest border border-outline-variant rounded-lg text-white font-bold px-3" type="number" value="12.5">
</div>
<div class="space-y-1.5">
<label class="text-[11px] font-bold text-on-surface-variant uppercase">Required Date</label>
<div class="relative">
<input class="w-full h-11 bg-surface-container-highest border border-outline-variant rounded-lg text-white text-sm px-3 appearance-none" type="date" value="2023-11-24">
</div>
</div>
</div>
</div>
</div>
<!-- Item Card 2 -->
<div class="bg-surface-container rounded-xl overflow-hidden border border-outline-variant/50">
<div class="p-4 space-y-4">
<div class="flex justify-between items-start">
<div class="space-y-0.5">
<h3 class="font-mobile-text-label text-mobile-text-body text-white">Portland Cement Type 1</h3>
<p class="text-xs text-on-surface-variant">Code: MT-CM-P1</p>
</div>
<button class="text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="text-[11px] font-bold text-on-surface-variant uppercase">Quantity (Bags)</label>
<input class="w-full h-11 bg-surface-container-highest border border-outline-variant rounded-lg text-white font-bold px-3" placeholder="0" type="number">
</div>
<div class="space-y-1.5">
<label class="text-[11px] font-bold text-on-surface-variant uppercase">Required Date</label>
<input class="w-full h-11 bg-surface-container-highest border border-outline-variant rounded-lg text-white text-sm px-3" type="date">
</div>
</div>
</div>
</div>
</section>
<!-- Urgency Toggle -->
<section class="bg-surface-container-high rounded-xl p-4 flex items-center justify-between border border-outline-variant/50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-mobile-warning">priority_high</span>
<div>
<p class="font-mobile-text-label text-white">Urgent Request</p>
<p class="text-[11px] text-on-surface-variant leading-none">Flag for rapid procurement</p>
</div>
</div>
<button class="w-14 h-8 bg-surface-container-highest rounded-full p-1 relative transition-colors duration-300" id="urgency-toggle" onclick="toggleUrgency()">
<div class="w-6 h-6 bg-on-surface-variant rounded-full transition-transform duration-300" id="toggle-thumb"></div>
</button>
</section>
<!-- Notes / AI Assist -->
<section class="space-y-3">
<div class="flex justify-between items-center">
<label class="text-[11px] font-bold text-on-surface-variant uppercase">Notes / Reason for request</label>
<button class="flex items-center gap-1.5 px-3 py-1 bg-cos-cyan/10 border border-cos-cyan/30 rounded-full transition-all active:scale-95">
<span class="material-symbols-outlined text-cos-cyan text-[16px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="text-[10px] font-bold text-cos-cyan uppercase tracking-tighter">AI Assist</span>
</button>
</div>
<div class="relative bg-surface-container-low border-l-2 border-cos-cyan/40 rounded-r-xl overflow-hidden">
<textarea class="w-full bg-transparent border-none p-4 text-sm text-white placeholder:text-on-surface-variant/40 resize-none" placeholder="Explain the reason for this procurement..." rows="3"></textarea>
</div>
</section>
<!-- Attachment Spacer -->
<div class="flex items-center justify-center border-2 border-dashed border-outline-variant/30 rounded-xl py-6 bg-surface-container-lowest/30">
<div class="flex flex-col items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined">add_a_photo</span>
<span class="text-xs font-bold uppercase tracking-widest">Attach Field Photo</span>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-dark-surface p-6 pb-8 border-t border-outline-variant/20 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<button class="w-full h-mobile-touch-target bg-cos-blue text-white rounded-xl font-mobile-text-label text-mobile-text-label uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg shadow-cos-blue/20 active:scale-[0.98] transition-transform">
<span>Submit Request</span>
<span class="material-symbols-outlined">send</span>
</button>
</div>
<!-- Micro-interactions Script -->
<script>
        let isUrgent = false;
        function toggleUrgency() {
            isUrgent = !isUrgent;
            const toggle = document.getElementById('urgency-toggle');
            const thumb = document.getElementById('toggle-thumb');
            
            if (isUrgent) {
                toggle.classList.remove('bg-surface-container-highest');
                toggle.classList.add('bg-mobile-warning');
                thumb.classList.add('translate-x-6');
                thumb.classList.remove('bg-on-surface-variant');
                thumb.classList.add('bg-white');
            } else {
                toggle.classList.add('bg-surface-container-highest');
                toggle.classList.remove('bg-mobile-warning');
                thumb.classList.remove('translate-x-6');
                thumb.classList.add('bg-on-surface-variant');
                thumb.classList.remove('bg-white');
            }
        }

        // Haptic-like feedback simulation
        document.querySelectorAll('button, input').forEach(el => {
            el.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(5);
                }
            });
        });
    </script>
</body></html>

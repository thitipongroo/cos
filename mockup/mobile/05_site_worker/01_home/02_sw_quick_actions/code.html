<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Quick Action Menu</title>

                        "sync-pending": "#94A3B8",

                        "on-tertiary": "#2b3041",
                        "on-primary-container": "#eeefff",

                        "surface-container": "#102034",
                        "primary-fixed": "#dbe1ff",
                        "inverse-primary": "#0053db",
                        "inverse-surface": "#d3e4fe",
                        "primary": "#b4c5ff",
                        "on-surface": "#d3e4fe",
                        "on-tertiary-fixed": "#161b2b",
                        "tertiary-container": "#686c80",
                        "background": "#031427",
                        "mobile-danger": "#FF3B30",
                        "error": "#ffb4ab",
                        "sync-active": "#FFD60A",
                        "on-primary-fixed": "#00174b",
                        "outline-variant": "#434655",
                        "surface-container-low": "#0b1c30",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target": "52px",
                        "web-margin": "32px",
                        "space-1": "4px",
                        "space-3": "12px",
                        "space-4": "16px",
                        "space-2": "8px",
                        "base": "4px",
                        "edge-mobile": "24px"
                    },
                    "fontFamily": {

                        "label-mobile": ["Inter Tight", "sans-serif"],
                        "body-mobile": ["Inter Tight", "sans-serif"],

                        "h2-web": ["Inter Tight", "sans-serif"],

                    },
                    "fontSize": {
                        "tiny-web": ["11px", { "lineHeight": "12px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "label-mobile": ["13px", { "lineHeight": "18px", "fontWeight": "600" }],
                        "body-mobile": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-web": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],

<style>
    body {
      min-height: max(884px, 100dvh);
      font-family: 'Inter Tight', sans-serif;
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col bg-background text-on-surface">
<!-- TopAppBar -->
<header class="w-full top-0 bg-surface flex items-center px-edge-mobile h-touch-target z-50 sticky border-b border-outline-variant/10">
<button aria-label="Close" class="hover:bg-surface-bright scale-95 transition-transform p-space-2 rounded-full mr-space-4">
<span class="material-symbols-outlined text-primary font-[300]" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="flex-1">
<h1 class="font-h1-web text-h1-web-mobile text-primary tracking-tight font-extrabold">Quick Actions</h1>
<div class="flex items-center gap-space-1 mt-0.5">
  <span class="text-tiny-web font-tiny-web text-on-surface-variant tracking-widest uppercase opacity-80">Project:</span>
  <span class="text-tiny-web font-tiny-web text-primary font-extrabold tracking-wider uppercase">Skyline Tower A</span>
</div></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-edge-mobile py-space-4 gap-space-4 mb-[90px]">
<div class="mb-space-4">
<h2 class="font-h2-web text-h2-web text-on-surface mb-space-1">เมนูด่วน</h2>
<p class="font-body-mobile text-body-mobile text-on-surface-variant">Select an action to proceed.</p>
</div>
<!-- Action Card 1: Report Issue -->
<button class="w-full text-left bg-surface-container hover:bg-surface-variant transition-colors rounded-xl border border-outline-variant/20 p-space-4 flex items-start gap-space-4 shadow-lg active:scale-95 duration-200">
<div class="w-12 h-12 rounded-full bg-mobile-warning/20 flex items-center justify-center shrink-0 border border-mobile-warning/20">
<span class="material-symbols-outlined text-mobile-warning" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<div class="flex-1 flex flex-col justify-center min-h-[48px]">
<h3 class="font-label-mobile text-label-mobile text-on-surface mb-1">รายงานปัญหาด่วน</h3>
<p class="font-tiny-web text-tiny-web text-on-surface-variant normal-case tracking-normal">บันทึกปัญหาหรืออุปสรรคหน้างานทันที</p>
</div>
</button>
<!-- Action Card 2: Safety Checklist -->
<button class="w-full text-left bg-surface-container hover:bg-surface-variant transition-colors rounded-xl border border-outline-variant/20 p-space-4 flex items-start gap-space-4 shadow-lg active:scale-95 duration-200">
<div class="w-12 h-12 rounded-full bg-mobile-success/20 flex items-center justify-center shrink-0 border border-mobile-success/20">
<span class="material-symbols-outlined text-mobile-success" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
</div>
<div class="flex-1 flex flex-col justify-center min-h-[48px]">
<h3 class="font-label-mobile text-label-mobile text-on-surface mb-1">เช็คลิสต์ความปลอดภัย</h3>
<p class="font-tiny-web text-tiny-web text-on-surface-variant normal-case tracking-normal">ตรวจสอบความปลอดภัยก่อนเริ่มงาน</p>
</div>
</button>
<!-- Action Card 3: Log Activity -->
<button class="w-full text-left bg-surface-container hover:bg-surface-variant transition-colors rounded-xl border border-outline-variant/20 p-space-4 flex items-start gap-space-4 shadow-lg active:scale-95 duration-200">
<div class="w-12 h-12 rounded-full bg-mobile-primary/20 flex items-center justify-center shrink-0 border border-mobile-primary/20">
<span class="material-symbols-outlined text-mobile-primary" style="font-variation-settings: 'FILL' 1;">edit_document</span>
</div>
<div class="flex-1 flex flex-col justify-center min-h-[48px]">
<h3 class="font-label-mobile text-label-mobile text-on-surface mb-1">บันทึกกิจกรรมประจำวัน</h3>
<p class="font-tiny-web text-tiny-web text-on-surface-variant normal-case tracking-normal">สรุปผลงานและรายงานแรงงาน</p>
</div>
</button>
</main>
<!-- BottomNavBar -->
<!-- Note: While Quick Actions is technically a transactional overlay in many apps, the prompt explicitly requested "The Bottom Navigation for Site Worker should be visible." -->
<nav class="md:hidden fixed bottom-0 w-full z-50 pb-safe bg-surface-container-low border-t border-outline-variant/20 shadow-lg font-label-mobile text-label-mobile flex justify-around items-center px-4 h-[72px]">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant hover:text-on-surface scale-95 duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">dashboard</span>
<span class="">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant hover:text-on-surface scale-95 duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">assignment</span>
<span class="">Tasks</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant hover:text-on-surface scale-95 duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="">Log</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant hover:text-on-surface scale-95 duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="">Profile</span>
</a>
</nav>


</body></html>

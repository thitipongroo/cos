<script>
        function selectCategory(btn) {
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
        }

        function takePhoto() {
            const viewfinder = document.getElementById('viewfinder');
            viewfinder.classList.add('shutter-effect');
            setTimeout(() => viewfinder.classList.remove('shutter-effect'), 300);
            
            // Haptic feedback (if available)
            if (window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        }

        function startRecording() {
            const btn = document.getElementById('voiceBtn');
            const wave = document.getElementById('recordingWave');
            btn.classList.add('recording-pulse', 'bg-mobile-danger');
            wave.classList.remove('hidden');
            if (window.navigator.vibrate) {
                window.navigator.vibrate([10, 30, 10]);
            }
        }

        function stopRecording() {
            const btn = document.getElementById('voiceBtn');
            const wave = document.getElementById('recordingWave');
            btn.classList.remove('recording-pulse', 'bg-mobile-danger');
            wave.classList.add('hidden');
            if (window.navigator.vibrate) {
                window.navigator.vibrate(20);
            }
        }

        // Prevent context menu on long press for voice button
        document.getElementById('voiceBtn').addEventListener('contextmenu', e => e.preventDefault());
    </script>

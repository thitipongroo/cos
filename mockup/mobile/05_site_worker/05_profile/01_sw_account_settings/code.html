<script>
        // Simple toggle interactivity for demonstration
        document.querySelectorAll('input[type="checkbox"]').forEach(toggle => {
            toggle.addEventListener('change', function() {
                if(this.checked) {
                    this.style.transform = 'translateX(100%)';
                    this.nextElementSibling.classList.replace('bg-surface-variant', 'bg-primary-container');
                } else {
                    this.style.transform = 'translateX(0)';
                    this.nextElementSibling.classList.replace('bg-primary-container', 'bg-surface-variant');
                }
            });
        });
    </script>

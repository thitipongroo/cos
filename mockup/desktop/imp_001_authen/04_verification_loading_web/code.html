<style>

        .shimmer {

            50% { opacity: 0.8; transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.4)); }
        }

        .progress-fill {
            width: 0%;
            animation: progress-load 5s ease-in-out forwards;

        @keyframes progress-load {
            0% { width: 0%; }
            20% { width: 15%; }
            45% { width: 42%; }
            70% { width: 78%; }
            100% { width: 92%; }
        }

<script>
        // Micro-interaction for percentage increment
        const percentageEl = document.getElementById('percentage');
        let progress = 0;
        
        const updateProgress = () => {
            if (progress < 92) {
                // Mimic irregular loading speeds
                const increment = Math.random() > 0.8 ? Math.floor(Math.random() * 5) + 1 : 1;
                progress = Math.min(92, progress + increment);
                percentageEl.textContent = `${progress}%`;
                
                const nextTick = Math.random() * 150 + 50;
                setTimeout(updateProgress, nextTick);
            }
        };

        // Start after a short delay
        setTimeout(updateProgress, 500);

        // Vanilla mouse parallax effect for the glow
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.bg-cos-blue\\/5');
            const x = (e.clientX / window.innerWidth - 0.5) * 40;
            const y = (e.clientY / window.innerHeight - 0.5) * 40;
            glow.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        });
    </script>

# MLflow Tracking Server — local development / CI
# Production: see infrastructure/kubernetes/mlflow/deployment.yaml
# Backend store: PostgreSQL (existing RDS)
# Artifact store: MinIO (existing S3-compatible)

version: '3.9'

services:
  mlflow:
    # MLflow 3.x — master §Phase 23 pins the MAJOR ("MLflow 3.x — experiment tracking and model
    # registry", bumped 2.x→3.x by product-owner decision 2026-06-30), and requirements-mlflow.txt
    # pins the client at 3.17.2 (3.14.0 until 2026-11-11, D34 — this image moved with it). The server
    # image was once v2.14.1: a 3.x client against a 2.x tracking server, which is both a version skew
    # across the model-registry API and a silent contradiction of the recorded decision.
    # The `-full` variant (D35, 2026-11-11): the plain image has neither psycopg2 nor boto3, and against the
    # postgres service below it exits with "No module named 'psycopg2'" (measured on v3.14.0 and v3.17.2).
    # SCHEMA: 3.17.2 migrated a 3.14.0 store itself on start (measured) — only because it adds tables; a
    # version that adds none refuses an out-of-date store until `mlflow db upgrade` runs. Check before each
    # bump, and back up the mlflow_pg_data volume. --allowed-hosts: without it the API answers only
    # localhost / private-IP Host headers (another container calling mlflow:5000 got 403, measured); the
    # list replaces that default, so private-IP Hosts are refused too.
    image: ghcr.io/mlflow/mlflow:v3.17.2-full
    container_name: cos-mlflow
    ports:
      - '5000:5000'
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASS:-mlflow}@postgres:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: s3://cos-mlflow-artifacts/
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
        --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASS:-mlflow}@postgres:5432/mlflow
        --artifacts-destination s3://cos-mlflow-artifacts/
        --host 0.0.0.0
        --port 5000
        --allowed-hosts 'mlflow:*,localhost:*,127.0.0.1:*'
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:16-alpine
    container_name: cos-mlflow-postgres
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASS:-mlflow}
    volumes:
      - mlflow_pg_data:/var/lib/postgresql/data

  minio:
    # quay.io, not Docker Hub: hub.docker.com's minio/minio repository returns 404 (measured 2026-09-14); quay.io serves the same tag.
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: cos-mlflow-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    # quay.io, not Docker Hub: hub.docker.com's minio/mc repository returns 404 (measured 2026-09-14); quay.io serves the same tag.
    image: quay.io/minio/mc:RELEASE.2024-01-16T16-06-34Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
        mc mb --ignore-existing local/cos-mlflow-artifacts;
        mc mb --ignore-existing local/cos-datalake;
      "

volumes:
  mlflow_pg_data:
  minio_data:

[pytest]
; CI runs `pytest mlops/tests/ -q` from the repo root. The tests import the mlops package itself
; (from mlops.airflow.dags..., mlops.models...), but mlops/ is a PEP 420 namespace package (no
; __init__.py) and pytest puts only the test file's own directory on sys.path — not the CWD — so
; `import mlops` fails with ModuleNotFoundError. pythonpath entries are resolved relative to this
; file's directory (rootdir = mlops/), so `..` = repo root, making `import mlops.*` resolvable
; for the tests AND for the DAG files loaded via DagBag in the same process. Requires pytest >= 7
; (requirements-dev.txt pins pytest 9.1.1).
pythonpath = ..
testpaths = tests
python_files = test_*.py
addopts = --tb=short

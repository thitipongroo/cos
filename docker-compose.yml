# Construction OS — Local Development Stack
#
# Two tiers (to fit lower-memory machines):
#   make docker-up        → essential infra only (postgres, pgbouncer, redis, kafka,
#                           schema-registry, minio) — ~1 GB, enough to boot the app.
#   make docker-up-full   → everything, incl. the `full` profile (opensearch, neo4j,
#                           clickhouse, clamav, keycloak, vault, temporal, UIs) — ~4 GB.
#
# Services tagged `profiles: ['full']` only start with docker-up-full. The app boots
# without them; features that need them (search, graph, analytics, virus scan, auth,
# workflows) degrade until you start the full profile.

name: construction-os

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  opensearch_data:
  neo4j_data:
  clickhouse_data:
  minio_data:
  vault_data:
  pgbouncer_config:
  keycloak_data:

networks:
  cos-network:
    driver: bridge

services:
  # ─── PostgreSQL 16 + TimescaleDB 2.x ─────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: cos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-construction_os}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cos} -d ${POSTGRES_DB:-construction_os}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cos-network

  # ─── PgBouncer (connection pooler — QM-18) ───────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: cos-pgbouncer
    environment:
      DB_USER: ${POSTGRES_USER:-cos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cos_dev_password}
      DB_HOST: postgres
      DB_PORT: 5432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      SERVER_IDLE_TIMEOUT: 600
      ADMIN_USERS: ${POSTGRES_USER:-cos}
      # PostgreSQL 16 stores SCRAM-SHA-256 verifiers; PgBouncer must use scram + a plaintext
      # userlist (mounted below) to auth to the server. Without this the image's auto-generated
      # md5 userlist fails server login with "wrong password type".
      AUTH_TYPE: scram-sha-256
    ports:
      - '${PGBOUNCER_PORT:-6432}:5432'
    volumes:
      - ./infrastructure/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cos-network

  # ─── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cos-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-cos_redis_password}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '${REDIS_PASSWORD:-cos_redis_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cos-network

  # ─── Apache Kafka 3.x (KRaft mode — no ZooKeeper) ────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cos-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 2160
      KAFKA_LOG_RETENTION_BYTES: -1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: h-CJFTy_TE2EQva8gyOGJA
    ports:
      - '${KAFKA_PORT:-29092}:29092'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9092']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cos-network

  # ─── Confluent Schema Registry ────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: cos-schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD_TRANSITIVE
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - '${SCHEMA_REGISTRY_PORT:-8081}:8081'
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8081/subjects || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cos-network

  # ─── OpenSearch 2.x (full-text + vector search) ───────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: cos-opensearch
    profiles: ['full']
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-Cos_Os_Dev_2024!}
      plugins.security.disabled: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '${OPENSEARCH_PORT:-9200}:9200'
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cos-network

  # ─── Neo4j 5.x (Knowledge Graph) ─────────────────────────────────────────
  neo4j:
    image: neo4j:5.19-community
    container_name: cos-neo4j
    profiles: ['full']
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cos_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - '${NEO4J_BOLT_PORT:-7687}:7687'
      - '${NEO4J_HTTP_PORT:-7474}:7474'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -O /dev/null -q http://localhost:7474 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - cos-network

  # ─── ClickHouse 24.x (Analytics OLAP) ────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: cos-clickhouse
    profiles: ['full']
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cos}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cos_ch_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '${CLICKHOUSE_HTTP_PORT:-8123}:8123'
      - '${CLICKHOUSE_NATIVE_PORT:-9000}:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ./infrastructure/clickhouse/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "clickhouse-client --password ${CLICKHOUSE_PASSWORD:-cos_ch_password} --query 'SELECT 1'",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - cos-network

  # ─── MinIO (S3-compatible object storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: cos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cos_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cos_minio_password}
    ports:
      - '${MINIO_PORT:-9100}:9000'
      - '${MINIO_CONSOLE_PORT:-9101}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - cos-network

  # ─── ClamAV (antivirus scanning — Phase 9 File Service) ──────────────────
  clamav:
    image: clamav/clamav:stable
    container_name: cos-clamav
    # clamav/clamav:stable publishes no linux/arm64 manifest — run the amd64
    # image under emulation (Rosetta) on Apple Silicon hosts.
    platform: linux/amd64
    profiles: ['full']
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 3 || exit 1']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s # ClamAV needs time to load virus definitions on first start
    networks:
      - cos-network

  # ─── HashiCorp Vault (dev mode — local secret injection) ──────────────────
  vault:
    image: hashicorp/vault:1.16
    container_name: cos-vault
    profiles: ['full']
    command: vault server -dev -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN:-cos-vault-root-token}
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-cos-vault-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    ports:
      - '${VAULT_PORT:-8200}:8200'
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "vault status -address=http://localhost:8200 | grep -q 'Initialized' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cos-network

  # ─── Temporal (Workflow Engine) ────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.0
    container_name: cos-temporal
    profiles: ['full']
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-cos}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-cos_dev_password}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/development.yaml
    ports:
      - '${TEMPORAL_PORT:-7233}:7233'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infrastructure/temporal/dynamicconfig:/etc/temporal/dynamicconfig:ro
    networks:
      - cos-network

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: cos-temporal-ui
    profiles: ['full']
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - '${TEMPORAL_UI_PORT:-8088}:8080'
    depends_on:
      - temporal
    networks:
      - cos-network

  # ─── Keycloak 24.x — Identity Provider (Phase 2) ─────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: cos-keycloak
    profiles: ['full']
    command: start-dev --import-realm
    environment:
      # Keycloak 24 uses KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD to create the initial
      # admin (KC_BOOTSTRAP_ADMIN_* is Keycloak 26+ syntax and is silently ignored here).
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-cos_keycloak_admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-construction_os}
      KC_DB_USERNAME: ${POSTGRES_USER:-cos}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-cos_dev_password}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_LOG_LEVEL: warn
    ports:
      - '${KEYCLOAK_PORT:-8090}:8080'
    volumes:
      - ./infrastructure/keycloak/realms:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080/health/ready || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - cos-network

  # ─── Kafka UI (dev convenience) ───────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cos-kafka-ui
    profiles: ['full']
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    ports:
      - '${KAFKA_UI_PORT:-8080}:8080'
    depends_on:
      - kafka
      - schema-registry
    networks:
      - cos-network

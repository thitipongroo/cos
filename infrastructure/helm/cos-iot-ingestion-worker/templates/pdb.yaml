{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cos-iot-ingestion-worker.fullname" . }}
  labels: {{ include "cos-iot-ingestion-worker.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{ include "cos-iot-ingestion-worker.selectorLabels" . | nindent 6 }}
{{- end }}

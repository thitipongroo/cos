replicaCount: 2
image:
  repository: ''
  tag: 'latest'
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  # 8090 — the port the binary listens on (cmd/analytics-worker: defaultHTTPPort), the Dockerfile's
  # EXPOSE, and the docker-compose healthcheck. This said 8080 while the binary defaulted to 8091 and
  # the chart never set PORT, so the liveness probe below hit a closed port and the pod could only
  # CrashLoopBackOff. main_test.go now fails if these drift apart again.
  port: 8090
  metricsPort: 9464
resources:
  requests:
    cpu: '200m'
    memory: '256Mi'
  limits:
    cpu: '1000m'
    memory: '1Gi'
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
env:
  # PORT must match service.port / the `http` containerPort and the probes below. Without it the
  # worker falls back to its own hardcoded default and nothing reaches it: the Service targetPort
  # resolves to a port no one listens on. Pinned so the listen port cannot drift. ADR-069.
  PORT: '8090'
  OTEL_SERVICE_NAME: 'analytics-worker'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
  # Served by internal/metrics; this is the port prometheus.yml scrapes and service.metricsPort
  # declares. Pinned for the same reason as PORT.
  PROMETHEUS_PORT: '9464'
envFrom:
  - secretRef:
      name: cos-analytics-worker-secrets
networkPolicy:
  # Off by default: these rules are schema-valid but have never been enforced in a live cluster.
  # Read templates/networkpolicy.yaml before turning this on — the caveats are specific.
  enabled: false
  # Pod label selector for the Prometheus that scrapes :9464.
  prometheusPodLabel: 'prometheus'
  # Node CIDRs allowed to reach the http port for kubelet httpGet probes. Empty emits no node rule,
  # which is correct only where the CNI already exempts probe traffic. Cluster-specific by nature.
  nodeCIDRs: []
serviceAccount:
  create: true
  name: 'cos-analytics-worker'
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cos-analytics-worker
          topologyKey: kubernetes.io/hostname
# Port must equal service.port and the PORT env above (main_test.go enforces this).
livenessProbe:
  httpGet:
    path: /health/live
    port: 8090
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health/live
    port: 8090
  initialDelaySeconds: 5
  periodSeconds: 5

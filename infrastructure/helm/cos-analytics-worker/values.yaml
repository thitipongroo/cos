replicaCount: 2
image:
  repository: ''
  tag: 'latest'
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
  metricsPort: 9464
resources:
  requests:
    cpu: '200m'
    memory: '256Mi'
  limits:
    cpu: '1000m'
    memory: '1Gi'
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
env:
  OTEL_SERVICE_NAME: 'analytics-worker'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
envFrom:
  - secretRef:
      name: cos-analytics-worker-secrets
serviceAccount:
  create: true
  name: 'cos-analytics-worker'
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cos-analytics-worker
          topologyKey: kubernetes.io/hostname
livenessProbe:
  httpGet:
    path: /health/live
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health/live
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

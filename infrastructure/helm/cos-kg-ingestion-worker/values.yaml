replicaCount: 2
image:
  repository: ''
  tag: 'latest'
  pullPolicy: IfNotPresent
service:
  # 8090 — the port the binary listens on (cmd/kg-ingestion-worker: defaultHTTPPort) and the
  # Dockerfile's EXPOSE. This said 8080, and the Deployment declared no `http` containerPort at all,
  # so the Service's `targetPort: http` resolved to nothing.
  port: 8090
  metricsPort: 9464
resources:
  requests:
    cpu: '200m'
    memory: '256Mi'
  limits:
    cpu: '1000m'
    memory: '1Gi'
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  minAvailable: 1
env:
  # PORT must match service.port / the `http` containerPort and the probes below. Without it the
  # worker falls back to its own hardcoded default and nothing reaches it: the Service targetPort
  # resolves to a port no one listens on. Pinned so the listen port cannot drift. ADR-021.
  PORT: '8090'
  OTEL_SERVICE_NAME: 'kg-ingestion-worker'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
  # Served by internal/metrics; this is the port prometheus.yml scrapes and service.metricsPort
  # declares. Pinned for the same reason as PORT.
  PROMETHEUS_PORT: '9464'
envFrom:
  - secretRef:
      name: cos-kg-ingestion-worker-secrets
networkPolicy:
  # Off by default: these rules are schema-valid but have never been enforced in a live cluster.
  # Read templates/networkpolicy.yaml before turning this on — the caveats are specific.
  enabled: false
  # Pod label selector for the Prometheus that scrapes :9464.
  prometheusPodLabel: 'prometheus'
serviceAccount:
  create: true
  name: 'cos-kg-ingestion-worker'
affinity:
  # master:4650-4654 — schedule onto the pool this workload is sized for. Terraform labels each
  # managed node group `workload=<pool>` (infrastructure/terraform/aws/modules/eks/modules).
  #
  # REQUIRED, not preferred: a "preferred" rule silently falls back to any node the moment the pool
  # is full or missing, which is the failure this exists to prevent — an AI service quietly running
  # on a t3.xlarge behaves, just slowly, and nothing reports it.
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workload
              operator: In
              values: ['app']
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cos-kg-ingestion-worker
          topologyKey: kubernetes.io/hostname
# WAS: exec `pgrep kg-ingestion-worker`. The Dockerfile builds the binary as `worker`
# (go build -o worker; CMD ["./worker"]), so pgrep matched no process and BOTH probes exited 1 —
# the pod could only CrashLoopBackOff. The service serves GET /health/live
# (cmd/kg-ingestion-worker/main.go), so probe that instead, like every sibling chart.
# Guarded by cmd/kg-ingestion-worker/main_test.go.
livenessProbe:
  httpGet:
    path: /health/live
    port: 8090
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /health/live
    port: 8090
  initialDelaySeconds: 5
  periodSeconds: 10

# Rolling deployment — master §Phase 17: surge by one, never go unavailable. maxUnavailable MUST
# stay 0: any other value trades zero-downtime for a faster rollout, which is the opposite of what
# the spec chose. Overridable per environment, but prod must not relax it.
strategy:
  type: RollingUpdate
  maxSurge: 1
  maxUnavailable: 0

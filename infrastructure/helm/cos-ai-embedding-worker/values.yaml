replicaCount: 2
image:
  repository: ''
  tag: 'latest'
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
  metricsPort: 9464
resources:
  requests:
    cpu: '500m'
    memory: '2Gi'
  limits:
    cpu: '2000m'
    memory: '8Gi'
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
env:
  OTEL_SERVICE_NAME: 'ai-embedding-worker'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
envFrom:
  # This service currently reads no secrets (only OTEL_SERVICE_NAME via env). Mark the secret
  # optional so the pod starts without it; add keys here if/when it needs credentials.
  - secretRef:
      name: cos-ai-embedding-worker-secrets
      optional: true
serviceAccount:
  create: true
  name: 'cos-ai-embedding-worker'
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cos-ai-embedding-worker
          topologyKey: kubernetes.io/hostname
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 20
  periodSeconds: 5

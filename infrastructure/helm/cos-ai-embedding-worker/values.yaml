replicaCount: 2
image:
  repository: ''
  tag: 'latest'
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
  metricsPort: 9464
resources:
  requests:
    cpu: '500m'
    memory: '2Gi'
  limits:
    cpu: '2000m'
    memory: '8Gi'
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
env:
  OTEL_SERVICE_NAME: 'ai-embedding-worker'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
  # Served by metrics.py; matches service.metricsPort and the prometheus.yml scrape target.
  PROMETHEUS_PORT: '9464'
envFrom:
  # This service currently reads no secrets (only OTEL_SERVICE_NAME via env). Mark the secret
  # optional so the pod starts without it; add keys here if/when it needs credentials.
  - secretRef:
      name: cos-ai-embedding-worker-secrets
      optional: true
serviceAccount:
  create: true
  name: 'cos-ai-embedding-worker'
affinity:
  # master:4650-4654 — schedule onto the pool this workload is sized for. Terraform labels each
  # managed node group `workload=<pool>` (infrastructure/terraform/aws/modules/eks/modules).
  #
  # REQUIRED, not preferred: a "preferred" rule silently falls back to any node the moment the pool
  # is full or missing, which is the failure this exists to prevent — an AI service quietly running
  # on a t3.xlarge behaves, just slowly, and nothing reports it.
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workload
              operator: In
              values: ['ai']
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cos-ai-embedding-worker
          topologyKey: kubernetes.io/hostname
livenessProbe:
  httpGet:
    path: /health/live
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health/live
    port: 8000
  initialDelaySeconds: 20
  periodSeconds: 5

# Rolling deployment — master §Phase 17: surge by one, never go unavailable. maxUnavailable MUST
# stay 0: any other value trades zero-downtime for a faster rollout, which is the opposite of what
# the spec chose. Overridable per environment, but prod must not relax it.
strategy:
  type: RollingUpdate
  maxSurge: 1
  maxUnavailable: 0

# The ai pool is tainted workload=ai:NoSchedule so ordinary web pods cannot pack onto the expensive
# instances these services are sized for. The taint keeps others OUT; this toleration is what lets
# this service IN. nodeAffinity above is the other half — without it this pod merely MAY sit there.
tolerations:
  - key: workload
    operator: Equal
    value: ai
    effect: NoSchedule

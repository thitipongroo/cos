replicaCount: 2
image:
  repository: ''
  tag: 'latest'
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
  metricsPort: 9464
resources:
  requests:
    cpu: '500m'
    memory: '1Gi'
  limits:
    cpu: '2000m'
    memory: '4Gi'
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
env:
  OTEL_SERVICE_NAME: 'ai-gateway'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
  # Served by metrics.py; matches service.metricsPort and the prometheus.yml scrape target.
  PROMETHEUS_PORT: '9464'
envFrom:
  - secretRef:
      name: cos-ai-gateway-secrets
serviceAccount:
  create: true
  name: 'cos-ai-gateway'
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cos-ai-gateway
          topologyKey: kubernetes.io/hostname
livenessProbe:
  httpGet:
    path: /health/live
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health/live
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 5

# Rolling deployment — master §Phase 17: surge by one, never go unavailable. maxUnavailable MUST
# stay 0: any other value trades zero-downtime for a faster rollout, which is the opposite of what
# the spec chose. Overridable per environment, but prod must not relax it.
strategy:
  type: RollingUpdate
  maxSurge: 1
  maxUnavailable: 0

{{- if .Values.networkPolicy.enabled }}
# Ingress policy for cos-credential-service (TDD OQ-46).
#
# WHY THIS EXISTS
# ---------------
# It issues, verifies and revokes W3C Verifiable Credentials, and §5.9.8 already says its `issue` / `verify` / `revoke` routes are mesh-only and must not be reachable at the edge. Its auth plugin has the same header trust as file-service, and `CredentialClientService` calls it with headers and no bearer token.
#
# The stated defence was Kong: verify the JWT at the edge, strip any client-supplied identity headers,
# inject the verified ones. **Kong is deployed nowhere.** `infrastructure/kubernetes/kong/kong-declarative.yml`
# is referenced by no ArgoCD Application, there are no `KongPlugin` CRDs, no chart carries an Ingress
# template, and the repository's only `kind: Ingress` names `ingressClassName: nginx`. So the header
# trust had no verifier in front of it, and this Service — ClusterIP, no Ingress, no NetworkPolicy, no
# service mesh — was reachable by every pod in the namespace.
#
# Product-owner decision 2026-08-22: close it at BOTH layers. This is the network half; the identity
# half is the service token the backend now sends (`ServiceTokenService`), and neither is sufficient
# alone. A NetworkPolicy answers "which pods may connect" — it does not authenticate them, and spec
# §5.4's Istio mTLS still exists nowhere.
#
# OFF BY DEFAULT (`networkPolicy.enabled`), for the reason the kg-ingestion-worker policy gives: these
# rules are schema-valid but have never been enforced in a live cluster. Two things to check first:
#
#   1. **Probes.** This chart's probes are `httpGet`, so the kubelet connects to the pod over the
#      network from the NODE address, which is not a pod and matches no `podSelector`. Whether that is
#      implicitly allowed depends on the CNI. Verify before enabling, or the pods CrashLoop.
#   2. **The allow-list is what this repository can see.** A port-forward, a debugging sidecar or a
#      caller added outside the repo will be denied. That is the point, but it must be a decision
#      rather than a surprise.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cos-credential-service.fullname" . }}
  labels: {{ include "cos-credential-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "cos-credential-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The backend is the only in-repository caller.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.backendPodLabel }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    # No second rule for Prometheus: this chart declares no separate metrics port — `service.port`
    # (3009) is the only one, and the rule above already opens it. Adding a `metricsPort` here means
    # adding it to values.yaml and the Service first, not just to this policy.
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "cos-file-service.fullname" . }}
  labels: {{ include "cos-file-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector: {{ include "cos-file-service.selectorLabels" . | nindent 4 }}

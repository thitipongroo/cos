replicaCount: 3

image:
  repository: '' # ECR_REGISTRY/cos-backend — set by CI
  tag: 'latest'

ingress:
  enabled: true
  host: 'api.construction-os.io'

resources:
  requests:
    cpu: '500m'
    memory: '768Mi'
  limits:
    cpu: '2000m'
    memory: '2Gi'

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 2

env:
  NODE_ENV: 'production'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.monitoring:4318'

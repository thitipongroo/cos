replicaCount: 2

image:
  repository: ''
  tag: 'latest'
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000
  metricsPort: 9464

ingress:
  enabled: false
  className: 'kong'
  host: ''
  tlsSecretName: 'cos-tls'

resources:
  requests:
    cpu: '250m'
    memory: '512Mi'
  limits:
    cpu: '1000m'
    memory: '1Gi'

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

env:
  NODE_ENV: 'production'
  PORT: '3000'
  OTEL_SERVICE_NAME: 'cos-backend'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
  # MFA Layer 2 kill switch (QM-4, ADR-067; runbook docs/runbooks/mfa-enforcement.md).
  #
  # Present in EVERY values file so ops can flip it with a values change rather than a chart edit.
  # It lived only in .env.example until 2026-08-23, which meant Layer 2 could not be turned on in a
  # cluster at all — the switch existed everywhere except where it would be thrown (TDD OQ-10).
  #
  # Stays 'false' here on purpose. Enabling it before the realm emits `acr` correctly locks out every
  # TENANT_ADMIN and FINANCE user, so activation is runbook Step 3: watch the `mfa.shortfall` WARN
  # lines until real traffic carries acr=gold, THEN set this true.
  MFA_ENFORCE: 'false'
  # The acr value that proves OTP, per the realm's acr.loa.map ({"silver":1,"gold":2} → level 2).
  # scripts/ci/check-keycloak-mfa-config.mjs prints the value the committed realm implies.
  MFA_REQUIRED_ACR: 'gold'
  # /api/v1/ai and /api/v1/rag reach the AI Gateway through this Deployment (TDD OQ-46). The gateway
  # is ClusterIP with no Ingress and the Kong route that was supposed to reach it is applied by no
  # ArgoCD Application, so without this the whole Phase 11/12 AI surface has no route.
  AI_GATEWAY_URL: 'http://cos-ai-gateway.cos.svc.cluster.local:8000'

# Post-deploy smoke test (§30.12) — rendered as an ArgoCD PostSync hook by
# templates/postsync-smoke-test.yaml. OFF here and ON in values-staging.yaml: staging auto-syncs on
# every merge to main so the check runs on every change, and production is promoted by hand
# afterwards by someone who can see whether staging went green (PO decision 2026-08-23).
#
# It needs the cos-smoke-test-config Secret in the same namespace: BASE_URL, KEYCLOAK_URL,
# KEYCLOAK_REALM, KEYCLOAK_CLIENT_ID, KEYCLOAK_CLIENT_SECRET, SMOKE_USER, SMOKE_PASSWORD.
# SMOKE_USER must NOT be TENANT_ADMIN or FINANCE — the realm refuses those on Direct Grant.
smokeTest:
  enabled: false

envFrom:
  - secretRef:
      name: cos-backend-secrets

serviceAccount:
  create: true
  name: 'cos-backend'

nodeSelector: {}
tolerations: []
affinity:
  # master:4650-4654 — schedule onto the pool this workload is sized for. Terraform labels each
  # managed node group `workload=<pool>` (infrastructure/terraform/aws/modules/eks/modules).
  #
  # REQUIRED, not preferred: a "preferred" rule silently falls back to any node the moment the pool
  # is full or missing, which is the failure this exists to prevent — an AI service quietly running
  # on a t3.xlarge behaves, just slowly, and nothing reports it.
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workload
              operator: In
              values: ['app']
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cos-backend
          topologyKey: kubernetes.io/hostname

# THE PREFIX IS PART OF THE PATH. main.ts calls setGlobalPrefix('api/v1') with no `exclude`, so
# @Controller('health') + @Get('live') is served at /api/v1/health/live — NOT /health/live.
#
# Corrected 2026-08-24. These probes read /health/live and /health/ready, which return 404: the
# liveness probe would fail three times and put the pod in CrashLoopBackOff, and readiness would
# never pass so it would take no traffic. The backend would not deploy at all.
#
# This is the exact failure the 2026-07-20 Linux POC recorded — "four charts probed a health path the
# service does not serve ... only a real deploy catches this, lint and dry-run do not". That round
# fixed four charts and flagged cos-file-service and cos-web as unverified; both were in fact
# correct, and the one nobody suspected was this one.
#
# Verified by request against a booted app: /health/live → 404, /api/v1/health/live → 200. The same
# prefixed path is what docker-compose.yml uses for this service's healthcheck and what
# tenant.middleware.ts exempts from tenant lookup.
#
# Every OTHER service in this repo serves /health/live unprefixed — do not "make this consistent"
# with them by shortening the path here; change setGlobalPrefix instead, and only after updating
# compose, the middleware and the auth integration test that all name the prefixed form.
livenessProbe:
  httpGet:
    path: /api/v1/health/live
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/v1/health/ready
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 5

# Rolling deployment — master §Phase 17: surge by one, never go unavailable. maxUnavailable MUST
# stay 0: any other value trades zero-downtime for a faster rollout, which is the opposite of what
# the spec chose. Overridable per environment, but prod must not relax it.
strategy:
  type: RollingUpdate
  maxSurge: 1
  maxUnavailable: 0

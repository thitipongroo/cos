apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cos-backend.fullname" . }}
  labels: {{ include "cos-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Rolling deployment with NO capacity loss — master §Phase 17 Deployment Strategy:
  # "Max surge: 1 pod / Max unavailable: 0 pods (zero-downtime rolling)".
  #
  # Added 2026-08-24. Without a strategy block Kubernetes applies its own defaults, maxSurge 25% and
  # maxUnavailable 25%, so every rollout could take a quarter of the pods down at once. Nothing
  # reports that: the deploy succeeds, capacity just dips and some requests are refused while it
  # does. The PodDisruptionBudget does not cover it either — a PDB constrains voluntary DRAINS, not
  # a Deployment's own rollout.
  strategy:
    type: {{ .Values.strategy.type }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
  selector:
    matchLabels: {{ include "cos-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "cos-backend.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.metricsPort }}"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom: {{ toYaml .Values.envFrom | nindent 12 }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          livenessProbe: {{ toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe: {{ toYaml .Values.readinessProbe | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}

{{- /*
Post-deploy smoke test — spec §30.12, run as an ArgoCD PostSync hook.

WHY IT LIVES IN THE CHART. It used to sit in infrastructure/kubernetes/argocd/, and an ArgoCD hook
only fires for manifests inside the SYNCED Application's source path. No Application syncs that
directory, so the hook never fired. Moving it to its own Application would not have helped either:
the hook would then run when the SMOKE TEST's Application syncs, which happens when this file
changes — not when the backend deploys. A PostSync hook has to be part of the thing whose sync it
follows, so it is a template of the cos-backend chart.

STAGING ONLY (PO decision 2026-08-23). `smokeTest.enabled` is false in values.yaml and true in
values-staging.yaml, so this renders for cos-backend-staging and not for production. Staging
auto-syncs on every merge to main, so the check runs on every change; production is promoted by
hand afterwards, by someone who can see whether staging went green.

The namespace is deliberately NOT set — it comes from the Application's destination, which is
cos-staging. It used to be hardcoded to `cos`, which is production, while the file's own comment
said it ran against staging.

§30.12 describes this as blocking "E2E wave 2". There is no wave 2: `sync-wave` appears once in the
whole repository, on this hook.
*/ -}}
{{- if .Values.smokeTest.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cos-backend.fullname" . }}-smoke-test
  labels:
    {{- include "cos-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cos-smoke-test
        app.kubernetes.io/component: smoke-test
    spec:
      restartPolicy: Never
      # Hardened on the ArgoCD manifest by origin/develop while this Job was being moved into the
      # chart; carried across in the merge rather than lost with the file it was written on.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke-test
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: curlimages/curl:8.7.1
          command: ['/bin/sh', '-c']
          args:
            - |
              set -euo pipefail
              START=$(date +%s)

              fail() { echo "SMOKE FAIL: $1" >&2; exit 1; }

              echo "→ [1/3] Health check"
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "${BASE_URL}/api/v1/health/ready") \
                || fail "health endpoint unreachable"
              [ "$STATUS" = "200" ] || fail "health returned HTTP ${STATUS}"
              echo "  ✓ /api/v1/health/ready → 200"

              echo "→ [2/3] Auth check"
              # --data-urlencode, not -d: an E.164 username starts with '+', which -d sends literally
              # and the server decodes as a SPACE.
              AUTH=$(curl -sf --max-time 10 -X POST \
                "${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token" \
                --data-urlencode "grant_type=password" \
                --data-urlencode "client_id=${KEYCLOAK_CLIENT_ID}" \
                --data-urlencode "client_secret=${KEYCLOAK_CLIENT_SECRET}" \
                --data-urlencode "username=${SMOKE_USER}" \
                --data-urlencode "password=${SMOKE_PASSWORD}") \
                || fail "Keycloak refused the grant (is SMOKE_USER privileged?)"
              TOKEN=$(echo "$AUTH" | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)
              [ -n "$TOKEN" ] || fail "Keycloak did not return an access_token"
              echo "  ✓ Keycloak token endpoint → access_token obtained"

              echo "→ [3/3] Core read check"
              P_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 \
                "${BASE_URL}/api/v1/projects" \
                -H "Authorization: Bearer ${TOKEN}") \
                || fail "projects endpoint unreachable"
              [ "$P_STATUS" = "200" ] || fail "projects returned HTTP ${P_STATUS}"
              echo "  ✓ /api/v1/projects → 200"

              END=$(date +%s)
              ELAPSED=$((END - START))
              echo "→ Smoke passed in ${ELAPSED}s"
              [ $ELAPSED -lt 30 ] || fail "exceeded 30s limit (${ELAPSED}s)"
          env:
            - name: BASE_URL
              valueFrom:
                secretKeyRef:
                  name: cos-smoke-test-config
                  key: BASE_URL
            # SMOKE_USER must be NON-PRIVILEGED. E2E_EMAIL (a TENANT_ADMIN) used to be wired here and
            # cannot work: the realm denies TENANT_ADMIN and FINANCE on Direct Grant.
            - name: SMOKE_USER
              valueFrom:
                secretKeyRef: { name: cos-smoke-test-config, key: SMOKE_USER }
            - name: SMOKE_PASSWORD
              valueFrom:
                secretKeyRef: { name: cos-smoke-test-config, key: SMOKE_PASSWORD }
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef: { name: cos-smoke-test-config, key: KEYCLOAK_URL }
            - name: KEYCLOAK_REALM
              valueFrom:
                secretKeyRef: { name: cos-smoke-test-config, key: KEYCLOAK_REALM }
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: cos-smoke-test-config, key: KEYCLOAK_CLIENT_ID }
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: cos-smoke-test-config, key: KEYCLOAK_CLIENT_SECRET }
{{- end }}

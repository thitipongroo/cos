replicaCount: 3

image:
  repository: '' # ECR_REGISTRY/cos-web — set by CI
  tag: 'latest'

ingress:
  enabled: true
  host: 'app.construction-os.io'

resources:
  requests:
    cpu: '250m'
    memory: '512Mi'
  limits:
    cpu: '1000m'
    memory: '1Gi'

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 2

env:
  NODE_ENV: 'production'
  NEXT_PUBLIC_API_URL: 'https://api.construction-os.io'

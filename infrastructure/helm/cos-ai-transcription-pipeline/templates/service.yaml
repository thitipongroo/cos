apiVersion: v1
kind: Service
metadata:
  name: {{ include "cos-ai-transcription-pipeline.fullname" . }}
  labels: {{ include "cos-ai-transcription-pipeline.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector: {{ include "cos-ai-transcription-pipeline.selectorLabels" . | nindent 4 }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cos-ai-transcription-pipeline.fullname" . }}
  labels: {{ include "cos-ai-transcription-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{ include "cos-ai-transcription-pipeline.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "cos-ai-transcription-pipeline.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.metricsPort }}"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        # Matches `useradd --system --uid 1001 cosuser` in the service Dockerfile.
        runAsUser: 1001
        fsGroup: 1001
        # RKE2 profile:cis enforces PodSecurity "restricted" — without seccompProfile the Pod is
        # REJECTED while the Deployment is still admitted (silent failure). DO NOT REMOVE (ADR-039).
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-transcription-pipeline
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom: {{ toYaml .Values.envFrom | nindent 12 }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          livenessProbe: {{ toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe: {{ toYaml .Values.readinessProbe | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # false (not true) to match the sibling FastAPI charts: the Python runtime writes
            # __pycache__, and faster-whisper caches its model under the home dir.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
      affinity: {{ toYaml .Values.affinity | nindent 8 }}

groups:
  - name: cos.platform
    interval: 60s
    rules:
      # ── KafkaDLQNonEmpty ──────────────────────────────────────────────────────
      # Source: spec §Phase 15 alerting rules
      - alert: KafkaDLQNonEmpty
        expr: kafka_dlq_depth > 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Kafka DLQ is not empty ({{ $labels.service }})'
          description: 'kafka_dlq_depth={{ $value }} for service={{ $labels.service }}. Messages are failing and piling in the DLQ.'
          runbook: 'https://docs.construction-os.internal/runbooks/kafka-dlq'

      # ── APIHighErrorRate ──────────────────────────────────────────────────────
      - alert: APIHighErrorRate
        expr: |
          (
            sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            /
            sum by (service) (rate(http_requests_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'High 5xx error rate on {{ $labels.service }}'
          description: '5xx error rate is {{ $value | humanizePercentage }} (threshold: 1%) for service={{ $labels.service }}'
          runbook: 'https://docs.construction-os.internal/runbooks/high-error-rate'

      # ── APIHighLatency ────────────────────────────────────────────────────────
      - alert: APIHighLatency
        expr: |
          histogram_quantile(0.99,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'P99 latency > 5s on {{ $labels.service }}'
          description: 'P99 HTTP latency is {{ $value }}s (threshold: 5s) for service={{ $labels.service }}'
          runbook: 'https://docs.construction-os.internal/runbooks/high-latency'

      # ── DBHighQueryTime ───────────────────────────────────────────────────────
      - alert: DBHighQueryTime
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(db_query_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'P95 DB query time > 1s on {{ $labels.service }}'
          description: 'P95 DB query duration is {{ $value }}s (threshold: 1s) for service={{ $labels.service }}'
          runbook: 'https://docs.construction-os.internal/runbooks/slow-queries'

      # ── AnalyticsSLABreach ────────────────────────────────────────────────────
      # master:4288-4289 sets TWO budgets: Executive P95 < 3s, PM P95 < 2s. This rule matched
      # /api/v1/analytics/.* against a single 3s threshold until 2026-08-29, so a PM dashboard at
      # 2.9s breached its budget by 45% and paged nobody. The PM paths are excluded here and carry
      # their own rule below; splitting rather than tightening keeps an in-spec executive dashboard
      # from paging on-call.
      - alert: AnalyticsSLABreach
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (
              rate(http_request_duration_seconds_bucket{path=~"/api/v1/analytics/.*",
                                                        path!~"/api/v1/analytics/(pm|projects)/.*"}[5m])
            )
          ) > 3
        for: 0m
        labels:
          severity: critical
          team: analytics
        annotations:
          summary: 'Analytics SLA breach: P95 > 3s'
          description: 'Analytics API P95 latency is {{ $value }}s (SLA: 3s). Immediate investigation required.'
          runbook: 'https://docs.construction-os.internal/runbooks/analytics-sla'

      # ── AnalyticsPMSLABreach ──────────────────────────────────────────────────
      # master:4289 — "PM Dashboard: P95 < 2 seconds". The three trend endpoints are included
      # because they back that dashboard's charts (master:4352-4356): a 2.9s cost-trend makes a 2s
      # PM dashboard impossible however fast the page's own query is.
      - alert: AnalyticsPMSLABreach
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (
              rate(http_request_duration_seconds_bucket{path=~"/api/v1/analytics/(pm|projects)/.*"}[5m])
            )
          ) > 2
        for: 0m
        labels:
          severity: critical
          team: analytics
        annotations:
          summary: 'PM dashboard SLA breach: P95 > 2s'
          description: 'PM dashboard P95 is {{ $value }}s against the 2s budget master:4289 sets. The executive budget is 3s and is a different rule.'
          runbook: 'https://docs.construction-os.internal/runbooks/analytics-sla'

      # ── AIHighTokenUsage ──────────────────────────────────────────────────────
      # Alert FINANCE and TENANT_ADMIN when token usage exceeds 80% of monthly quota.
      # Quota is tracked externally; this rule fires on the rolling 30d counter > threshold.
      # Source: spec §Phase 15 + §31-monitoring-observability
      - alert: AIHighTokenUsage
        expr: |
          sum by (tenant_id) (
            increase(ai_token_usage_total[30d])
          ) > (0.80 * on(tenant_id) group_left() cos_tenant_monthly_token_quota)
        for: 0m
        labels:
          severity: warning
          team: ai
          notify: finance,tenant_admin
        annotations:
          summary: 'AI token usage > 80% of monthly quota (tenant={{ $labels.tenant_id }})'
          description: 'Tenant {{ $labels.tenant_id }} has consumed {{ $value }} tokens (≥80% of monthly quota). Review usage or upgrade plan.'
          runbook: 'https://docs.construction-os.internal/runbooks/ai-token-quota'

      # ── ServiceDown ───────────────────────────────────────────────────────────
      # Source: spec §Phase 15 + §31.7 — page on-call; severity: critical
      - alert: ServiceDown
        expr: |
          kube_pod_status_ready{condition="true"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Pod not ready: {{ $labels.pod }} ({{ $labels.namespace }})'
          description: 'Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has not been ready for > 2 minutes. Check pod logs and events.'
          runbook: 'https://docs.construction-os.internal/runbooks/service-down'

      # ── DBConnectionExhausted ─────────────────────────────────────────────────
      # Source: spec §Phase 15 + §31.7 — page on-call; severity: critical
      - alert: DBConnectionExhausted
        expr: |
          pgbouncer_pools_client_active / pgbouncer_databases_pool_size > 0.95
        for: 0m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'PostgreSQL connection pool > 95% ({{ $labels.database }})'
          description: 'PgBouncer pool for database {{ $labels.database }} is {{ $value | humanizePercentage }} full. Scale connection pool or add replicas immediately.'
          runbook: 'https://docs.construction-os.internal/runbooks/db-connection-exhausted'

      # ── KafkaConsumerLagCritical ──────────────────────────────────────────────
      # Source: spec §Phase 15 + §31.7 — page on-call; severity: critical
      - alert: KafkaConsumerLagCritical
        expr: |
          kafka_consumer_lag > 50000
        for: 0m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Kafka consumer lag critical: {{ $labels.topic }} / {{ $labels.consumer_group }}'
          description: 'Consumer lag is {{ $value }} messages (threshold: 50,000) for topic={{ $labels.topic }}, group={{ $labels.consumer_group }}. Potential data processing outage.'
          runbook: 'https://docs.construction-os.internal/runbooks/kafka-partition-rebalance'

      # ── SafetyNotificationFailed ──────────────────────────────────────────────
      # Source: spec §Phase 15 + §31.7 — page security; severity: critical
      # Any safety notification stuck in pending must be investigated immediately.
      - alert: SafetyNotificationFailed
        expr: |
          notification_pending_total{notification_type="safety"} > 0
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: 'Safety notification pending delivery ({{ $value }} message(s))'
          description: 'There are {{ $value }} safety notification(s) pending delivery. Safety data must be authoritative — investigate Notification Service immediately.'
          runbook: 'https://docs.construction-os.internal/runbooks/safety-notification-failed'

      # ── TenantIsolationBreach ─────────────────────────────────────────────────
      # Source: spec §Phase 15 + §31.7 + §30.6 — page security lead immediately; severity: critical
      # Fired by synthetic probe CronJob every 5 min; result 0 = isolation check failed.
      - alert: TenantIsolationBreach
        expr: |
          tenant_isolation_check_result == 0
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: 'Tenant isolation check FAILED: {{ $labels.check_name }}'
          description: 'Synthetic probe {{ $labels.check_name }} returned 0 (FAIL). Possible cross-tenant data access. Escalate to security lead immediately.'
          runbook: 'https://docs.construction-os.internal/runbooks/tenant-isolation-breach'

      # ── DiskUsageHigh ─────────────────────────────────────────────────────────
      # Source: spec §Phase 15 + §31.7 — Slack notification; severity: warning
      - alert: DiskUsageHigh
        expr: |
          (
            kubelet_volume_stats_used_bytes
            / kubelet_volume_stats_capacity_bytes
          ) > 0.80
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'PersistentVolume > 80% full: {{ $labels.persistentvolumeclaim }}'
          description: 'PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is {{ $value | humanizePercentage }} full. Expand volume or clean up data.'
          runbook: 'https://docs.construction-os.internal/runbooks/disk-usage-high'

      # ── MemoryPressure ────────────────────────────────────────────────────────
      # Source: spec §Phase 15 + §31.7 — Slack notification; severity: warning
      - alert: MemoryPressure
        expr: |
          (
            container_memory_working_set_bytes{container!=""}
            / on(pod, container, namespace) kube_pod_container_resource_limits{resource="memory"}
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Pod memory > 85% of limit: {{ $labels.pod }} / {{ $labels.container }}'
          description: 'Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit for > 10 minutes. Risk of OOMKill.'
          runbook: 'https://docs.construction-os.internal/runbooks/memory-pressure'

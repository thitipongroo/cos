# Construction OS — Kafka Topic Definitions
# Source: context/00_master_construction_os.md §Phase 8 — EVENT-DRIVEN INFRASTRUCTURE
#
# Topic naming: {service}.{entity}.{event}
# Schema subject naming: {topic-name}-value
# Compatibility mode: BACKWARD_TRANSITIVE (all schemas must register before first producer use)
#
# Production:  replication_factor=3, min_isr=2
# Development: replication_factor=1, min_isr=1 (docker-compose override)
#
# Log compaction: enabled for entity state topics (project.project.*, etc.)
# Max message size: 1MB (large payloads → store in S3, reference in event)

topics:
  # ─── Construction / Project ─────────────────────────────────────────────────
  - name: project.project.created
    canonical_event: construction.project.created.v1
    partitions: 6
    replication_factor: 3
    retention_ms: 604800000 # 7 days
    cleanup_policy: delete
    max_message_bytes: 1048576

  - name: project.project.updated
    canonical_event: construction.project.updated.v1

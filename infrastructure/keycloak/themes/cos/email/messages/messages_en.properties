# Thai, then English, in one message (ADR-110 round 4). The realm has internationalisation off, so Keycloak always
# reads this bundle. Placeholders are the parent's: {0} link, {2} realm display name, {3} required actions,
# {4} link lifetime (formatted in English — Keycloak picks one locale per message).
# MessageFormat: a literal apostrophe is written ''.
executeActionsSubject=Construction OS — ตั้งค่าบัญชีของคุณ / Set up your account
executeActionsBody=ผู้ดูแลระบบได้สร้างหรือขอให้ปรับปรุงบัญชี Construction OS ของคุณ กรุณาคลิกลิงก์ด้านล่างเพื่อดำเนินการ: {3}\n\n{0}\n\nลิงก์นี้ใช้ได้ครั้งเดียว และหมดอายุภายใน {4}\nหากคุณไม่ได้คาดหวังอีเมลนี้ ไม่ต้องดำเนินการใด ๆ\n\n---\n\nAn administrator has created or asked you to update your Construction OS account. Click the link below to continue: {3}\n\n{0}\n\nThe link works once and expires within {4}.\nIf you were not expecting this email, you can ignore it.
executeActionsBodyHtml=<p>ผู้ดูแลระบบได้สร้างหรือขอให้ปรับปรุงบัญชี Construction OS ของคุณ กรุณาคลิกลิงก์ด้านล่างเพื่อดำเนินการ: {3}</p><p><a href="{0}">ตั้งค่าบัญชี</a></p><p>ลิงก์นี้ใช้ได้ครั้งเดียว และหมดอายุภายใน {4}<br>หากคุณไม่ได้คาดหวังอีเมลนี้ ไม่ต้องดำเนินการใด ๆ</p><hr><p>An administrator has created or asked you to update your Construction OS account. Click the link below to continue: {3}</p><p><a href="{0}">Set up your account</a></p><p>The link works once and expires within {4}.<br>If you were not expecting this email, you can ignore it.</p>
passwordResetSubject=Construction OS — รีเซ็ตรหัสผ่าน / Reset your password
passwordResetBody=มีการขอเปลี่ยนรหัสผ่านของบัญชี Construction OS ของคุณ หากเป็นคุณ กรุณาคลิกลิงก์ด้านล่าง\n\n{0}\n\nลิงก์นี้หมดอายุภายใน {3}\nหากไม่ใช่คุณ ไม่ต้องดำเนินการใด ๆ รหัสผ่านจะไม่ถูกเปลี่ยน\n\n---\n\nSomeone asked to change the password of your Construction OS account. If this was you, click the link below.\n\n{0}\n\nThe link expires within {3}.\nIf this was not you, ignore this email and nothing will change.
passwordResetBodyHtml=<p>มีการขอเปลี่ยนรหัสผ่านของบัญชี Construction OS ของคุณ หากเป็นคุณ กรุณาคลิกลิงก์ด้านล่าง</p><p><a href="{0}">รีเซ็ตรหัสผ่าน</a></p><p>ลิงก์นี้หมดอายุภายใน {3}<br>หากไม่ใช่คุณ ไม่ต้องดำเนินการใด ๆ รหัสผ่านจะไม่ถูกเปลี่ยน</p><hr><p>Someone asked to change the password of your Construction OS account. If this was you, click the link below.</p><p><a href="{0}">Reset your password</a></p><p>The link expires within {3}.<br>If this was not you, ignore this email and nothing will change.</p>
requiredAction.UPDATE_PASSWORD=ตั้งรหัสผ่าน / Set a password

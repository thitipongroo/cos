# Construction OS — Keycloak email theme (ADR-110 round 4).
#
# The invitation a SYSTEM_ADMIN sends a tenant's first administrator, and every admin reset link, are Keycloak
# executeActions emails. platform.users holds no locale and the realm has internationalisation off, so — like the
# §7.10 trial notices — each email is written in Thai, then English, in one message. Only the message bundle is
# overridden; the templates are the parent's.
parent=keycloak

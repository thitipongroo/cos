# Construction OS — Keycloak login theme (Path B email/password, §20.6.1 / QM-4).
#
# Path B credentials are entered on THIS Keycloak-hosted page (never an in-app form). The theme
# extends the stock `keycloak` login theme so the base login.ftl — and its stable element ids
# #username / #password / #kc-login that the E2E helper (tests/e2e/helpers/auth.ts) drives — are
# preserved unchanged. Only presentation is added: css/cos.css restyles the base markup to match
# mockup/00_login_flow/web/03 using the §32.7 dark tokens (navy page, slate-900 card, --cos-blue CTA).
#
# `styles` lists the parent's css/login.css FIRST (inherited — not provided by this theme, so it
# resolves from the parent) THEN css/cos.css (ours), so our rules layer on top of the base styles
# rather than replacing them.

parent=keycloak
import=common/keycloak
styles=css/login.css css/cos.css

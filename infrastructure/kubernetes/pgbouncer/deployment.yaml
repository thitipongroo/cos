# CLOUD: AWS — PgBouncer Deployment
# QM-18: pool_mode=transaction; path infrastructure/kubernetes/pgbouncer/
# Spec §Phase 17: APPLICATION DATABASE_URL must resolve to PgBouncer service, never to PostgreSQL :5432
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: cos
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/component: connection-pooler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
      containers:
        - name: pgbouncer
          image: pgbouncer/pgbouncer:1.23.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: pgbouncer
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGBOUNCER_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-secrets
                  key: db-host
            - name: PGBOUNCER_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-secrets
                  key: db-name
          resources:
            requests:
              cpu: '100m'
              memory: '64Mi'
            limits:
              cpu: '500m'
              memory: '256Mi'
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pgbouncer
                topologyKey: kubernetes.io/hostname

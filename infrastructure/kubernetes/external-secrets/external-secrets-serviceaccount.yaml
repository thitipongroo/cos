# ServiceAccount that the External Secrets Operator uses to authenticate to AWS Secrets Manager
# (IRSA). Referenced by the ClusterSecretStore `aws-secrets-manager` in cos-external-secrets.yml.
#
# The role-arn annotation is environment-specific (account ID) — set it at deploy time. The IAM
# role must grant secretsmanager:GetSecretValue + DescribeSecret on cos/production/* (see README.md).
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    # PLACEHOLDER — replace <ACCOUNT_ID> with the target AWS account at deploy time.
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/cos-external-secrets

# Construction OS — External Secrets (cloud / AWS EKS secret delivery)
#
# Implements the cloud secret-delivery path mandated by spec 08-enterprise-deployment §8.6 §207
# and 05-security-compliance §5.2: the External Secrets Operator (ESO) syncs AWS Secrets Manager
# secrets into native Kubernetes Secret objects, which each service's Helm chart consumes via
# `envFrom.secretRef` (values.yaml). The target Secret name is `cos-<service>-secrets` — exactly
# the name each chart expects. (Architecture decision 2026-06-29: Direction A — ESO + AWS SM.)
#
# Relationship to sealed-secrets/: the SealedSecrets under infrastructure/kubernetes/sealed-secrets/
# remain the git-committed / on-premise fallback path (spec 05 §5.2 — "Git-committed secrets use
# sealed-secrets"). On cloud/EKS, ESO (this file) is authoritative and produces the Secrets the
# charts mount; the runbook docs/runbooks/disaster-recovery/region-failure.md updates the same
# AWS SM secrets, so failover stays consistent.
#
# PREREQUISITES (AWS-side — not in this repo; populate before deploy):
#   1. External Secrets Operator installed in the cluster (namespace external-secrets).
#   2. An IAM role (IRSA) with secretsmanager:GetSecretValue on arn:aws:secretsmanager:*:*:secret:cos/production/*,
#      bound to ServiceAccount external-secrets/external-secrets-sa via the
#      eks.amazonaws.com/role-arn annotation. (ARN is environment-specific — set at deploy time.)
#   3. AWS Secrets Manager secrets named `cos/production/<KEY>` (one plaintext value per key),
#      matching the remoteRef.key entries below. This `cos/production/<KEY>` convention matches the
#      DR runbook (region-failure.md).
#
# REGION: ap-southeast-7 (Bangkok) is the production primary per QM-5 / spec §8.8. Must match the
# region where the cos/production/* secrets live.
#
# NOTE (residual coverage gap, pre-existing — NOT created here to avoid guessing):
#   cos-ai-embedding-worker and cos-ai-ocr-pipeline Helm charts reference `cos-<svc>-secrets` via
#   envFrom but have no defined secret keys anywhere in the repo (they read only OTEL/config, no
#   secrets). Their ExternalSecrets are intentionally omitted until their key set is confirmed from
#   code; otherwise their envFrom should be made optional or moved to a ConfigMap.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-7 # prod primary (QM-5 / spec §8.8) — must match where cos/production/* lives
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
# Backend — consolidates the former cos-backend-db / -auth / -messaging SealedSecrets into the
# single `cos-backend-secrets` the chart mounts. DATABASE_URL → role `cos` (privileged);
# APP_DATABASE_URL → role `app_user` (RLS-enforced, ADR-031); DIRECT_DATABASE_URL → migrations.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cos-backend
  namespace: cos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cos-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: cos/production/DATABASE_URL }
    - secretKey: APP_DATABASE_URL
      remoteRef: { key: cos/production/APP_DATABASE_URL }
    - secretKey: DIRECT_DATABASE_URL
      remoteRef: { key: cos/production/DIRECT_DATABASE_URL }
    - secretKey: REDIS_URL
      remoteRef: { key: cos/production/REDIS_URL }
    - secretKey: JWT_SECRET
      remoteRef: { key: cos/production/JWT_SECRET }
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef: { key: cos/production/KEYCLOAK_CLIENT_SECRET }
    - secretKey: KAFKA_BROKERS
      remoteRef: { key: cos/production/KAFKA_BROKERS }
---
# File Service — consolidates cos-file-service + cos-file-service-minio.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cos-file-service
  namespace: cos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cos-file-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: cos/production/AWS_ACCESS_KEY_ID }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: cos/production/AWS_SECRET_ACCESS_KEY }
    - secretKey: S3_BUCKET
      remoteRef: { key: cos/production/S3_BUCKET }
    - secretKey: MINIO_ENDPOINT
      remoteRef: { key: cos/production/MINIO_ENDPOINT }
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: cos/production/MINIO_ACCESS_KEY }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: cos/production/MINIO_SECRET_KEY }
---
# AI Gateway — LLM provider keys.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cos-ai-gateway
  namespace: cos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cos-ai-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: cos/production/OPENAI_API_KEY }
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: cos/production/ANTHROPIC_API_KEY }
    - secretKey: GEMINI_API_KEY
      remoteRef: { key: cos/production/GEMINI_API_KEY }
---
# Analytics Worker — ClickHouse connection.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cos-analytics-worker
  namespace: cos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cos-analytics-worker-secrets
    creationPolicy: Owner
  data:
    - secretKey: CLICKHOUSE_URL
      remoteRef: { key: cos/production/CLICKHOUSE_URL }
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef: { key: cos/production/CLICKHOUSE_PASSWORD }
---
# KG Ingestion Worker — Neo4j connection (URI/username kept in the secret to mirror the
# sealed-secrets path; NEO4J_PASSWORD is the sensitive value).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cos-kg-ingestion-worker
  namespace: cos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cos-kg-ingestion-worker-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEO4J_URI
      remoteRef: { key: cos/production/NEO4J_URI }
    - secretKey: NEO4J_USERNAME
      remoteRef: { key: cos/production/NEO4J_USERNAME }
    - secretKey: NEO4J_PASSWORD
      remoteRef: { key: cos/production/NEO4J_PASSWORD }
    # Bearer token for POST /admin/rebuild, which replays the whole topic from the oldest offset.
    # The worker fails closed without it: the endpoint refuses every request rather than opening.
    - secretKey: KG_ADMIN_TOKEN
      remoteRef: { key: cos/production/KG_ADMIN_TOKEN }
---
# Web (Next.js) — NextAuth + Keycloak web client.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cos-web
  namespace: cos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cos-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef: { key: cos/production/NEXTAUTH_SECRET }
    - secretKey: KEYCLOAK_WEB_CLIENT_SECRET
      remoteRef: { key: cos/production/KEYCLOAK_WEB_CLIENT_SECRET }

_format_version: '3.0'
_transform: true

# Kong Gateway declarative configuration
# Source: spec §Phase 16 — rate limits per route, JWT validation plugin, tenant routing
# Architecture: Internet → Cloudflare → AWS ALB → Kong Gateway → EKS services

services:
  # ── NestJS backend ────────────────────────────────────────────────────────
  - name: cos-backend
    url: http://cos-backend.cos.svc.cluster.local:3000
    connect_timeout: 5000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: backend-api
        paths: ['/api/v1']
        strip_path: false
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          header_names: [authorization]
          secret_is_base64: false
      - name: rate-limiting
        config:
          minute: 100
          policy: redis
          redis_host: redis.cos.svc.cluster.local
          redis_port: 6379
          fault_tolerant: true
          hide_client_headers: false
          error_code: 429
          error_message: 'Rate limit exceeded'
      - name: request-transformer
        config:
          add:
            headers:
              - 'x-forwarded-tenant:$(headers.x-tenant-id)'
      - name: correlation-id
        config:
          header_name: x-request-id
          generator: uuid
          echo_downstream: true

  # ── Auth endpoints: stricter rate limiting ────────────────────────────────
  - name: cos-backend-auth
    url: http://cos-backend.cos.svc.cluster.local:3000
    routes:
      - name: backend-auth
        paths: ['/api/v1/auth']
        strip_path: false
        methods: [POST, OPTIONS]
    plugins:
      - name: rate-limiting
        config:
          minute: 10
          policy: redis
          redis_host: redis.cos.svc.cluster.local
          redis_port: 6379
          limit_by: ip
          fault_tolerant: true
          error_code: 429
          error_message: 'Auth rate limit exceeded'
      # No JWT plugin on auth endpoints — these create tokens

  # ── File service: lower rate limit ────────────────────────────────────────
  - name: file-service
    url: http://file-service.cos.svc.cluster.local:3002
    routes:
      - name: file-api
        paths: ['/api/v1/files']
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS]
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          header_names: [authorization]
          secret_is_base64: false
      - name: rate-limiting
        config:
          minute: 20
          policy: redis
          redis_host: redis.cos.svc.cluster.local
          redis_port: 6379
          fault_tolerant: true
          error_code: 429

  # ── AI gateway ────────────────────────────────────────────────────────────
  - name: ai-gateway
    url: http://ai-gateway.cos.svc.cluster.local:8000
    routes:
      - name: ai-api
        paths: ['/api/v1/ai', '/api/v1/rag']
        strip_path: false
        methods: [GET, POST, OPTIONS]
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          header_names: [authorization]
          secret_is_base64: false
      - name: rate-limiting
        config:
          minute: 30
          policy: redis
          redis_host: redis.cos.svc.cluster.local
          redis_port: 6379
          fault_tolerant: true
          error_code: 429

  # ── Health endpoints: no auth, relaxed rate limit ─────────────────────────
  - name: backend-health
    url: http://cos-backend.cos.svc.cluster.local:3000
    routes:
      - name: health
        paths: ['/health']
        strip_path: false
        methods: [GET]
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          error_code: 429

plugins:
  # Global: propagate traceparent header from Cloudflare/upstream
  - name: request-transformer
    config:
      add:
        headers:
          - 'x-gateway-via:kong'

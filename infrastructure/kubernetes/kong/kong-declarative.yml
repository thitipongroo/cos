_format_version: '3.0'
_transform: true

# Kong Gateway declarative configuration
# Source: spec §Phase 16 — rate limits per route, JWT validation plugin, tenant routing
# Architecture: Internet → Cloudflare → AWS ALB → Kong Gateway → EKS services

services:
  # ── NestJS backend ────────────────────────────────────────────────────────
  - name: cos-backend
    url: http://cos-backend.cos.svc.cluster.local:3000
    connect_timeout: 5000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: backend-api
        paths: ['/api/v1']
        strip_path: false
        methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          header_names: [authorization]
          secret_is_base64: false
      - name: rate-limiting
        config:
          minute: 100
          policy: redis
          redis_host: redis.cos.svc.cluster.local
          redis_port: 6379
          fault_tolerant: true
          hide_client_headers: false
          error_code: 429
          error_message: 'Rate limit exceeded'
      - name: request-transformer
        config:
          add:
            headers:
              - 'x-forwarded-tenant:$(headers.x-tenant-id)'
      - name: correlation-id
        config:
          header_name: x-request-id
          generator: uuid
          echo_downstream: true

  # ── Auth endpoints: stricter rate limiting ────────────────────────────────
  - name: cos-backend-auth
    url: http://cos-backend.cos.svc.cluster.local:3000
    routes:
      - name: backend-auth
        paths: ['/api/v1/auth']
        strip_path: false
        methods: [POST, OPTIONS]
    plugins:
      - name: rate-limiting
        config:
          minute: 10
          policy: redis
          redis_host: redis.cos.svc.cluster.local
          redis_port: 6379
          limit_by: ip
          fault_tolerant: true
          error_code: 429
          error_message: 'Auth rate limit exceeded'
      # No JWT plugin on auth endpoints — these create tokens

  # ── File service: lower rate limit ────────────────────────────────────────
  - name: file-service
    url: http://file-service.cos.svc.cluster.local:3002
    routes:
      - name: file-api
        paths: ['/api/v1/files']
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS]
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          header_names: [authorization]
          secret_is_base64: false
      - name: rate-limiting
        config:
          minute: 20
          policy: redis
          redis_host: redis.cos.svc.cluster.local
          redis_port: 6379
          fault_tolerant: true
          error_code: 429
      # ── Identity forwarding (§5.9.4) ──────────────────────────────────────
      # file-service's auth plugin trusts x-tenant-id / x-user-id / x-user-role as "Kong-forwarded
      # verified claims" (services/file-service/src/plugins/auth.ts) — but nothing here ever set
      # them. The route was therefore both broken (mobile/web send only a Bearer token, so every
      # upload 401'd) and unsafe (a client that supplied the headers itself would have been believed,
      # i.e. acted as any tenant). Two plugins close both halves:
      #   1. remove — drop whatever the client sent, unconditionally.
      #   2. post-function — re-add them from the JWT the `jwt` plugin already verified.
      # post-function runs late in the access phase, so the token is available and its signature has
      # already been checked; a request that fails `jwt` never reaches it.
      - name: request-transformer
        config:
          remove:
            headers:
              - x-tenant-id
              - x-user-id
              - x-user-role
      - name: post-function
        config:
          access:
            # Claim names are authoritative per spec §5.4.1 / backend JwtPayload: `user_id` is the
            # platform user UUID and is deliberately NOT `sub` (that is the Keycloak user id).
            # Values are matched with a strict [%w_%-]+ class so a hostile claim cannot inject a
            # CR/LF or a quote into the header — a non-matching claim yields "", and the service's
            # auth plugin then 401s. Fail closed. Uses only sandbox-safe Lua (no `require`), so no
            # cluster-wide `untrusted_lua_sandbox_requires` relaxation is needed.
            - |
              local token = kong.ctx.shared.authenticated_jwt_token
              if not token then return end
              local b64 = token:match("^[^.]+%.([^.]+)%.")
              if not b64 then return end
              b64 = b64:gsub("-", "+"):gsub("_", "/")
              local pad = #b64 % 4
              if pad > 0 then b64 = b64 .. string.rep("=", 4 - pad) end
              local payload = ngx.decode_base64(b64) or ""
              local function claim(name)
                return payload:match('"' .. name .. '"%s*:%s*"([%w_%-]+)"') or ""
              end
              kong.service.request.set_header("x-tenant-id", claim("tenant_id"))
              kong.service.request.set_header("x-user-id", claim("user_id"))
              kong.service.request.set_header("x-user-role", claim("role"))

  # ── AI gateway ────────────────────────────────────────────────────────────
  - name: ai-gateway
    url: http://ai-gateway.cos.svc.cluster.local:8000
    routes:
      - name: ai-api
        paths: ['/api/v1/ai', '/api/v1/rag']
        strip_path: false
        methods: [GET, POST, OPTIONS]
    plugins:
      - name: jwt
        config:
          claims_to_verify: [exp]
          header_names: [authorization]
          secret_is_base64: false
      - name: rate-limiting
        config:
          # QM-7: AI/LLM endpoints = 20 req/min. Scoped per authenticated consumer (the `jwt` plugin
          # sets the Kong consumer from the verified token, and runs before rate-limiting). NOTE: do NOT
          # switch to `limit_by: header` on X-Tenant-Id — rate-limiting runs BEFORE the request-transformer
          # injects the verified header, so it would see the spoofable client value. True per-tenant
          # granularity needs a consumer→tenant mapping verified against a live Kong.
          minute: 20
          limit_by: consumer
          policy: redis
          redis_host: redis.cos.svc.cluster.local
          redis_port: 6379
          fault_tolerant: true
          error_code: 429
      # ── Identity forwarding (§5.9.4) ──────────────────────────────────────
      # ai-gateway derives the caller's tenant from a VERIFIED source (auth.py), never from a client
      # query/body param. Same pattern as the file-service route: strip anything the client sent, then
      # re-add x-tenant-id/x-user-id/x-user-role from the JWT the `jwt` plugin already verified. The
      # service ALSO re-verifies the token (defense-in-depth), and cross-checks it against this header.
      - name: request-transformer
        config:
          remove:
            headers:
              - x-tenant-id
              - x-user-id
              - x-user-role
      - name: post-function
        config:
          access:
            # Sandbox-safe Lua (no `require`); a hostile claim cannot inject CR/LF or a quote because
            # values are matched with a strict [%w_%-]+ class — a non-matching claim yields "".
            - |
              local token = kong.ctx.shared.authenticated_jwt_token
              if not token then return end
              local b64 = token:match("^[^.]+%.([^.]+)%.")
              if not b64 then return end
              b64 = b64:gsub("-", "+"):gsub("_", "/")
              local pad = #b64 % 4
              if pad > 0 then b64 = b64 .. string.rep("=", 4 - pad) end
              local payload = ngx.decode_base64(b64) or ""
              local function claim(name)
                return payload:match('"' .. name .. '"%s*:%s*"([%w_%-]+)"') or ""
              end
              kong.service.request.set_header("x-tenant-id", claim("tenant_id"))
              kong.service.request.set_header("x-user-id", claim("user_id"))
              kong.service.request.set_header("x-user-role", claim("role"))

  # ── CredentialService: public W3C DID/VC resolution only (ADR-019, §5.9.8) ──
  # Own host, not a path under api.*: only the two unauthenticated GETs a third-party verifier needs
  # are edge-exposed. issue / verify / revoke stay internal-mesh only and are deliberately absent here —
  # they must never be reachable from the internet.
  #
  # did:web mandates HTTPS, so this host must stay TLS-terminated (cert-manager `cos-credentials-tls`).
  # The DID and status-list URLs are baked into every credential already issued, so the host and both
  # path shapes are effectively permanent — DID_WEB_BASE_DOMAIN must match this host exactly.
  - name: credential-service
    url: http://credential-service.cos.svc.cluster.local:3009
    routes:
      - name: credential-public-did
        hosts: ['credentials.construction-os.io']
        # Kong 3.x: `~` marks a regex path. Anchored so nothing else on the service is exposed.
        paths:
          - '~/tenants/[^/]+/did\.json$'
          - '~/tenants/[^/]+/status-lists/[^/]+$'
        strip_path: false
        methods: [GET, OPTIONS]
    plugins:
      # No jwt plugin: a third-party verifier holds no platform identity (BG-001).
      - name: request-transformer
        config:
          remove:
            # §5.9.8 (S): the service's auth plugin trusts these headers as gateway-set. Strip anything
            # a client supplies so a public request can never present itself as an authenticated one.
            headers:
              - x-tenant-id
              - x-user-id
              - x-user-role
      - name: rate-limiting
        config:
          minute: 60
          policy: redis
          redis_host: redis.cos.svc.cluster.local
          redis_port: 6379
          limit_by: ip # unauthenticated — no consumer to key on
          fault_tolerant: true
          error_code: 429
          error_message: 'Rate limit exceeded'

  # ── Health endpoints: no auth, relaxed rate limit ─────────────────────────
  - name: backend-health
    url: http://cos-backend.cos.svc.cluster.local:3000
    routes:
      - name: health
        paths: ['/health']
        strip_path: false
        methods: [GET]
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          error_code: 429

plugins:
  # Global: propagate traceparent header from Cloudflare/upstream
  - name: request-transformer
    config:
      add:
        headers:
          - 'x-gateway-via:kong'

# Sealed Secrets for Construction OS — Kubernetes (git-committed / on-premise secret path)
# Source: spec §Phase 16 — "Kubernetes Secrets + sealed-secrets (kubeseal)"
# NO plaintext secrets in this file — all values are kubeseal-encrypted blobs.
#
# These SealedSecrets produce the SAME `cos-<service>-secrets` Secret names that each Helm chart
# mounts via envFrom — identical to the External Secrets path (../external-secrets/). On cloud/EKS,
# ESO + AWS Secrets Manager is authoritative (architecture decision 2026-06-29, Direction A); this
# sealed-secrets path is the git-committed / on-premise alternative. Apply ONLY ONE path per cluster
# (cloud → ESO; on-prem → sealed-secrets) — both own the same Secret names and would otherwise collide.
#
# To re-seal: kubeseal --controller-name=sealed-secrets --controller-namespace=kube-system \
#               --format yaml < plaintext-secret.yaml > sealed-secret.yaml
#
# IMPORTANT: These are PLACEHOLDER seals. Re-encrypt with your cluster's sealing key before deploying.
#            The encrypted data below will NOT decrypt on a real cluster unless sealed with its key.

---
# Backend (NestJS) — consolidated DB + auth + messaging into the single `cos-backend-secrets`
# the chart mounts. DATABASE_URL → privileged `cos` role (platform/cross-tenant); APP_DATABASE_URL →
# non-superuser `app_user` role for tenant-scoped RLS-enforced queries (ADR-031); DIRECT_DATABASE_URL →
# Prisma migrations. Without APP_DATABASE_URL the app falls back to DATABASE_URL (cos superuser) and
# RLS is silently bypassed (backend/src/modules/tenant/prisma/tenant-prisma.service.ts).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cos-backend-secrets
  namespace: cos
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: 'false'
spec:
  encryptedData:
    DATABASE_URL: PLACEHOLDER_SEAL_BACKEND_DB_URL
    APP_DATABASE_URL: PLACEHOLDER_SEAL_BACKEND_APP_DB_URL
    DIRECT_DATABASE_URL: PLACEHOLDER_SEAL_BACKEND_DIRECT_DB_URL
    REDIS_URL: PLACEHOLDER_SEAL_REDIS_URL
    JWT_SECRET: PLACEHOLDER_SEAL_JWT_SECRET
    KEYCLOAK_CLIENT_SECRET: PLACEHOLDER_SEAL_KEYCLOAK_SECRET
    KAFKA_BROKERS: PLACEHOLDER_SEAL_KAFKA_BROKERS
  template:
    metadata:
      name: cos-backend-secrets
      namespace: cos
    type: Opaque


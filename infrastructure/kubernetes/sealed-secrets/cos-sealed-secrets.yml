# Sealed Secrets for Construction OS — Kubernetes
# Source: spec §Phase 16 — "Kubernetes Secrets + sealed-secrets (kubeseal)"
# NO plaintext secrets in this file — all values are kubeseal-encrypted blobs.
#
# To re-seal: kubeseal --controller-name=sealed-secrets --controller-namespace=kube-system \
#               --format yaml < plaintext-secret.yaml > sealed-secret.yaml
#
# IMPORTANT: These are PLACEHOLDER seals. Re-encrypt with your cluster's sealing key
#            before deploying. The encrypted data below will NOT decrypt on a real cluster
#            unless it was sealed with that cluster's key.

---
# Backend NestJS database credentials
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cos-backend-db
  namespace: cos
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: 'false'
spec:
  encryptedData:
    DATABASE_URL: PLACEHOLDER_SEAL_BACKEND_DB_URL
    REDIS_URL: PLACEHOLDER_SEAL_REDIS_URL
  template:
    metadata:
      name: cos-backend-db
      namespace: cos
    type: Opaque

---
# Backend JWT / auth secrets
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cos-backend-auth
  namespace: cos
spec:
  encryptedData:
    JWT_SECRET: PLACEHOLDER_SEAL_JWT_SECRET
    KEYCLOAK_CLIENT_SECRET: PLACEHOLDER_SEAL_KEYCLOAK_SECRET
  template:
    metadata:
      name: cos-backend-auth
      namespace: cos
    type: Opaque

---
# AI Gateway secrets (LLM API keys)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cos-ai-gateway
  namespace: cos
spec:
  encryptedData:
    OPENAI_API_KEY: PLACEHOLDER_SEAL_OPENAI_KEY
    ANTHROPIC_API_KEY: PLACEHOLDER_SEAL_ANTHROPIC_KEY
    GEMINI_API_KEY: PLACEHOLDER_SEAL_GEMINI_KEY
  template:
    metadata:
      name: cos-ai-gateway
      namespace: cos
    type: Opaque

---
# File service — S3 / storage credentials
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cos-file-service
  namespace: cos
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: PLACEHOLDER_SEAL_FILE_S3_KEY_ID
    AWS_SECRET_ACCESS_KEY: PLACEHOLDER_SEAL_FILE_S3_SECRET
    S3_BUCKET: PLACEHOLDER_SEAL_FILE_S3_BUCKET
  template:
    metadata:
      name: cos-file-service
      namespace: cos
    type: Opaque

---
# KG Ingestion Worker — Neo4j credentials
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cos-kg-ingestion-worker
  namespace: cos
spec:
  encryptedData:
    NEO4J_URI: PLACEHOLDER_SEAL_NEO4J_URI
    NEO4J_USERNAME: PLACEHOLDER_SEAL_NEO4J_USER
    NEO4J_PASSWORD: PLACEHOLDER_SEAL_NEO4J_PASSWORD
  template:
    metadata:
      name: cos-kg-ingestion-worker
      namespace: cos
    type: Opaque

---
# Analytics Worker
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cos-analytics-worker
  namespace: cos
spec:
  encryptedData:
    CLICKHOUSE_URL: PLACEHOLDER_SEAL_CLICKHOUSE_URL
    CLICKHOUSE_PASSWORD: PLACEHOLDER_SEAL_CLICKHOUSE_PASSWORD
  template:
    metadata:
      name: cos-analytics-worker
      namespace: cos
    type: Opaque

---
# Cloudflare API token (for Terraform + DNS)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cos-cloudflare
  namespace: cos
spec:
  encryptedData:
    CLOUDFLARE_API_TOKEN: PLACEHOLDER_SEAL_CF_API_TOKEN
    CLOUDFLARE_ZONE_ID: PLACEHOLDER_SEAL_CF_ZONE_ID
  template:
    metadata:
      name: cos-cloudflare
      namespace: cos
    type: Opaque

---
# Monitoring — Grafana admin password
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cos-grafana
  namespace: monitoring
spec:
  encryptedData:
    admin-password: PLACEHOLDER_SEAL_GRAFANA_ADMIN_PASSWORD
    admin-user: PLACEHOLDER_SEAL_GRAFANA_ADMIN_USER
  template:
    metadata:
      name: cos-grafana
      namespace: monitoring
    type: Opaque

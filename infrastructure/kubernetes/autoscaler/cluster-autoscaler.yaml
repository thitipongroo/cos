# CLOUD: AWS EKS Cluster Autoscaler
# Docs: https://github.com/kubernetes/autoscaler/tree/master/cluster-autoscaler
# Requires: IRSA service account with AutoscalingFullAccess on the node groups

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  annotations:
    # CLOUD: AWS IRSA — set to the IAM role ARN created by Terraform
    eks.amazonaws.com/role-arn: 'arn:aws:iam::ACCOUNT_ID:role/cos-cluster-autoscaler'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
rules:
  # `endpoints` was dropped from this rule on 2026-08-29, leaving events alone.
  #
  # Upstream still ships it, but upstream ships it for every version of the component at once. This
  # deployment runs v1.29.0, whose main.go sets `ResourceLock: resourcelock.LeasesResourceLock` and
  # never touches endpoints for leader election — and the Deployment below does not override
  # --leader-elect-resource-lock, so it takes that default. The coordination.k8s.io/leases rules
  # further down are what the lock actually uses.
  #
  # Keeping it was write access to every Endpoints object in the cluster, which is a service-traffic
  # redirection primitive (Trivy KSV-0056), granted to a component that does not read it.
  # If a future version reverts to endpoint-based locking, the pod fails leader election loudly at
  # startup rather than silently — restore the permission then, with the version that needs it named.
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ['']
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: ['']
    resources: [pods/status]
    verbs: [update]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [watch, list, get, update]
  - apiGroups: ['']
    resources:
      [
        namespaces,
        pods,
        services,
        replicationcontrollers,
        persistentvolumeclaims,
        persistentvolumes,
      ]
    verbs: [watch, list, get]
  - apiGroups: [extensions]
    resources: [replicasets, daemonsets]
    verbs: [watch, list, get]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [watch, list]
  - apiGroups: [apps]
    resources: [statefulsets, replicasets, daemonsets]
    verbs: [watch, list, get]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes, csidrivers, csistoragecapacities]
    verbs: [watch, list, get]
  - apiGroups: [batch, extensions]
    resources: [jobs]
    verbs: [get, list, watch, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resourceNames: [cluster-autoscaler]
    resources: [leases]
    verbs: [get, update]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8085'
    spec:
      serviceAccountName: cluster-autoscaler
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.29.0
          name: cluster-autoscaler
          resources:
            requests:
              cpu: 100m
              memory: 600Mi
            limits:
              cpu: 100m
              memory: 600Mi
          command:
            - ./cluster-autoscaler
            - --v=4
            - --stderrthreshold=info
            - --cloud-provider=aws
            - --skip-nodes-with-local-storage=false
            - --expander=least-waste
            - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled,k8s.io/cluster-autoscaler/cos-eks
            - --balance-similar-node-groups
            - --skip-nodes-with-system-pods=false
            - --scale-down-delay-after-add=10m
            - --scale-down-unneeded-time=10m
          volumeMounts:
            - name: ssl-certs
              mountPath: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: ssl-certs
          hostPath:
            path: /etc/ssl/certs/ca-bundle.crt
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

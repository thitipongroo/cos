# STAGING Applications — auto-sync ON, deliberately unlike the production set above.
#
# QM-16 and the Phase 19 checklist split the two: staging auto-syncs on every image-tag update,
# production waits for a manual sync gate in the ArgoCD UI. Added 2026-08-07 (product-owner
# decision: same cluster, separate namespace).
#
# Same cluster (https://kubernetes.default.svc), namespace `cos-staging` — see the AppProject
# destinations at the top of this file. The OTel collector stays in `monitoring` in both
# environments and is a kustomize overlay, not a Helm chart, so it takes the staging overlay path
# rather than a values file.
# ══════════════════════════════════════════════════════════════════════════════

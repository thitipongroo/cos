# ─── Temporal Worker ──────────────────────────────────────────────────────────
# Executes the backend's workflows: procurement (RFQ + PO state machines),
# enterprise-provisioning and data-export. Runs the cos-backend IMAGE with a different command, so
# the image tag here must be updated by the same GitOps commit that updates cos-backend — a worker
# running older activities than the API that signals them is a silent version skew.
#
# Added 2026-08-22. Before this, no worker was launched anywhere: the Temporal server accepted every
# workflow and no process polled a task queue, so `POST /procurement/rfqs/:id/publish` returned 200
# and the RFQ stayed DRAFT (TDD OQ-32).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cos-temporal-worker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: construction-os
  source:
    repoURL: https://github.com/construction-os/construction-os
    targetRevision: main
    path: infrastructure/helm/cos-temporal-worker
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cos
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m
        factor: 2


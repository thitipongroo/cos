# ArgoCD Application manifests — GitOps sync for all Construction OS services
# Deploy: kubectl apply -f infrastructure/kubernetes/argocd/argocd-apps.yaml -n argocd
# Each app watches infrastructure/helm/<chart> in this repo.
#
# PRODUCTION SYNC IS MANUAL — do not add `syncPolicy.automated` to these Applications.
# Every Application here uses values-prod.yaml on targetRevision: main. QM-16 and the Phase 19
# readiness checklist require production promotion to be a MANUAL sync gate in the ArgoCD UI, with
# auto-sync limited to staging. Until 2026-08-07 all ten carried `automated: {prune, selfHeal}`,
# so a push to main deployed straight to production with no gate — the exact thing that gate exists
# to prevent. The blocks were removed; `retry` and `syncOptions` are unaffected.
#
# STAGING auto-syncs — the ten `*-staging` Applications at the bottom of this file. Same cluster,
# namespace `cos-staging` (product-owner decision 2026-08-07), each on its chart's values-staging.yaml.
# That is the split QM-16 requires: staging syncs itself, production waits for a human.
#
# Note for Phase 19: its automated check greps for an application literally named `cos-staging`.
# The staging apps here are named per service (`cos-backend-staging`, …) because ArgoCD Applications
# are per-chart, not per-environment. Update the check to match, or it reports a false failure.

# ─── AppProject ───────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: construction-os
  namespace: argocd
spec:
  description: Construction OS application project
  sourceRepos:
    - 'https://github.com/construction-os/construction-os'
  destinations:
    - namespace: cos
      server: https://kubernetes.default.svc
    # Staging shares the cluster and gets its own namespace (product-owner decision 2026-08-07).
    # Without this entry ArgoCD rejects every *-staging Application as an invalid destination.
    - namespace: cos-staging
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota

---
# ─── Backend ──────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cos-backend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: construction-os
  source:
    repoURL: https://github.com/construction-os/construction-os
    targetRevision: main
    path: infrastructure/helm/cos-backend
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cos
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m
        factor: 2


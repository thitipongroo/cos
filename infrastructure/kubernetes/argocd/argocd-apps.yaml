# ArgoCD Application manifests — GitOps sync for all Construction OS services
# Deploy: kubectl apply -f infrastructure/kubernetes/argocd/argocd-apps.yaml -n argocd
# Each app watches infrastructure/helm/<chart> in this repo and auto-syncs on push

# ─── AppProject ───────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: construction-os
  namespace: argocd
spec:
  description: Construction OS application project
  sourceRepos:
    - 'https://github.com/construction-os/construction-os'
  destinations:
    - namespace: cos
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota

---
# ─── Backend ──────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cos-backend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: construction-os
  source:
    repoURL: https://github.com/construction-os/construction-os
    targetRevision: main
    path: infrastructure/helm/cos-backend
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m
        factor: 2


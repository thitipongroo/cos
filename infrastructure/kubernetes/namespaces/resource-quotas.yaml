# Resource quotas per namespace — prevent runaway resource consumption
# Apply: kubectl apply -f infrastructure/kubernetes/namespaces/resource-quotas.yaml

---
# ─── cos namespace (all application workloads) ────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: cos
  labels:
    app.kubernetes.io/managed-by: argocd
    environment: production

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cos-quota
  namespace: cos
spec:
  hard:
    requests.cpu: '20'
    requests.memory: 40Gi
    limits.cpu: '60'
    limits.memory: 120Gi
    pods: '100'
    services: '30'
    persistentvolumeclaims: '20'
    secrets: '50'
    configmaps: '50'

---
apiVersion: v1
kind: LimitRange
metadata:
  name: cos-limits
  namespace: cos
spec:
  limits:
    - type: Container
      default:
        cpu: '500m'
        memory: '512Mi'
      defaultRequest:
        cpu: '100m'
        memory: '128Mi'
      max:
        cpu: '4000m'
        memory: '8Gi'
      min:
        cpu: '50m'
        memory: '64Mi'
    - type: Pod
      max:
        cpu: '8000m'
        memory: '16Gi'

---
# ─── monitoring namespace (Prometheus, Grafana, Loki, Jaeger, OTel) ───────────
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/managed-by: argocd

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: '8'
    requests.memory: 20Gi
    limits.cpu: '20'
    limits.memory: 50Gi
    pods: '40'
    persistentvolumeclaims: '20'

---
# ─── kafka namespace ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    app.kubernetes.io/managed-by: argocd

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kafka-quota
  namespace: kafka
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 8Gi
    limits.cpu: '12'
    limits.memory: 24Gi
    pods: '20'
    persistentvolumeclaims: '10'

---
# ─── argocd namespace ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: argocd

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: argocd-quota
  namespace: argocd
spec:
  hard:
    requests.cpu: '2'
    requests.memory: 4Gi
    limits.cpu: '6'
    limits.memory: 12Gi
    pods: '20'

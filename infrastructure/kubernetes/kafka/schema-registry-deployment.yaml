# Confluent Schema Registry Deployment + Service — Phase 8
# Compatibility mode: BACKWARD_TRANSITIVE (spec §32.4; C-NEW-1 resolved 2026-05-27)
# Image: confluentinc/cp-schema-registry:7.6.0 (matches docker-compose.yml)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: cos
  labels:
    app: schema-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema-registry
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          image: confluentinc/cp-schema-registry:7.6.0
          ports:
            - containerPort: 8081
              name: http
          env:
            # Use pod IP as host name — ensures unique identity per replica
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Bootstrap all 3 Kafka brokers via headless DNS
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: 'kafka-0.kafka-headless.cos.svc.cluster.local:9092,kafka-1.kafka-headless.cos.svc.cluster.local:9092,kafka-2.kafka-headless.cos.svc.cluster.local:9092'
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: '3'
            # BACKWARD_TRANSITIVE: new schema must be readable by ALL previous versions (spec §32.4)
            - name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL
              value: 'BACKWARD_TRANSITIVE'
            - name: SCHEMA_REGISTRY_LISTENERS
              value: 'http://0.0.0.0:8081'
          resources:
            requests:
              cpu: '200m'
              memory: '512Mi'
            limits:
              cpu: '1'
              memory: '1Gi'
          readinessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: cos
  labels:
    app: schema-registry
spec:
  selector:
    app: schema-registry
  ports:
    - name: http
      port: 8081
      targetPort: 8081

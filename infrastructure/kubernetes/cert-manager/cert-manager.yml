# cert-manager manifests — TLS for all COS ingress
# Source: spec §Phase 16 — TLS 1.3 minimum on all ingress (Kubernetes Ingress + cert-manager)
#
# Prerequisites:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.0/cert-manager.yaml
#
# Architecture: cert-manager issues Let's Encrypt certificates for all COS domains
#               and stores them as Kubernetes TLS Secrets for Ingress resources.

---
# ClusterIssuer: Let's Encrypt production (ACME HTTP-01 or DNS-01)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@construction-os.io
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      # DNS-01 via Cloudflare (preferred — no HTTP challenge routing needed)
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cos-cloudflare
              key: CLOUDFLARE_API_TOKEN
        selector:
          dnsZones:
            - construction-os.io
            - '*.construction-os.io'

---
# ClusterIssuer: Let's Encrypt staging (for testing — avoids rate limits)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@construction-os.io
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cos-cloudflare
              key: CLOUDFLARE_API_TOKEN
        selector:
          dnsZones:
            - construction-os.io

---
# Certificate: api.construction-os.io (main backend + Kong ingress)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cos-api-tls
  namespace: cos
spec:
  secretName: cos-api-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - api.construction-os.io
    - '*.api.construction-os.io'
  duration: 2160h # 90 days
  renewBefore: 360h # Renew 15 days before expiry
  usages:
    - server auth
    - client auth

---
# Certificate: app.construction-os.io (Next.js web app)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cos-web-tls
  namespace: cos
spec:
  secretName: cos-web-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - app.construction-os.io
  duration: 2160h
  renewBefore: 360h
  usages:
    - server auth

---
# Ingress for cos-backend with TLS (example — Helm values override in production)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cos-backend-ingress
  namespace: cos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    # TLS 1.3 minimum per spec §Phase 16
    nginx.ingress.kubernetes.io/ssl-protocols: 'TLSv1.3'
    nginx.ingress.kubernetes.io/ssl-ciphers: 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.construction-os.io
      secretName: cos-api-tls-secret
  rules:
    - host: api.construction-os.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cos-backend
                port:
                  number: 3000
